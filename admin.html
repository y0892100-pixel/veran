<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - VAREN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; display: none; }
    .toast.show { display: block; }
    .toast.success { background: #16a34a; }
    .toast.error { background: #dc2626; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <a href="index.html" class="text-2xl font-bold text-gray-900">VAREN</a>
    <div class="hidden md:flex gap-8">
      <a href="index.html" class="font-medium hover:text-gray-600">الرئيسية</a>
      <a href="category.html?gender=women" class="font-medium hover:text-gray-600">نسائي</a>
      <a href="category.html?gender=men" class="font-medium hover:text-gray-600">رجالي</a>
      <a href="category.html?gender=girls" class="font-medium hover:text-gray-600">بنات</a>
      <a href="category.html?gender=boys" class="font-medium hover:text-gray-600">أولاد</a>
    </div>
    <div class="flex items-center gap-4">
      <a href="cart.html" class="text-xl relative">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
      </a>
      <div id="user-area"></div>
    </div>
  </div>
</nav>

<main class="max-w-4xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-6">لوحة التحكم</h1>

  <!-- أزرار التحكم -->
  <div id="admin-buttons" class="hidden flex flex-wrap gap-4 mb-8">
    <button onclick="showForm('add')" class="bg-black text-white px-6 py-2 rounded-lg hover:bg-gray-800">إضافة منتج جديد</button>
    <button onclick="location.href='admin-orders.html'" class="bg-gray-200 px-6 py-2 rounded-lg hover:bg-gray-300">إدارة الطلبات</button>
  </div>

  <!-- نموذج إضافة منتج -->
  <form id="add-product-form" class="bg-white p-6 rounded-xl shadow-md space-y-4 hidden">
    <h2 class="text-xl font-bold mb-4">إضافة منتج جديد</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div>
        <label class="block font-semibold mb-1">اسم المنتج *</label>
        <input type="text" id="p-name" class="w-full border rounded-lg p-3" required>
      </div>
      <div>
        <label class="block font-semibold mb-1">الكمية المتوفرة (المخزون) *</label>
        <input type="number" id="p-stock" class="w-full border rounded-lg p-3" min="0" value="1" required>
      </div>
      <div>
        <label class="block font-semibold mb-1">السعر الأصلي (قبل الخصم)</label>
        <input type="number" id="p-price-original" class="w-full border rounded-lg p-3" placeholder="اختياري">
      </div>
      <div>
        <label class="block font-semibold mb-1">السعر الحالي (بالدرهم) *</label>
        <input type="number" id="p-price" class="w-full border rounded-lg p-3" required>
      </div>
      <div>
        <label class="block font-semibold mb-1">التصنيف *</label>
        <select id="p-gender" class="w-full border rounded-lg p-3">
          <option value="women">نسائي</option>
          <option value="men">رجالي</option>
          <option value="girls">بنات</option>
          <option value="boys">أولاد</option>
        </select>
      </div>
      <div>
        <label class="block font-semibold mb-1">النوع</label>
        <input type="text" id="p-type" class="w-full border rounded-lg p-3" placeholder="هودي / تيشيرت / فستان / عطر / حذاء...">
      </div>
      <div>
        <label class="block font-semibold mb-1">الموسم</label>
        <select id="p-season" class="w-full border rounded-lg p-3">
          <option value="">غير محدد</option>
          <option value="winter">شتوي</option>
          <option value="summer">صيفي</option>
          <option value="formal">رسمي</option>
        </select>
      </div>
      <div>
        <label class="block font-semibold mb-1">حالة التوفر</label>
        <select id="p-available" class="w-full border rounded-lg p-3">
          <option value="true" selected>متوفر ✅</option>
          <option value="false">غير متوفر ❌</option>
        </select>
      </div>
      <div class="md:col-span-2">
        <label class="block font-semibold mb-2">الألوان المتاحة</label>
        <div class="flex flex-wrap gap-3">
          <label class="flex items-center gap-1"><input type="checkbox" name="colors" value="أسود"> أسود</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="colors" value="أبيض"> أبيض</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="colors" value="رمادي"> رمادي</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="colors" value="بيج"> بيج</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="colors" value="أحمر"> أحمر</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="colors" value="أزرق"> أزرق</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="colors" value="أخضر"> أخضر</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="colors" value="وردي"> وردي</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="colors" value="بني"> بني</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="colors" value="برتقالي"> برتقالي</label>
        </div>
      </div>
      <div class="md:col-span-2">
        <label class="block font-semibold mb-2">المقاسات المتاحة</label>
        <div class="flex flex-wrap gap-3">
          <label class="flex items-center gap-1"><input type="checkbox" name="sizes" value="XS"> XS</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="sizes" value="S"> S</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="sizes" value="M"> M</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="sizes" value="L"> L</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="sizes" value="XL"> XL</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="sizes" value="XXL"> XXL</label>
        </div>
      </div>
      <div class="md:col-span-2">
        <label class="block font-semibold mb-1">روابط الصور (كل رابط في سطر)</label>
        <textarea id="p-images" class="w-full border rounded-lg p-3" rows="4" placeholder="أدخل رابط كل صورة في سطر منفصل"></textarea>
      </div>
    </div>
    <button type="submit" class="bg-black text-white px-6 py-3 rounded-lg text-lg hover:bg-gray-800 w-full">إضافة المنتج</button>
  </form>

  <!-- قائمة المنتجات المضافة -->
  <div id="products-section" class="hidden mt-10">
    <h2 class="text-xl font-bold mb-4">المنتجات المضافة</h2>
    <div id="products-list" class="space-y-4"></div>
  </div>

  <!-- رسالة لغير المصرح لهم -->
  <div id="not-admin-message" class="text-center py-16 hidden">
    <i class="fa-solid fa-lock text-6xl text-gray-300 mb-4"></i>
    <p class="text-xl text-gray-500">سجّل دخولك كمدير للوصول للوحة التحكم</p>
    <button onclick="openModal('login-modal')" class="mt-4 bg-black text-white px-6 py-2 rounded-lg">تسجيل الدخول</button>
  </div>
</main>

<!-- نافذة تسجيل الدخول -->
<div id="login-modal" class="modal">
  <div class="bg-white rounded-xl p-8 max-w-md w-full mx-4">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold">تسجيل الدخول</h2>
      <button onclick="closeModal('login-modal')" class="text-gray-500 text-2xl">&times;</button>
    </div>
    <div id="login-options">
      <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-2 border border-gray-300 py-3 rounded-lg mb-4 hover:bg-gray-50">
        <i class="fa-brands fa-google text-red-500"></i> الدخول بقوقل
      </button>
      <div class="flex items-center gap-4 my-4"><hr class="flex-1"><span>أو</span><hr class="flex-1"></div>
      <button onclick="showEmailLogin()" class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800">الدخول بالإيميل</button>
    </div>
    <div id="email-login" class="hidden">
      <input type="email" id="login-email" placeholder="الإيميل" class="w-full border rounded-lg p-3 mb-3">
      <input type="password" id="login-password" placeholder="كلمة المرور" class="w-full border rounded-lg p-3 mb-4">
      <button onclick="loginWithEmail()" class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800">دخول</button>
      <button onclick="backToOptions()" class="w-full mt-2 text-gray-600">رجوع</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCXYzZgFIFU2u6R02_ConvSonD9SJRWS9Q",
  authDomain: "varen-f7756.firebaseapp.com",
  projectId: "varen-f7756",
  storageBucket: "varen-f7756.firebasestorage.app",
  messagingSenderId: "648684291842",
  appId: "1:648684291842:web:f3e806fc76a6e119caa41b",
  measurementId: "G-SV7DKGPH2M"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const googleProvider = new firebase.auth.GoogleAuthProvider();
const ADMIN_EMAIL = 'y0892100@gmail.com';

async function checkAdminAccess(user) {
  if (!user) return false;
  if (user.email !== ADMIN_EMAIL) {
    showToast('❌ ليس لديك صلاحية للدخول', 'error');
    await auth.signOut();
    setTimeout(() => window.location.href = 'index.html', 1500);
    return false;
  }
  return true;
}

window.openModal = id => document.getElementById(id).classList.add('active');
window.closeModal = id => { document.getElementById(id).classList.remove('active'); backToOptions(); };
window.showEmailLogin = () => { 
  document.getElementById('login-options').classList.add('hidden'); 
  document.getElementById('email-login').classList.remove('hidden'); 
};
window.backToOptions = () => { 
  document.getElementById('login-options').classList.remove('hidden'); 
  document.getElementById('email-login').classList.add('hidden'); 
};

function showToast(msg, type='success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast show ${type}`;
  setTimeout(() => toast.classList.remove('show'), 4000);
}

function updateUI(user, isAdmin) {
  const area = document.getElementById('user-area');
  const form = document.getElementById('add-product-form');
  const adminBtns = document.getElementById('admin-buttons');
  const noAccess = document.getElementById('not-admin-message');
  const productsSection = document.getElementById('products-section');
  
  if (user && isAdmin) {
    area.innerHTML = `
      <div class="flex items-center gap-2">
        <span class="text-sm">أهلاً بك، ${user.displayName || 'مدير'}</span>
        <button onclick="logout()" class="text-sm text-red-500 hover:text-red-700">تسجيل الخروج</button>
      </div>
    `;
    form.classList.remove('hidden');
    adminBtns.classList.remove('hidden');
    noAccess.classList.add('hidden');
    productsSection.classList.remove('hidden');
    loadProducts();
  } else {
    area.innerHTML = `<button onclick="openModal('login-modal')" class="bg-black text-white px-4 py-2 rounded-lg hover:bg-gray-800">تسجيل الدخول</button>`;
    form.classList.add('hidden');
    adminBtns.classList.add('hidden');
    noAccess.classList.remove('hidden');
    productsSection.classList.add('hidden');
  }
}

window.loginWithGoogle = async () => {
  try {
    const result = await auth.signInWithPopup(googleProvider);
    if (!await checkAdminAccess(result.user)) return;
    closeModal('login-modal');
    showToast('✅ تم تسجيل الدخول');
  } catch (e) { 
    if (e.code !== 'auth/popup-closed-by-user') showToast('خطأ: ' + e.message, 'error');
  }
};

window.loginWithEmail = async () => {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  if (!email || !pass) return showToast('أدخل الإيميل وكلمة المرور', 'error');
  try {
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    if (!await checkAdminAccess(cred.user)) return;
    closeModal('login-modal');
    showToast('✅ تم تسجيل الدخول');
  } catch (e) { showToast('❌ إيميل أو كلمة مرور خاطئة', 'error'); }
};

window.logout = async () => {
  await auth.signOut();
  showToast('✅ تم تسجيل الخروج');
  setTimeout(() => window.location.reload(), 1000);
};

window.showForm = () => document.getElementById('add-product-form').classList.remove('hidden');

// 📦 تحميل وعرض المنتجات
async function loadProducts() {
  const list = document.getElementById('products-list');
  list.innerHTML = '<p class="text-gray-500">جاري تحميل المنتجات...</p>';
  
  try {
    const snapshot = await db.collection('products').orderBy('createdAt', 'desc').get();
    list.innerHTML = '';
    
    if (snapshot.empty) {
      list.innerHTML = '<p class="text-gray-500 text-center py-8">لا توجد منتجات مضافة حتى الآن</p>';
      return;
    }
    
    snapshot.forEach(doc => {
      const p = doc.data();
      const stock = p.stock || 0;
      const price = p.price || 0;
      const priceOrig = p.priceOriginal;
      const image = p.images && p.images[0] ? p.images[0] : 'https://via.placeholder.com/80x80';
      
      list.innerHTML += `
        <div class="bg-white rounded-xl shadow-sm p-4 flex items-center gap-4">
          <img src="${image}" alt="${p.name}" class="w-20 h-20 object-cover rounded-lg">
          <div class="flex-1">
            <h3 class="font-bold text-lg">${p.name || 'بدون اسم'}</h3>
            <p class="text-sm text-gray-600">
              السعر: ${price.toFixed(2)} درهم
              ${priceOrig ? `<span class="line-through text-red-400 ml-1">${priceOrig.toFixed(2)} درهم</span>` : ''}
              | المخزون: <span class="font-bold ${stock === 0 ? 'text-red-500' : 'text-green-600'}">${stock}</span>
              | ${p.available !== false ? 'متوفر' : 'غير متوفر'}
            </p>
            <p class="text-xs text-gray-400 mt-1">
              ${p.gender || ''} ${p.type || ''} ${p.season || ''}
              ${p.sizes?.length ? `• مقاسات: ${p.sizes.join(', ')}` : ''}
            </p>
          </div>
          <div class="flex flex-col gap-2">
            <button onclick="updateStock('${doc.id}', ${stock}, 1)" class="text-sm bg-green-100 text-green-700 px-2 py-1 rounded hover:bg-green-200">
              <i class="fa-solid fa-plus"></i> زيادة
            </button>
            <button onclick="updateStock('${doc.id}', ${stock}, -1)" class="text-sm bg-yellow-100 text-yellow-700 px-2 py-1 rounded hover:bg-yellow-200">
              <i class="fa-solid fa-minus"></i> نقص
            </button>
            <button onclick="deleteProduct('${doc.id}')" class="text-sm bg-red-100 text-red-700 px-2 py-1 rounded hover:bg-red-200">
              <i class="fa-solid fa-trash"></i> حذف
            </button>
          </div>
        </div>
      `;
    });
  } catch (err) {
    console.error(err);
    list.innerHTML = `<p class="text-red-500">❌ خطأ في تحميل المنتجات: ${err.message}</p>`;
  }
}

// 🔄 تحديث كمية المخزون
window.updateStock = async function(id, currentStock, delta) {
  const newStock = Math.max(0, currentStock + delta);
  try {
    await db.collection('products').doc(id).update({ stock: newStock });
    showToast(`✅ تم تحديث المخزون: ${newStock}`);
    loadProducts();
  } catch (err) {
    showToast('❌ خطأ: ' + err.message, 'error');
  }
};

// 🗑️ حذف منتج
window.deleteProduct = async function(id) {
  if (!confirm('متأكد من حذف هذا المنتج؟')) return;
  try {
    await db.collection('products').doc(id).delete();
    showToast('✅ تم حذف المنتج');
    loadProducts();
  } catch (err) {
    showToast('❌ خطأ: ' + err.message, 'error');
  }
};

document.addEventListener('DOMContentLoaded', () => {
  auth.onAuthStateChanged(async user => {
    updateUI(user, user ? await checkAdminAccess(user) : false);
  });

  const form = document.getElementById('add-product-form');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    
    const selectedColors = Array.from(document.querySelectorAll('input[name="colors"]:checked')).map(c => c.value);
    const selectedSizes = Array.from(document.querySelectorAll('input[name="sizes"]:checked')).map(c => c.value);
    const images = document.getElementById('p-images').value.trim().split('\n').map(s => s.trim()).filter(s => s);
    const priceOriginalVal = document.getElementById('p-price-original').value.trim();
    const stockVal = parseInt(document.getElementById('p-stock').value) || 1;
    
    try {
      await db.collection('products').add({
        name: document.getElementById('p-name').value.trim(),
        stock: stockVal,
        priceOriginal: priceOriginalVal ? Number(priceOriginalVal) : null,
        price: Number(document.getElementById('p-price').value),
        gender: document.getElementById('p-gender').value,
        type: document.getElementById('p-type').value.trim(),
        season: document.getElementById('p-season').value || null,
        available: document.getElementById('p-available').value === 'true',
        colors: selectedColors,
        sizes: selectedSizes,
        images: images,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      showToast('✅ تم إضافة المنتج بنجاح');
      form.reset();
      document.getElementById('p-stock').value = 1;
      loadProducts();
    } catch (err) { 
      console.error(err);
      showToast('❌ خطأ: ' + err.message, 'error'); 
    }
  });
});
</script>

</body>
</html>
