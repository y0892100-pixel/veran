<script>
const firebaseConfig = {

};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const googleProvider = new firebase.auth.GoogleAuthProvider();
const ADMIN_EMAIL = 'y0892100@gmail.com';
// ✅ إعداد EmailJS
emailjs.init('3A0NspFA3vlSd64jc');
const COLORS = ['أسود', 'أبيض', 'رمادي', 'بيج', 'أحمر', 'أزرق', 'أخضر', 'وردي', 'بني', 'برتقالي', 'ذهبي', 'فضي', 'بنفسجي', 'أصفر'];
const SIZES = ['XS', 'S', 'M', 'L', 'XL', 'XXL', 'XXXL', 'مقاس واحد'];
function formatDate(timestamp) {
  if (!timestamp) return 'غير محدد';
  const d = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
  return d.toLocaleString('ar-AE');
}
function getStatusClass(status) {
  if (status === 'جديد') return 'bg-blue-100 text-blue-700';
  if (status === 'مؤكد') return 'bg-green-100 text-green-700';
  if (status === 'يتم تجهيز طلبك') return 'bg-yellow-100 text-yellow-700';
  if (status === 'يتم تجهيز توصيل طلبك') return 'bg-orange-100 text-orange-700';
  if (status === 'ملغي') return 'bg-red-100 text-red-700';
  return 'bg-gray-100 text-gray-700';
}
function getReturnStatusClass(status) {
  if (status === 'قيد المراجعة') return 'bg-yellow-100 text-yellow-700';
  if (status === 'مقبول') return 'bg-green-100 text-green-700';
  if (status === 'مرفوض') return 'bg-red-100 text-red-700';
  return 'bg-gray-100 text-gray-700';
}
async function checkAdminAccess(user) {
  if (!user) return false;
  if (user.email !== ADMIN_EMAIL) {
    showToast('❌ ليس لديك صلاحية للدخول', 'error');
    await auth.signOut();
    setTimeout(() => window.location.href = 'index.html', 1500);
    return false;
  }
  return true;
}
window.openModal = id => document.getElementById(id).classList.add('active');
window.closeModal = id => { document.getElementById(id).classList.remove('active'); backToOptions(); };
window.showEmailLogin = () => { 
  document.getElementById('login-options').classList.add('hidden'); 
  document.getElementById('email-login').classList.remove('hidden'); 
};
window.backToOptions = () => { 
  document.getElementById('login-options').classList.remove('hidden'); 
  document.getElementById('email-login').classList.add('hidden'); 
};
function showToast(msg, type='success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast show ${type}`;
  setTimeout(() => toast.classList.remove('show'), 4000);
}
function switchTab(tabName) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(`tab-${tabName}`).classList.remove('hidden');
  document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
  
  if (tabName === 'products') loadProducts();
  if (tabName === 'orders') loadAllOrders();
  if (tabName === 'returns') loadAllReturns();
}
let variantCounter = 0;
window.addVariantRow = function() {
  const list = document.getElementById('variants-list');
  const rowId = `variant-row-${variantCounter++}`;
  
  const colorOptions = COLORS.map(c => `<option value="${c}">${c}</option>`).join('');
  const sizeOptions = SIZES.map(s => `<option value="${s}">${s}</option>`).join('');
  
  const row = document.createElement('div');
  row.id = rowId;
  row.className = 'variant-row grid grid-cols-3 md:grid-cols-8 gap-2 items-center';
  row.innerHTML = `
    <div class="md:col-span-2">
      <label class="text-xs text-gray-500">اللون</label>
      <select class="variant-color w-full border rounded p-2">${colorOptions}</select>
    </div>
    <div class="md:col-span-2">
      <label class="text-xs text-gray-500">المقاس</label>
      <select class="variant-size w-full border rounded p-2">${sizeOptions}</select>
    </div>
    <div class="md:col-span-2">
      <label class="text-xs text-gray-500">الكمية</label>
      <input type="number" class="variant-stock w-full border rounded p-2" min="0" value="1">
    </div>
    <div class="md:col-span-2 flex items-end justify-center">
      <button type="button" onclick="removeVariantRow('${rowId}')" class="text-red-500 p-2 hover:text-red-700">
        <i class="fa-solid fa-trash"></i>
      </button>
    </div>
  `;
  list.appendChild(row);
};
window.removeVariantRow = function(rowId) {
  document.getElementById(rowId)?.remove();
};
function collectVariants() {
  const rows = document.querySelectorAll('#variants-list .variant-row');
  const variants = [];
  rows.forEach(row => {
    const color = row.querySelector('.variant-color')?.value;
    const size = row.querySelector('.variant-size')?.value;
    const stock = parseInt(row.querySelector('.variant-stock')?.value) || 0;
    if (color && size) {
      variants.push({ color, size, stock });
    }
  });
  return variants;
}
// ✅ إرسال إيميل التأكيد بالإيميل اللي تكتبه أنت
async function sendConfirmationEmail(orderData, deliveryDate, adminEmail) {
  const orderNumber = orderData.orderNumber || orderData.id;
  const orderDate = formatDate(orderData.createdAt);
  
  const itemsHtml = (orderData.items || []).map(i => {
    const qty = i.qty || i.quantity || 1;
    return `• ${i.name} — المقاس: ${i.size || '-'} — اللون: ${i.color || '-'} × ${qty} — ${((i.price || 0) * qty).toFixed(2)} درهم`;
  }).join('\n');
  const total = (orderData.total || 0).toFixed(2);
  
  // ✅ نستخدم الإيميل اللي كتبته أنت، ولو فارغ نأخذ الإيميل الأصلي من الطلب
  const emailToUse = adminEmail || orderData.userEmail || '';
  
  try {
    const response = await emailjs.send(
      'service_3bs6onj',
      'template_om7zrjs',
      {
        order_id: orderNumber,
        order_date: orderDate,
        customer_name: orderData.fullName || 'العميل',
        customer_email: emailToUse, // ✅ الإيميل اللي تكتبه أنت
        customer_phone: orderData.phone || '',
        customer_address: orderData.address || '',
        order_items: itemsHtml,
        order_total: total,
        delivery_date: deliveryDate || 'غير محدد'
      }
    );
    console.log('✅ الإيميل أُرسل إلى:', emailToUse, response);
    return { success: true, emailUsed: emailToUse };
  } catch (err) {
    console.error('❌ خطأ في إرسال الإيميل:', err);
    return { success: false, error: err.message, emailUsed: emailToUse };
  }
}
async function loadAllOrders() {
  const list = document.getElementById('orders-list');
  list.innerHTML = '<p class="text-gray-500">جاري تحميل الطلبات...</p>';
  try {
    const snapshot = await db.collection('orders').orderBy('createdAt', 'desc').limit(50).get();
    list.innerHTML = '';
    if (snapshot.empty) {
      list.innerHTML = '<p class="text-gray-500 text-center py-8">لا توجد طلبات حتى الآن</p>';
      return;
    }
    snapshot.forEach(doc => {
      const o = { id: doc.id, ...doc.data() };
      const deliveryDateDisplay = o.deliveryDate ? `<p class="text-sm text-green-700 font-medium">📅 تاريخ استلام الطلب المتوقع: ${o.deliveryDate}</p>` : '';
      const originalEmail = o.userEmail || '';
      
      list.innerHTML += `
        <div class="bg-white p-5 rounded-xl shadow-sm border">
          <div class="flex flex-wrap justify-between items-center mb-3 gap-2">
            <span class="font-bold">${o.orderNumber || o.id}</span>
            <span class="px-3 py-1 rounded-full text-sm font-medium ${getStatusClass(o.status || 'جديد')}">${o.status || 'جديد'}</span>
          </div>
          <p class="text-sm text-gray-600 mb-1">التاريخ: ${formatDate(o.createdAt)}</p>
          <p class="text-sm text-gray-600 mb-1">العميل: ${o.fullName || 'غير مذكور'} | ${o.phone || 'لا يوجد رقم'}</p>
          
          <!-- ✅ حقل إيميل العميل تعدله أنت -->
          <div class="mb-2 p-2 bg-blue-50 rounded-lg">
            <label class="block text-sm font-semibold mb-1">📧 إيميل العميل (لإرسال التأكيد)</label>
            <input type="email" id="customer-email-${o.id}" class="w-full border rounded-lg p-2 text-sm" 
                   value="${originalEmail}" placeholder="اكتب إيميل العميل هنا">
          </div>
          
          <p class="text-sm text-gray-600 mb-2">العنوان: ${o.address || 'غير مذكور'}</p>
          ${deliveryDateDisplay}
          <div class="border-t pt-3 mb-3">
            <p class="font-semibold mb-2">المنتجات:</p>
            ${(o.items || []).map(i => {
              const qty = i.qty || i.quantity || 1;
              return `<p class="text-sm">• ${i.name} — المقاس: ${i.size || '-'} — اللون: ${i.color || '-'} × ${qty} — ${((i.price || 0) * qty).toFixed(2)} درهم</p>`;
            }).join('')}
            <p class="font-bold mt-2">المجموع: ${(o.total || 0).toFixed(2)} درهم</p>
          </div>
          
          <!-- حقل تاريخ التوصيل -->
          <div class="mb-3 p-2 bg-gray-50 rounded-lg">
            <label class="block text-sm font-semibold mb-1">📅 تاريخ استلام الطلب المتوقع</label>
            <div class="flex gap-2">
              <input type="date" id="delivery-date-${o.id}" class="flex-1 border rounded-lg p-2" value="${o.deliveryDate || ''}">
              <button onclick="saveDeliveryDate('${o.id}')" class="px-3 py-2 bg-blue-500 text-white rounded-lg text-sm hover:bg-blue-600">حفظ التاريخ</button>
            </div>
          </div>
          
          <div class="flex flex-wrap gap-2 mt-2">
            <button onclick="confirmOrderAndSendEmail('${o.id}')" class="px-3 py-1 bg-green-500 text-white rounded text-sm hover:bg-green-600">✅ مؤكد + إرسال الإيميل</button>
            <button onclick="updateOrderStatus('${o.id}', 'يتم تجهيز طلبك')" class="px-3 py-1 bg-yellow-100 text-yellow-700 rounded text-sm hover:bg-yellow-200">⏳ يتم تجهيز الطلب</button>
            <button onclick="updateOrderStatus('${o.id}', 'يتم تجهيز توصيل طلبك')" class="px-3 py-1 bg-orange-100 text-orange-700 rounded text-sm hover:bg-orange-200">🚚 جاري التوصيل</button>
            <button onclick="updateOrderStatus('${o.id}', 'ملغي')" class="px-3 py-1 bg-red-100 text-red-700 rounded text-sm hover:bg-red-200">❌ ملغي</button>
          </div>
        </div>
      `;
    });
  } catch (err) {
    list.innerHTML = `<p class="text-red-500">خطأ: ${err.message}</p>`;
  }
}
// ✅ تأكيد الطلب + إرسال الإيميل للإيميل اللي في الحقل
window.confirmOrderAndSendEmail = async function(orderId) {
  try {
    const deliveryDateInput = document.getElementById(`delivery-date-${orderId}`);
    const deliveryDate = deliveryDateInput ? deliveryDateInput.value : '';
    const customerEmailInput = document.getElementById(`customer-email-${orderId}`);
    const customerEmail = customerEmailInput ? customerEmailInput.value.trim() : '';
    
    // جلب بيانات الطلب
    const orderSnap = await db.collection('orders').doc(orderId).get();
    if (!orderSnap.exists) return showToast('❌ الطلب غير موجود', 'error');
    
    const orderData = { id: orderId, ...orderSnap.data() };
    
    // ✅ حفظ الإيميل الجديد في قاعدة البيانات
    if (customerEmail) {
      await db.collection('orders').doc(orderId).update({ userEmail: customerEmail });
    }
    
    // تحديث الحالة
    await db.collection('orders').doc(orderId).update({ 
      status: 'مؤكد',
      deliveryDate: deliveryDate || null
    });
    
    // إرسال الإيميل
    const result = await sendConfirmationEmail(orderData, deliveryDate, customerEmail);
    
    if (result.success) {
      showToast(`✅ تم التأكيد وإرسال الإيميل إلى: ${result.emailUsed || 'الإيميل المحدد'}`);
    } else {
      showToast(`⚠️ تم التأكيد لكن فشل الإرسال إلى: ${result.emailUsed} — تحقق من صحة الإيميل`, 'error');
    }
    
    loadAllOrders();
  } catch (err) {
    showToast('❌ خطأ: ' + err.message, 'error');
  }
};
// ✅ حفظ تاريخ التوصيل فقط
window.saveDeliveryDate = async function(orderId) {
  try {
    const deliveryDateInput = document.getElementById(`delivery-date-${orderId}`);
    const deliveryDate = deliveryDateInput ? deliveryDateInput.value : '';
    
    await db.collection('orders').doc(orderId).update({ 
      deliveryDate: deliveryDate 
    });
    
    showToast('✅ تم حفظ تاريخ التوصيل');
    loadAllOrders();
  } catch (err) {
    showToast('❌ خطأ: ' + err.message, 'error');
  }
};
// ✅ تحديث الحالة فقط (بدون إيميل)
window.updateOrderStatus = async function(orderId, newStatus) {
  try {
    await db.collection('orders').doc(orderId).update({ status: newStatus });
    showToast(`✅ تم تحديث الحالة إلى: ${newStatus}`);
    loadAllOrders();
  } catch (err) {
    showToast('❌ خطأ: ' + err.message, 'error');
  }
};
async function loadAllReturns() {
  const list = document.getElementById('returns-list');
  list.innerHTML = '<p class="text-gray-500">جاري تحميل الطلبات...</p>';
  try {
    const snapshot = await db.collection('returns').orderBy('createdAt', 'desc').limit(50).get();
    list.innerHTML = '';
    if (snapshot.empty) {
      list.innerHTML = '<p class="text-gray-500 text-center py-8">لا توجد طلبات استرجاع حتى الآن</p>';
      return;
    }
    snapshot.forEach(doc => {
      const r = { id: doc.id, ...doc.data() };
      list.innerHTML += `
        <div class="bg-white p-5 rounded-xl shadow-sm border">
          <div class="flex flex-wrap justify-between items-center mb-3 gap-2">
            <span class="font-bold">طلب استرجاع: ${r.orderId || 'غير محدد'}</span>
            <span class="px-3 py-1 rounded-full text-sm font-medium ${getReturnStatusClass(r.status || 'قيد المراجعة')}">${r.status || 'قيد المراجعة'}</span>
          </div>
          <p class="text-sm text-gray-600 mb-1">التاريخ: ${formatDate(r.createdAt)}</p>
          <p class="text-sm text-gray-600 mb-1">العميل: ${r.userEmail || 'غير مذكور'}</p>
          <p class="text-sm mb-3"><strong>السبب:</strong> ${r.reason || 'غير مذكور'}</p>
          <div class="flex gap-2">
            <button onclick="updateReturnStatus('${r.id}', 'مقبول')" class="px-3 py-1 bg-green-100 text-green-700 rounded text-sm hover:bg-green-200">✅ مقبول</button>
            <button onclick="updateReturnStatus('${r.id}', 'مرفوض')" class="px-3 py-1 bg-red-100 text-red-700 rounded text-sm hover:bg-red-200">❌ مرفوض</button>
            <button onclick="updateReturnStatus('${r.id}', 'قيد المراجعة')" class="px-3 py-1 bg-yellow-100 text-yellow-700 rounded text-sm hover:bg-yellow-200">⏳ قيد المراجعة</button>
          </div>
        </div>
      `;
    });
  } catch (err) {
    list.innerHTML = `<p class="text-red-500">خطأ: ${err.message}</p>`;
  }
}
window.updateReturnStatus = async function(returnId, newStatus) {
  try {
    await db.collection('returns').doc(returnId).update({ status: newStatus });
    showToast(`✅ تم تحديث الحالة إلى: ${newStatus}`);
    loadAllReturns();
  } catch (err) {
    showToast('❌ خطأ: ' + err.message, 'error');
  }
};
async function loadProducts() {
  const list = document.getElementById('products-list');
  list.innerHTML = '<p class="text-gray-500">جاري تحميل المنتجات...</p>';
  try {
    const snapshot = await db.collection('products').orderBy('createdAt', 'desc').get();
    list.innerHTML = '';
    if (snapshot.empty) {
      list.innerHTML = '<p class="text-gray-500 text-center py-8">لا توجد منتجات مضافة حتى الآن</p>';
      return;
    }
    snapshot.forEach(doc => {
      const p = doc.data();
      const variants = p.variants || [];
      const totalStock = variants.reduce((sum, v) => sum + (v.stock || 0), 0);
      const price = p.price || 0;
      const priceOrig = p.priceOriginal;
      const image = p.images && p.images[0] ? p.images[0] : 'https://via.placeholder.com/80x80';
      const variantsSummary = variants.map(v => `${v.color} / ${v.size}: ${v.stock}`).join(' | ');
      
      list.innerHTML += `
        <div class="bg-white rounded-xl shadow-sm p-4">
          <div class="flex items-start gap-4">
            <img src="${image}" alt="${p.name}" class="w-20 h-20 object-cover rounded-lg">
            <div class="flex-1">
              <h3 class="font-bold text-lg">${p.name || 'بدون اسم'}</h3>
              <p class="text-sm text-gray-600">
                السعر: ${price.toFixed(2)} درهم
                ${priceOrig ? `<span class="line-through text-red-400 ml-1">${priceOrig.toFixed(2)} درهم</span>` : ''}
                | إجمالي المخزون: <span class="font-bold ${totalStock === 0 ? 'text-red-500' : 'text-green-600'}">${totalStock}</span>
                | ${p.available !== false ? 'متوفر' : 'غير متوفر'}
              </p>
              <p class="text-xs text-gray-500 mt-1">${p.gender || ''} ${p.type || ''} ${p.season || ''}</p>
              <p class="text-xs text-gray-400 mt-1">الخيارات: ${variantsSummary || 'لا يوجد خيارات محددة'}</p>
            </div>
            <div class="flex flex-col gap-2">
              <button class="text-sm bg-blue-100 text-blue-700 px-2 py-1 rounded hover:bg-blue-200">
                <i class="fa-solid fa-pen-to-square"></i> تعديل
              </button>
              <button onclick="deleteProduct('${doc.id}')" class="text-sm bg-red-100 text-red-700 px-2 py-1 rounded hover:bg-red-200">
                <i class="fa-solid fa-trash"></i> حذف
              </button>
            </div>
          </div>
        </div>
      `;
    });
  } catch (err) {
    list.innerHTML = `<p class="text-red-500">❌ خطأ في تحميل المنتجات: ${err.message}</p>`;
  }
}
window.deleteProduct = async function(id) {
  if (!confirm('متأكد من حذف هذا المنتج؟')) return;
  try {
    await db.collection('products').doc(id).delete();
    showToast('✅ تم حذف المنتج');
    loadProducts();
  } catch (err) {
    showToast('❌ خطأ: ' + err.message, 'error');
  }
};
window.loginWithGoogle = async () => {
  try {
    const result = await auth.signInWithPopup(googleProvider);
    if (!await checkAdminAccess(result.user)) return;
    closeModal('login-modal');
    showToast('✅ تم تسجيل الدخول');
  } catch (e) { 
    if (e.code !== 'auth/popup-closed-by-user') showToast('خطأ: ' + e.message, 'error'); 
  }
};
window.loginWithEmail = async () => {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  if (!email || !pass) return showToast('أدخل الإيميل وكلمة المرور', 'error');
  try {
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    if (!await checkAdminAccess(cred.user)) return;
    closeModal('login-modal');
    showToast('✅ تم تسجيل الدخول');
  } catch (e) { showToast('❌ إيميل أو كلمة مرور خاطئة', 'error'); }
};
window.logout = async () => {
  await auth.signOut();
  showToast('✅ تم تسجيل الخروج');
  setTimeout(() => window.location.reload(), 1000);
};
window.showForm = () => {
  document.getElementById('add-product-form').classList.remove('hidden');
  if (document.querySelectorAll('#variants-list .variant-row').length === 0) {
    addVariantRow();
  }
};
function updateUI(user, isAdmin) {
  const area = document.getElementById('user-area');
  const tabs = document.getElementById('admin-tabs');
  const noAccess = document.getElementById('not-admin-message');
  
  if (user && isAdmin) {
    area.innerHTML = `
      <div class="flex items-center gap-2">
        <span class="text-sm">أهلاً بك، ${user.displayName || 'مدير'}</span>
        <button onclick="logout()" class="text-sm text-red-500 hover:text-red-700">تسجيل الخروج</button>
      </div>
    `;
    tabs.classList.remove('hidden');
    noAccess.classList.add('hidden');
    switchTab('products');
  } else {
    area.innerHTML = `<button onclick="openModal('login-modal')" class="bg-black text-white px-4 py-2 rounded-lg hover:bg-gray-800">تسجيل الدخول</button>`;
    tabs.classList.add('hidden');
    noAccess.classList.remove('hidden');
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
  }
}
document.addEventListener('DOMContentLoaded', () => {
  auth.onAuthStateChanged(async user => {
    updateUI(user, user ? await checkAdminAccess(user) : false);
  });
  const form = document.getElementById('add-product-form');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const variants = collectVariants();
    if (variants.length === 0) {
      return showToast('⚠️ أضف خياراً واحداً على الأقل (لون + مقاس + كمية)', 'error');
    }
    const images = document.getElementById('p-images').value.trim().split('\n').map(s => s.trim()).filter(s => s);
    const priceOriginalVal = document.getElementById('p-price-original').value.trim();
    
    try {
      await db.collection('products').add({
        name: document.getElementById('p-name').value.trim(),
        priceOriginal: priceOriginalVal ? Number(priceOriginalVal) : null,
        price: Number(document.getElementById('p-price').value),
        gender: document.getElementById('p-gender').value,
        type: document.getElementById('p-type').value.trim(),
        season: document.getElementById('p-season').value || null,
        available: document.getElementById('p-available').value === 'true',
        images: images,
        variants: variants,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      showToast('✅ تم إضافة المنتج بنجاح');
      form.reset();
      document.getElementById('variants-list').innerHTML = '';
      addVariantRow();
      loadProducts();
    } catch (err) { 
      showToast('❌ خطأ: ' + err.message, 'error'); 
    }
  });
});
</script>
</body>
</html>
