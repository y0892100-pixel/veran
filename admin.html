<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - VAREN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; display: none; }
    .toast.show { display: block; }
    .toast.success { background: #16a34a; }
    .toast.error { background: #dc2626; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import firebaseConfig from './firebase-config.js';
    import * as Store from './store.js';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    // ✅ إيميل الأدمن — تم وضعه هنا
    const ADMIN_EMAIL = 'y0892100@gmail.com';

    // ✅ التحقق من صلاحية الدخول
    async function checkAdminAccess(user) {
      if (!user) {
        return false; // يبقى في صفحة تسجيل الدخول
      }
      if (user.email !== ADMIN_EMAIL) {
        alert('❌ ليس لديك صلاحية للدخول إلى لوحة التحكم');
        await signOut(auth);
        window.location.href = 'index.html';
        return false;
      }
      return true;
    }

    window.app = { auth, db, googleProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, signOut, onAuthStateChanged, updateProfile, collection, addDoc, checkAdminAccess };
    window.Store = Store;
  </script>
</head>
<body class="bg-gray-50 text-gray-800">

<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <a href="index.html" class="text-2xl font-bold text-gray-900">VAREN</a>
    <div class="hidden md:flex gap-8">
      <a href="index.html" class="font-medium hover:text-gray-600">الرئيسية</a>
      <a href="category.html?gender=women" class="font-medium hover:text-gray-600">نسائي</a>
      <a href="category.html?gender=men" class="font-medium hover:text-gray-600">رجالي</a>
    </div>
    <div class="flex items-center gap-4">
      <a href="cart.html" class="text-xl relative">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
      </a>
      <div id="user-area">
        <button id="login-btn" onclick="openModal('login-modal')" class="bg-black text-white px-4 py-2 rounded-lg hover:bg-gray-800">تسجيل الدخول</button>
      </div>
    </div>
  </div>
</nav>

<main class="max-w-3xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-6">لوحة التحكم — إضافة منتج</h1>
  
  <form id="add-product-form" class="bg-white p-6 rounded-xl shadow-md space-y-4">
    <div class="grid md:grid-cols-2 gap-4">
      <div>
        <label class="block font-semibold mb-1">اسم المنتج</label>
        <input type="text" id="p-name" class="w-full border rounded-lg p-3" required>
      </div>
      <div>
        <label class="block font-semibold mb-1">السعر الأصلي (قبل الخصم)</label>
        <input type="number" id="p-price-original" class="w-full border rounded-lg p-3" placeholder="اختياري">
      </div>
      <div>
        <label class="block font-semibold mb-1">السعر الحالي (بالدرهم د.إ)</label>
        <input type="number" id="p-price" class="w-full border rounded-lg p-3" required>
      </div>
      <div>
        <label class="block font-semibold mb-1">التصنيف</label>
        <select id="p-gender" class="w-full border rounded-lg p-3">
          <option value="women">نسائي</option>
          <option value="men">رجالي</option>
          <option value="girls">بنات</option>
          <option value="boys">أولاد</option>
        </select>
      </div>
      <div>
        <label class="block font-semibold mb-1">النوع</label>
        <input type="text" id="p-type" class="w-full border rounded-lg p-3" placeholder="هودي / تيشيرت / فستان...">
      </div>
      <div>
        <label class="block font-semibold mb-1">حالة التوفر</label>
        <select id="p-available" class="w-full border rounded-lg p-3">
          <option value="true" selected>متوفر ✅</option>
          <option value="false">غير متوفر ❌</option>
        </select>
      </div>
      <div class="md:col-span-2">
        <label class="block font-semibold mb-2">الألوان المتاحة</label>
        <div class="flex flex-wrap gap-3">
          <label class="flex items-center gap-1"><input type="checkbox" name="colors" value="أحمر"> أحمر</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="colors" value="أسود"> أسود</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="colors" value="أبيض"> أبيض</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="colors" value="بيج"> بيج</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="colors" value="رمادي"> رمادي</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="colors" value="أزرق"> أزرق</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="colors" value="أخضر"> أخضر</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="colors" value="وردي"> وردي</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="colors" value="بني"> بني</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="colors" value="برتقالي"> برتقالي</label>
        </div>
      </div>
      <div class="md:col-span-2">
        <label class="block font-semibold mb-2">المقاسات المتاحة</label>
        <div class="flex flex-wrap gap-3">
          <label class="flex items-center gap-1"><input type="checkbox" name="sizes" value="XS"> XS</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="sizes" value="S"> S</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="sizes" value="M"> M</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="sizes" value="L"> L</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="sizes" value="XL"> XL</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="sizes" value="XXL"> XXL</label>
        </div>
      </div>
      <div class="md:col-span-2">
        <label class="block font-semibold mb-1">روابط الصور (كل رابط في سطر)</label>
        <textarea id="p-images" class="w-full border rounded-lg p-3" rows="4" placeholder="أدخل رابط كل صورة في سطر منفصل"></textarea>
      </div>
    </div>
    <button type="submit" class="bg-black text-white px-6 py-3 rounded-lg text-lg hover:bg-gray-800 w-full">إضافة المنتج</button>
  </form>
</main>

<!-- نافذة تسجيل الدخول -->
<div id="login-modal" class="modal">
  <div class="bg-white rounded-xl p-8 max-w-md w-full mx-4">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold">تسجيل الدخول</h2>
      <button onclick="closeModal('login-modal')" class="text-gray-500 text-2xl">&times;</button>
    </div>
    <div id="login-options">
      <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-2 border border-gray-300 py-3 rounded-lg mb-4 hover:bg-gray-50">
        <i class="fa-brands fa-google text-red-500"></i> الدخول بقوقل
      </button>
      <div class="flex items-center gap-4 my-4"><hr class="flex-1"><span>أو</span><hr class="flex-1"></div>
      <button onclick="showEmailLogin()" class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800">الدخول بالإيميل</button>
      <p class="text-center mt-4 text-sm">ليس لديك حساب؟ <button onclick="showRegister()" class="text-black font-semibold">إنشاء حساب</button></p>
    </div>
    <div id="email-login" class="hidden">
      <input type="email" id="login-email" placeholder="الإيميل" class="w-full border rounded-lg p-3 mb-3">
      <input type="password" id="login-password" placeholder="كلمة المرور" class="w-full border rounded-lg p-3 mb-4">
      <button onclick="loginWithEmail()" class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800">دخول</button>
      <button onclick="backToOptions()" class="w-full mt-2 text-gray-600">رجوع</button>
    </div>
    <div id="register-form" class="hidden">
      <input type="text" id="reg-name" placeholder="الاسم الكامل" class="w-full border rounded-lg p-3 mb-3">
      <input type="email" id="reg-email" placeholder="الإيميل" class="w-full border rounded-lg p-3 mb-3">
      <input type="password" id="reg-password" placeholder="كلمة المرور (6 أحرف)" class="w-full border rounded-lg p-3 mb-3">
      <button onclick="registerUser()" class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800">إنشاء حساب</button>
      <button onclick="backToOptions()" class="w-full mt-2 text-gray-600">رجوع</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
window.openModal = id => document.getElementById(id).classList.add('active');
window.closeModal = id => document.getElementById(id).classList.remove('active');
window.showEmailLogin = () => { document.getElementById('login-options').classList.add('hidden'); document.getElementById('email-login').classList.remove('hidden'); };
window.showRegister = () => { document.getElementById('login-options').classList.add('hidden'); document.getElementById('register-form').classList.remove('hidden'); };
window.backToOptions = () => { document.getElementById('login-options').classList.remove('hidden'); document.getElementById('email-login').classList.add('hidden'); document.getElementById('register-form').classList.add('hidden'); };

function showToast(msg, type='success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast show ${type}`;
  setTimeout(() => toast.classList.remove('show'), 4000);
}

function updateUI(user) {
  const area = document.getElementById('user-area');
  const form = document.getElementById('add-product-form');
  
  if (user) {
    area.innerHTML = `
      <div class="flex items-center gap-2">
        <span class="text-sm">أهلاً بك، ${user.displayName || 'مدير'}</span>
        <button onclick="logout()" class="text-sm text-red-500 hover:text-red-700">تسجيل الخروج</button>
      </div>
    `;
    form.style.display = 'block';
  } else {
    area.innerHTML = `<button onclick="openModal('login-modal')" class="bg-black text-white px-4 py-2 rounded-lg hover:bg-gray-800">تسجيل الدخول</button>`;
    form.style.display = 'none';
  }
  window.Store?.updateCartCount?.();
}

window.loginWithGoogle = async () => {
  try {
    const result = await window.app.signInWithPopup(window.app.auth, window.app.googleProvider);
    const allowed = await window.app.checkAdminAccess(result.user);
    if (!allowed) return;
    closeModal('login-modal');
    showToast('تم تسجيل الدخول ✅');
  } catch (e) { showToast(e.message, 'error'); }
};

window.registerUser = async () => {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass = document.getElementById('reg-password').value;
  if (!name || !email || pass.length < 6) return showToast('املأ الحقول وكلمة المرور 6 أحرف على الأقل', 'error');
  try {
    const cred = await window.app.createUserWithEmailAndPassword(window.app.auth, email, pass);
    await window.app.updateProfile(cred.user, { displayName: name });
    const allowed = await window.app.checkAdminAccess(cred.user);
    if (!allowed) return;
    closeModal('login-modal');
    showToast('تم إنشاء الحساب ✅');
  } catch (e) { showToast(e.message, 'error'); }
};

window.loginWithEmail = async () => {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  try {
    const cred = await window.app.signInWithEmailAndPassword(window.app.auth, email, pass);
    const allowed = await window.app.checkAdminAccess(cred.user);
    if (!allowed) return;
    closeModal('login-modal');
    showToast('تم تسجيل الدخول ✅');
  } catch (e) { showToast('إيميل أو كلمة مرور خاطئة', 'error'); }
};

window.logout = async () => {
  await window.app.signOut(window.app.auth);
  showToast('تم تسجيل الخروج');
};

document.addEventListener('DOMContentLoaded', () => {
  window.app.onAuthStateChanged(window.app.auth, async user => {
    if (user) {
      const allowed = await window.app.checkAdminAccess(user);
      if (!allowed) return;
    }
    updateUI(user);
  });

  const form = document.getElementById('add-product-form');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const selectedColors = Array.from(document.querySelectorAll('input[name="colors"]:checked')).map(c => c.value);
    const selectedSizes = Array.from(document.querySelectorAll('input[name="sizes"]:checked')).map(c => c.value);
    const images = document.getElementById('p-images').value.trim().split('\n').map(s => s.trim()).filter(s => s);
    try {
      await window.app.addDoc(window.app.collection(window.app.db, 'products'), {
        name: document.getElementById('p-name').value.trim(),
        priceOriginal: Number(document.getElementById('p-price-original').value) || null,
        price: Number(document.getElementById('p-price').value),
        gender: document.getElementById('p-gender').value,
        type: document.getElementById('p-type').value.trim(),
        available: document.getElementById('p-available').value === 'true',
        colors: selectedColors,
        sizes: selectedSizes,
        images: images
      });
      showToast('تم إضافة المنتج بنجاح ✅');
      form.reset();
    } catch (err) { showToast('خطأ: ' + err.message, 'error'); }
  });
});
</script>
</body>
</html>
