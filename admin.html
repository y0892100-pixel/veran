function showToast(msg, type='success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast ${type} show`;
  setTimeout(() => toast.classList.remove('show'), 5000);
}
function toggleLanguage() {
  const current = getCurrentLanguage();
  const newLang = current === 'ar' ? 'en' : 'ar';
  setLanguage(newLang);
  document.getElementById('lang-btn').textContent = newLang === 'ar' ? 'English' : 'العربية';
  renderProductsList();
  renderOrdersList();
  renderReturnsList();
}
function getStatusClass(status) {
  const map = {
    pending: 'status-pending',
    confirmed: 'status-confirmed',
    preparing: 'status-preparing',
    shipping: 'status-shipping',
    delivered: 'status-delivered',
    cancelled: 'status-cancelled',
    'return-requested': 'status-return-requested',
    returned: 'status-returned'
  };
  return map[status] || 'status-pending';
}
function getStatusText(status) {
  const map = {
    pending: t('status_pending'),
    confirmed: t('status_confirmed'),
    preparing: t('status_preparing'),
    shipping: t('status_shipping'),
    delivered: t('status_delivered'),
    cancelled: t('status_cancelled'),
    'return-requested': t('status_return_requested'),
    returned: t('status_returned')
  };
  return map[status] || status;
}

// 🔐 التحقق من صلاحية الدخول
let authChecked = false;
const ADMIN_EMAIL_LOWER = ADMIN_EMAIL.trim().toLowerCase();
const authTimeout = setTimeout(() => {
  if (!authChecked) {
    authChecked = true;
    showAccessDenied();
  }
}, 3000);

auth.onAuthStateChanged(user => {
  authChecked = true;
  clearTimeout(authTimeout);
  document.getElementById('auth-screen').classList.add('hidden');
  if (user && user.email && user.email.trim().toLowerCase() === ADMIN_EMAIL_LOWER) {
    document.getElementById('admin-content').classList.remove('hidden');
    setLanguage(getCurrentLanguage());
    document.getElementById('lang-btn').textContent = getCurrentLanguage() === 'ar' ? 'English' : 'العربية';
    loadProducts();
    loadOrders();
    loadReturns();
    addVariantRow();
  } else {
    if (user) auth.signOut();
    showAccessDenied();
  }
});

function showAccessDenied() {
  document.getElementById('auth-screen').classList.remove('hidden');
  document.getElementById('admin-content').classList.add('hidden');
  document.getElementById('auth-screen').innerHTML = `
    <div class="card p-8 text-center max-w-md">
      <i class="fa-solid fa-lock fa-3xl text-red-400 mb-4"></i>
      <h2 class="text-xl font-bold mb-2 text-red-600" data-i18n="no_access">غير مسموح لك بالوصول</h2>
      <p class="text-gray-500 mb-4">سجل الدخول باستخدام حساب المدير فقط</p>
      <a href="login.html" class="btn btn-primary">
        <i class="fa-solid fa-sign-in-alt ml-1"></i> تسجيل الدخول
      </a>
    </div>
  `;
}
function logout() {
  auth.signOut().then(() => {
    window.location.href = 'index.html';
  });
}

// 📱 التبويبات
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tabId = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`tab-${tabId}`).classList.add('active');
    if (tabId === 'add-product') resetForm();
  });
});

// 🎨 خيارات المنتج (لون - مقاس - كمية)
function addVariantRow(color='', size='', stock=1) {
  const container = document.getElementById('variants-container');
  const row = document.createElement('div');
  row.className = 'flex flex-wrap gap-2 items-center variant-row';
  row.innerHTML = `
    <input type="text" class="variant-color flex-1 min-w-[100px]" placeholder="${t('variant_color')}" value="${color}">
    <input type="text" class="variant-size flex-1 min-w-[100px]" placeholder="${t('variant_size')}" value="${size}">
    <input type="number" min="1" class="variant-stock w-20" placeholder="${t('variant_stock')}" value="${stock}">
    <button type="button" onclick="this.closest('.variant-row').remove()" class="btn btn-danger btn-sm">
      <i class="fa-solid fa-times"></i>
    </button>
  `;
  container.appendChild(row);
}
function collectVariants() {
  const variants = [];
  document.querySelectorAll('.variant-row').forEach(row => {
    const color = row.querySelector('.variant-color').value.trim();
    const size = row.querySelector('.variant-size').value.trim();
    const stock = parseInt(row.querySelector('.variant-stock').value) || 0;
    if (color && size && stock > 0) variants.push({ color, size, stock });
  });
  return variants;
}

// 💾 حفظ وتعديل المنتج
document.getElementById('product-form').addEventListener('submit', async e => {
  e.preventDefault();
  const name = document.getElementById('prod-name').value.trim();
  const price = parseFloat(document.getElementById('prod-price').value);
  const priceOriginal = parseFloat(document.getElementById('prod-price-orig').value) || null;
  const description = document.getElementById('prod-desc').value.trim();
  const gender = document.getElementById('prod-gender').value;
  const type = document.getElementById('prod-type').value;
  const category = document.getElementById('prod-category').value || null;
  const season = document.getElementById('prod-season').value;
  const imagesText = document.getElementById('prod-images').value.trim();
  const images = imagesText.split(',').map(u => u.trim()).filter(u => u);
  const variants = collectVariants();
  
  if (!name || !price || images.length === 0 || variants.length === 0) {
    showToast(t('required_fields'), 'warning');
    return;
  }
  const productData = {
    name, price, priceOriginal, description, gender, type, category, season, images, variants,
    available: true,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  try {
    if (currentEditProductId) {
      await db.collection('products').doc(currentEditProductId).update(productData);
      showToast(t('product_updated'));
    } else {
      productData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('products').add(productData);
      showToast(t('product_saved'));
    }
    resetForm();
    loadProducts();
    document.querySelector('[data-tab="products"]').click();
  } catch (err) {
    console.error('Save product error:', err);
    showToast(t('product_error') + ': ' + err.message, 'error');
  }
});

// 📦 تحميل وعرض المنتجات
async function loadProducts() {
  try {
    const snap = await db.collection('products').orderBy('updatedAt', 'desc').get();
    allProducts = [];
    snap.forEach(doc => {
      allProducts.push({ id: doc.id, ...doc.data() });
    });
    renderProductsList();
  } catch (err) {
    console.error('Load products error:', err);
    document.getElementById('products-list').innerHTML = `<p class="text-red-500">خطأ في التحميل: ${err.message}</p>`;
  }
}
function renderProductsList() {
  const list = document.getElementById('products-list');
  if (allProducts.length === 0) {
    list.innerHTML = `<p class="text-center text-gray-400 py-6">${t('no_products')}</p>`;
    return;
  }
  list.innerHTML = allProducts.map(p => {
    const img = p.images?.[0] || 'https://via.placeholder.com/80x80?text=No+Image';
    const totalStock = (p.variants || []).reduce((sum, v) => sum + (v.stock || 0), 0);
    const discount = p.priceOriginal ? Math.round((1 - p.price/p.priceOriginal)*100) : 0;
    return `
      <div class="flex flex-wrap items-center gap-4 p-3 border rounded-lg hover:bg-gray-50 ${p.category==='offer'?'border-red-300 bg-red-50':''} ${p.category==='gift'?'border-purple-300 bg-purple-50':''}">
        <img src="${img}" alt="${p.name}" class="w-20 h-20 object-cover rounded-lg">
        <div class="flex-1 min-w-[200px]">
          <h4 class="font-bold text-lg">${p.name} ${p.category==='offer'?' ⭐':''} ${p.category==='gift'?' 🎁':''}</h4>
          <p class="text-sm text-gray-500">
            السعر: ${p.price} درهم | المخزون: ${totalStock} قطعة
            ${discount>0 ? ` | خصم: ${discount}%` : ''}
          </p>
          <p class="text-xs text-gray-400">
            ${(p.variants||[]).map(v => `${v.color} / ${v.size}: ${v.stock}`).join(' | ')}
          </p>
        </div>
        <button class="btn btn-primary btn-sm" onclick="editProduct('${p.id}')">
          <i class="fa-solid fa-pen-to-square ml-1"></i> ${t('edit')}
        </button>
      </div>
    `;
  }).join('');
}

// ✏️ تعديل وحذف منتج
async function editProduct(productId) {
  const product = allProducts.find(p => p.id === productId);
  if (!product) return;
  currentEditProductId = productId;
  document.getElementById('form-title').textContent = t('tab_edit_product');
  document.getElementById('save-btn').querySelector('span').textContent = t('update_product');
  document.getElementById('delete-btn').classList.remove('hidden');
  
  document.getElementById('prod-name').value = product.name || '';
  document.getElementById('prod-price').value = product.price || '';
  document.getElementById('prod-price-orig').value = product.priceOriginal || '';
  document.getElementById('prod-desc').value = product.description || '';
  document.getElementById('prod-gender').value = product.gender || 'men';
  document.getElementById('prod-type').value = product.type || 'hoodie';
  document.getElementById('prod-category').value = product.category || '';
  document.getElementById('prod-season').value = product.season || 'all';
  document.getElementById('prod-images').value = (product.images || []).join(', ');
  
  document.getElementById('variants-container').innerHTML = '';
  (product.variants || []).forEach(v => addVariantRow(v.color, v.size, v.stock));
  document.querySelector('[data-tab="add-product"]').click();
}
async function deleteProduct() {
  if (!currentEditProductId) return;
  if (!confirm(t('confirm_delete'))) return;
  try {
    await db.collection('products').doc(currentEditProductId).delete();
    showToast(t('product_deleted'));
    resetForm();
    loadProducts();
    document.querySelector('[data-tab="products"]').click();
  } catch (err) {
    showToast('❌ خطأ في الحذف: ' + err.message, 'error');
  }
}
function resetForm() {
  currentEditProductId = null;
  document.getElementById('product-form').reset();
  document.getElementById('form-title').textContent = t('tab_add_product');
  document.getElementById('save-btn').querySelector('span').textContent = t('save_product');
  document.getElementById('delete-btn').classList.add('hidden');
  document.getElementById('variants-container').innerHTML = '';
  addVariantRow();
}

// 📋 تحميل وعرض الطلبات
async function loadOrders() {
  try {
    const snap = await db.collection('orders').orderBy('createdAt', 'desc').limit(100).get();
    allOrders = [];
    snap.forEach(doc => {
      allOrders.push({ id: doc.id, ...doc.data() });
    });
    filteredOrders = allOrders.filter(o => !o.isReturnRequest);
    allReturns = allOrders.filter(o => o.isReturnRequest);
    renderOrdersList();
    renderReturnsList();
  } catch (err) {
    console.error('Load orders error:', err);
    document.getElementById('orders-list').innerHTML = `<p class="text-red-500">خطأ: ${err.message}</p>`;
  }
}
function filterOrders(keyword) {
  const kw = keyword.toLowerCase().trim();
  filteredOrders = kw ? allOrders.filter(o => 
    !o.isReturnRequest && (
      o.id.toLowerCase().includes(kw) ||
      (o.customerName || '').toLowerCase().includes(kw) ||
      (o.customerEmail || '').toLowerCase().includes(kw)
    )
  ) : allOrders.filter(o => !o.isReturnRequest);
  renderOrdersList();
}
function renderOrdersList() {
  const list = document.getElementById('orders-list');
  if (filteredOrders.length === 0) {
    list.innerHTML = `<p class="text-center text-gray-400 py-6">${t('no_orders')}</p>`;
    return;
  }
  list.innerHTML = filteredOrders.map(order => {
    const itemsList = (order.items || []).map(i => `${i.name} × ${i.qty} (${i.color} / ${i.size})`).join('<br>');
    const statusClass = getStatusClass(order.status || 'pending');
    const statusText = getStatusText(order.status || 'pending');
    const createdAt = order.createdAt ? new Date(order.createdAt.toDate()).toLocaleString('ar-AE') : '-';
    const deliveryDate = order.deliveryDate || '';
    const customerEmail = order.customerEmail || '';
    return `
      <div class="card p-4 border-l-4 border-gray-200">
        <div class="flex flex-wrap justify-between items-start gap-2 mb-3">
          <div>
            <h4 class="font-bold text-lg">${t('order_id')}: ${order.id.slice(0, 8)}...</h4>
            <p class="text-sm text-gray-500">${createdAt}</p>
          </div>
          <span class="status-badge ${statusClass}">${statusText}</span>
        </div>
        <div class="grid md:grid-cols-2 gap-4 mb-3 text-sm">
          <div>
            <p><strong>${t('customer_name')}:</strong> ${order.customerName || '-'}</p>
            <p><strong>${t('customer_email')}:</strong> ${customerEmail || '-'}</p>
            <p><strong>${t('customer_phone')}:</strong> ${order.customerPhone || '-'}</p>
          </div>
          <div>
            <p><strong>${t('order_address')}:</strong> ${order.address || '-'}</p>
            <p><strong>${t('order_total')}:</strong> ${order.totalPrice || 0} درهم</p>
            <p><strong>${t('delivery_date')}:</strong> ${deliveryDate || 'غير محدد'}</p>
          </div>
        </div>
        <div class="text-sm bg-gray-50 p-2 rounded mb-3">
          <strong>${t('order_items')}:</strong><br>${itemsList}
        </div>
        <div class="border-t pt-3 space-y-3">
          <div class="flex flex-wrap gap-2">
            <button class="btn btn-sm ${order.status==='pending'?'btn-primary':'btn-success'}" 
                    onclick="updateOrderStatus('${order.id}', 'confirmed', '${customerEmail}')" ${order.status!=='pending'?'disabled':''}>
              <i class="fa-solid fa-check-circle ml-1"></i> ${t('step1')}
            </button>
            <button class="btn btn-sm ${order.status==='confirmed'?'btn-primary':'bg-gray-200 text-gray-500'}" 
                    onclick="updateOrderStatus('${order.id}', 'preparing', '${customerEmail}')" ${order.status!=='confirmed'?'disabled':''}>
              <i class="fa-solid fa-box ml-1"></i> ${t('step2')}
            </button>
            <button class="btn btn-sm ${order.status==='preparing'?'btn-primary':'bg-gray-200 text-gray-500'}" 
                    onclick="updateOrderStatus('${order.id}', 'shipping', '${customerEmail}')" ${order.status!=='preparing'?'disabled':''}>
              <i class="fa-solid fa-truck ml-1"></i> ${t('step3')}
            </button>
            <button class="btn btn-sm bg-gray-100 border" style="border:1px solid #ccc;" onclick="openDeliveryDateModal('${order.id}')">
              <i class="fa-solid fa-calendar-check ml-1"></i> ${t('step4')}
            </button>
            <button class="btn btn-sm btn-danger" onclick="cancelOrder('${order.id}')" ${order.status==='delivered'||order.status==='cancelled'?'disabled':''}>
              <i class="fa-solid fa-ban ml-1"></i> ${t('cancel_order')}
            </button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}
