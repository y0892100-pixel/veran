  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; display: none; }

    .toast.success { background: #16a34a; }
    .toast.error { background: #dc2626; }
    .tab-btn.active { background: black; color: white; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCXYzZgFIFU2u6R02_ConvSonD9SJRWS9Q",
  authDomain: "varen-f7756.firebaseapp.com",
  projectId: "varen-f7756",
  storageBucket: "varen-f7756.firebasestorage.app",
  messagingSenderId: "648684291842",
  appId: "1:648684291842:web:f3e806fc76a6e119caa41b",
  measurementId: "G-SV7DKGPH2M"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const ADMIN_EMAIL = 'y0892100@gmail.com';

<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <a href="index.html" class="flex items-center gap-3">
      <img src="https://i.imgur.com/QXFR5XO.jpeg" alt="VAREN Logo" class="w-10 h-10 object-contain rounded">
      <span class="text-2xl font-black text-gray-900">لوحة التحكم — VAREN</span>
    </a>
    <div>
      <button onclick="logout()" class="text-red-500 hover:text-red-700 font-medium">
        <i class="fa-solid fa-right-from-bracket ml-1"></i> تسجيل الخروج
      </button>
    </div>
  </div>
</nav>

<!-- شاشة رفض الوصول -->
<div id="access-denied" class="hidden max-w-md mx-auto px-4 py-20 text-center">
  <i class="fa-solid fa-lock text-6xl text-red-400 mb-4"></i>
  <h1 class="text-2xl font-bold text-red-600 mb-2">غير مصرّح لك بالدخول</h1>
  <p class="text-gray-500 mb-6">هذه الصفحة خاصة بصاحب المتجر فقط</p>
  <a href="index.html" class="bg-black text-white px-6 py-2 rounded-lg inline-block">العودة للرئيسية</a>
</div>

<!-- محتوى لوحة التحكم -->
<div id="admin-content" class="hidden max-w-7xl mx-auto px-4 py-6">
  <!-- التبويبات -->
  <div class="flex flex-wrap gap-2 mb-6 border-b pb-2">
    <button class="tab-btn active px-4 py-2 rounded-t-lg border-t border-l border-r" onclick="showTab('products')">
      <i class="fa-solid fa-box ml-1"></i> المنتجات
    </button>
    <button class="tab-btn px-4 py-2 rounded-t-lg border-t border-l border-r" onclick="showTab('orders')">
      <i class="fa-solid fa-file-invoice ml-1"></i> الطلبات
    </button>
  </div>

  <!-- قسم المنتجات -->
  <div id="tab-products" class="tab-content">
    <button onclick="showAddForm()" class="bg-black text-white px-4 py-2 rounded-lg mb-6">
      <i class="fa-solid fa-plus ml-1"></i> إضافة منتج جديد
    </button>
    
    <!-- نموذج إضافة/تعديل منتج -->
    <div id="product-form" class="hidden bg-white rounded-xl shadow-sm p-6 mb-8 border">
      <h3 class="text-xl font-bold mb-4" id="form-title">إضافة منتج جديد</h3>
      <form id="prod-form" class="space-y-4">
        <input type="hidden" id="prod-id">
        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="block font-medium mb-1">اسم المنتج</label>
            <input type="text" id="prod-name" required class="w-full border rounded-lg px-4 py-2">
          </div>
          <div>
            <label class="block font-medium mb-1">السعر (درهم)</label>
            <input type="number" step="0.01" id="prod-price" required class="w-full border rounded-lg px-4 py-2">
          </div>
          <div>
            <label class="block font-medium mb-1">السعر الأصلي (اختياري)</label>
            <input type="number" step="0.01" id="prod-price-orig" class="w-full border rounded-lg px-4 py-2">
          </div>
          <div>
            <label class="block font-medium mb-1">التصنيف</label>
            <select id="prod-gender" class="w-full border rounded-lg px-4 py-2">
              <option value="men">رجالي</option>
              <option value="women">نسائي</option>
              <option value="kids">أطفال</option>
            </select>
          </div>
          <div>
            <label class="block font-medium mb-1">النوع</label>
            <input type="text" id="prod-type" placeholder="هودي، تيشيرت، بنطلون..." class="w-full border rounded-lg px-4 py-2">
          </div>
          <div>
            <label class="block font-medium mb-1">الموسم</label>
            <select id="prod-season" class="w-full border rounded-lg px-4 py-2">
              <option value="">عام</option>
              <option value="winter">شتوي</option>
              <option value="summer">صيفي</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block font-medium mb-1">روابط الصور (افصل بينها بفاصلة)</label>
          <textarea id="prod-images" rows="2" placeholder="رابط1, رابط2..." class="w-full border rounded-lg px-4 py-2"></textarea>
        </div>
        <div>
          <label class="block font-medium mb-1">المخزون — اللون | المقاس | الكمية (كل سطر)</label>
          <textarea id="prod-variants" rows="5" placeholder="أسود | M | 10&#10;أسود | L | 5&#10;أبيض | M | 8" class="w-full border rounded-lg px-4 py-2"></textarea>
        </div>
        <div class="flex gap-2">
          <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg">حفظ</button>
          <button type="button" onclick="hideForm()" class="bg-gray-300 px-6 py-2 rounded-lg">إلغاء</button>
        </div>
      </form>
    </div>

    <!-- قائمة المنتجات -->
    <div id="products-list" class="space-y-3"></div>
  </div>

  <!-- قسم الطلبات -->
  <div id="tab-orders" class="tab-content hidden">
    <h2 class="text-xl font-bold mb-4">إدارة الطلبات</h2>
    <div id="orders-list" class="space-y-3"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
function showToast(msg, type='success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast ${type} show`;
  setTimeout(() => toast.classList.remove('show'), 4000);
}

function showTab(tabName) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
  document.getElementById(`tab-${tabName}`).classList.remove('hidden');
  
  if (tabName === 'products') loadProducts();
  if (tabName === 'orders') loadOrders();
}

function showAddForm() {
  document.getElementById('product-form').classList.remove('hidden');
  document.getElementById('form-title').textContent = 'إضافة منتج جديد';
  document.getElementById('prod-form').reset();
  document.getElementById('prod-id').value = '';
}

function hideForm() {
  document.getElementById('product-form').classList.add('hidden');
}

function parseVariants(text) {
  if (!text) return [];
  return text.split('\n').map(line => {
    const parts = line.split('|').map(p => p.trim());
    if (parts.length >= 3) {
      return { color: parts[0], size: parts[1], stock: parseInt(parts[2]) || 0 };
    }
    return null;
  }).filter(Boolean);
}

function parseImages(text) {
  if (!text) return [];
  return text.split(',').map(s => s.trim()).filter(Boolean);
}

// حفظ منتج
document.getElementById('prod-form').addEventListener('submit', async e => {
  e.preventDefault();
  const id = document.getElementById('prod-id').value;
  const data = {
    name: document.getElementById('prod-name').value,
    price: parseFloat(document.getElementById('prod-price').value),
    priceOriginal: document.getElementById('prod-price-orig').value ? parseFloat(document.getElementById('prod-price-orig').value) : null,
    gender: document.getElementById('prod-gender').value,
    type: document.getElementById('prod-type').value,
    season: document.getElementById('prod-season').value,
    images: parseImages(document.getElementById('prod-images').value),
    variants: parseVariants(document.getElementById('prod-variants').value),
    available: true,
    updatedAt: new Date()
  };

  try {
    if (id) {
      await db.collection('products').doc(id).update(data);
      showToast('✅ تم تحديث المنتج');
    } else {
      data.createdAt = new Date();
      await db.collection('products').add(data);
      showToast('✅ تم إضافة المنتج');
    }
    hideForm();
    loadProducts();
  } catch (err) {
    showToast('❌ خطأ: ' + err.message, 'error');
  }
});

// تحميل المنتجات
async function loadProducts() {
  const list = document.getElementById('products-list');
  try {
    const snap = await db.collection('products').orderBy('createdAt','desc').get();
    list.innerHTML = '';
    snap.forEach(doc => {
      const p = { id: doc.id, ...doc.data() };
      const totalStock = (p.variants || []).reduce((sum,v) => sum + (v.stock||0), 0);
      list.innerHTML += `
        <div class="bg-white rounded-xl shadow-sm p-4 border flex justify-between items-center">
          <div>
            <h4 class="font-bold text-lg">${p.name}</h4>
            <p class="text-sm text-gray-500">${p.price} درهم | المخزون: ${totalStock} قطعة</p>
          </div>
          <div class="flex gap-2">
            <button onclick="editProduct('${doc.id}')" class="bg-blue-500 text-white px-3 py-1 rounded">تعديل</button>
            <button onclick="deleteProduct('${doc.id}')" class="bg-red-500 text-white px-3 py-1 rounded">حذف</button>
          </div>
        </div>
      `;
    });
  } catch (err) {
    list.innerHTML = `<p class="text-red-500">خطأ في التحميل: ${err.message}</p>`;
  }
}

window.editProduct = async function(id) {
  const doc = await db.collection('products').doc(id).get();
  if (!doc.exists) return;
  const p = { id: doc.id, ...doc.data() };
  
  document.getElementById('product-form').classList.remove('hidden');
  document.getElementById('form-title').textContent = 'تعديل المنتج';
  document.getElementById('prod-id').value = p.id;
  document.getElementById('prod-name').value = p.name || '';
  document.getElementById('prod-price').value = p.price || '';
  document.getElementById('prod-price-orig').value = p.priceOriginal || '';
  document.getElementById('prod-gender').value = p.gender || 'men';
  document.getElementById('prod-type').value = p.type || '';
  document.getElementById('prod-season').value = p.season || '';
  document.getElementById('prod-images').value = (p.images || []).join(', ');
  
  const vars = (p.variants || []).map(v => `${v.color} | ${v.size} | ${v.stock}`).join('\n');
  document.getElementById('prod-variants').value = vars;
};

window.deleteProduct = async function(id) {
  if (!confirm('متأكد من الحذف؟')) return;
  await db.collection('products').doc(id).delete();
  showToast('✅ تم الحذف');
  loadProducts();
};

// تحميل الطلبات
async function loadOrders() {
  const list = document.getElementById('orders-list');
  try {
    const snap = await db.collection('orders').orderBy('createdAt','desc').limit(50).get();
    list.innerHTML = '';
    if (snap.empty) {
      list.innerHTML = '<p class="text-gray-500">لا توجد طلبات بعد</p>';
      return;
    }
    snap.forEach(doc => {
      const o = { id: doc.id, ...doc.data() };
      list.innerHTML += `
        <div class="bg-white rounded-xl shadow-sm p-4 border">
          <div class="flex justify-between items-start mb-2">
            <span class="font-bold">طلب #${o.id.slice(0,8)}</span>
            <span class="px-2 py-1 rounded text-sm font-medium ${
              o.status === 'confirmed' ? 'bg-green-100 text-green-700' :
              o.status === 'shipped' ? 'bg-blue-100 text-blue-700' :
              o.status === 'cancelled' ? 'bg-red-100 text-red-700' :
              'bg-yellow-100 text-yellow-700'
            }">${o.status || 'pending'}</span>
          </div>
          <p class="text-sm text-gray-600">الاسم: ${o.fullName || '-'}</p>
          <p class="text-sm text-gray-600">الإيميل: ${o.email || '-'}</p>
          <p class="text-sm text-gray-600">المجموع: ${o.total || 0} درهم</p>
        </div>
      `;
    });
  } catch (err) {
    list.innerHTML = `<p class="text-red-500">خطأ: ${err.message}</p>`;
  }
}

// تسجيل الخروج
window.logout = async function() {
  await auth.signOut();
  window.location.href = 'index.html';
};

// فحص الصلاحية
function checkAdminAccess(user) {
  const accessDenied = document.getElementById('access-denied');
  const adminContent = document.getElementById('admin-content');
  
  if (user && user.email === ADMIN_EMAIL) {
    accessDenied.classList.add('hidden');
    adminContent.classList.remove('hidden');
    loadProducts();
  } else {
    accessDenied.classList.remove('hidden');
    adminContent.classList.add('hidden');
    if (user) {
      setTimeout(() => auth.signOut(), 3000);
    }
  }
}

document.addEventListener('DOMContentLoaded', () => {
  auth.onAuthStateChanged(user => {
    if (!user) {
      window.location.href = 'login.html?redirect=admin.html';
      return;
    }
    checkAdminAccess(user);
  });
});
</script>
