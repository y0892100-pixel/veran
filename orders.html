<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="page_title">طلباتي - VAREN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    html[lang="en"] { direction: ltr; }
    html[lang="en"] * { font-family: 'Cairo', sans-serif; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); color: white; padding: 14px 28px; border-radius: 12px; z-index: 9999; display: none; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,0.18); }
    .toast.show { display: block; animation: fadeInUp 0.35s ease; }
    .toast.success { background: linear-gradient(135deg, #16a34a, #15803d); }
    .toast.error { background: linear-gradient(135deg, #dc2626, #b91c1c); }
    .toast.warning { background: linear-gradient(135deg, #f59e0b, #d97706); }
    @keyframes fadeInUp { from { opacity:0; transform: translate(-50%, 25px); } to { opacity:1; transform: translate(-50%, 0); } }
    
    .status-badge { padding: 5px 14px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; }
    .status-new { background: #dbeafe; color: #1e40af; }
    .status-confirmed { background: #d1fae5; color: #065f46; }
    .status-preparing { background: #e0e7ff; color: #3730a3; }
    .status-shipping { background: #fef3c7; color: #92400e; }
    .status-delivered { background: #dcfce7; color: #166534; }
    .status-cancelled { background: #fee2e2; color: #991b1b; }
    
    .progress-bar { height: 8px; background: #e5e7eb; border-radius: 4px; margin-top: 8px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #16a34a); border-radius: 4px; transition: width 0.5s ease; }
    .lang-option:hover { background: #f3f4f6; }
    .lang-option.active { background: #e5e7eb; font-weight: bold; }
  </style>
</head>
<body class="bg-gray-50">
<script>
const translations = {
  ar: {
    page_title: "طلباتي - VAREN",
    my_orders: "طلباتي",
    loading: "جاري التحميل...",
    no_orders: "ليس لديك طلبات حتى الآن",
    start_shopping: "ابدأ التسوق",
    please_login: "سجّل الدخول أولاً",

    delivery_date: "📅 تاريخ استلام الطلب المتوقع",

    address: "العنوان",
    products: "المنتجات",
    total: "المجموع الكلي",
    AED: "درهم",
    status_new: "جديد",
    status_confirmed: "✅ مؤكد",
    status_preparing: "🔄 جاري التجهيز",
    status_shipping: "🚚 جاري التوصيل",
    status_delivered: "✅ تم التسليم",
    status_cancelled: "❌ ملغي",
    cancel_order: "إلغاء الطلب",
    hours_remaining: "ساعات متبقية للإلغاء",
    cancellation_expired: "⏱️ انتهت مدة الإلغاء (6 ساعات)",
    request_return: "طلب استرجاع",
    confirm_cancel: "هل أنت متأكد من إلغاء الطلب؟ سيتم إرجاع الكميات للمخزون تلقائيًا.",
    cancel_success: "✅ تم إلغاء الطلب وإرجاع الكميات للمخزون",
    cancel_error: "❌ خطأ في الإلغاء: ",
    load_error: "خطأ في تحميل الطلبات: ",
    size: "المقاس",
    color: "اللون",
    my_info: "بيانات الحساب",
    returns: "طلبات الاسترجاع",
    admin_panel: "لوحة التحكم",
    logout: "تسجيل الخروج",
    language: "اللغة",
    undefined: "غير محدد",
    not_provided: "غير مذكور"
  },
  en: {
    page_title: "My Orders - VAREN",
    my_orders: "My Orders",
    loading: "Loading...",
    no_orders: "You have no orders yet",
    start_shopping: "Start Shopping",
    please_login: "Please sign in first",
    login: "Sign In",
    order_number: "Order #",
    date: "Order Date",
    delivery_date: "📅 Expected Delivery Date",
    customer_name: "Name",
    phone: "Phone",
    address: "Delivery Address",
    products: "Items",
    total: "Total",
    AED: "AED",
    status_new: "New",
    status_confirmed: "✅ Confirmed",
    status_preparing: "🔄 Preparing",
    status_shipping: "🚚 Out for Delivery",
    status_delivered: "✅ Delivered",
    status_cancelled: "❌ Cancelled",
    cancel_order: "Cancel Order",
    hours_remaining: "hours left to cancel",
    cancellation_expired: "⏱️ Cancellation period expired (6 hours)",
    request_return: "Request Return",
    confirm_cancel: "Are you sure you want to cancel this order? Stock will be restored automatically.",
    cancel_success: "✅ Order cancelled and stock restored",
    cancel_error: "❌ Cancellation error: ",
    load_error: "Error loading orders: ",
    size: "Size",
    color: "Color",
    my_info: "Account Information",
    returns: "Returns",
    admin_panel: "Admin Panel",
    logout: "Sign Out",
    language: "Language",
    undefined: "Not specified",
    not_provided: "Not provided"
  }
};
function setLanguage(lang) {
  if (!translations[lang]) return;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  localStorage.setItem('varen_lang', lang);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (translations[lang][key]) el.textContent = translations[lang][key];
  });
}
function getCurrentLanguage() {
  return localStorage.getItem('varen_lang') || 'ar';
}
function t(key) {
  return translations[getCurrentLanguage()][key] || key;
}
document.addEventListener('DOMContentLoaded', () => {
  setLanguage(getCurrentLanguage());
});
</script>
<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <a href="index.html" class="flex items-center gap-3">
      <img src="https://i.imgur.com/QXFR5XO.jpeg" alt="VAREN Logo" class="w-10 h-10 object-contain rounded">
      <span class="text-3xl md:text-4xl font-black text-gray-900 tracking-tight">VAREN</span>
    </a>
    <div id="user-area" class="relative"></div>
  </div>
</nav>
<main class="max-w-3xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-6" data-i18n="my_orders">طلباتي</h1>
  <div id="toast" class="toast"></div>
  
  <div id="loading" class="text-center py-16">
    <i class="fa-solid fa-spinner fa-spin fa-2xl"></i>
    <p class="mt-2 text-gray-500" data-i18n="loading">جاري التحميل...</p>
  </div>
  <div id="content" class="hidden">
    <div id="orders-list"></div>
  </div>
  <div id="no-orders" class="hidden text-center py-16">
    <i class="fa-solid fa-box-open text-6xl text-gray-300 mb-4"></i>
    <p class="text-xl text-gray-500 mb-4" data-i18n="no_orders">ليس لديك طلبات حتى الآن</p>
    <a href="index.html" class="bg-black text-white px-6 py-2 rounded-lg inline-block" data-i18n="start_shopping">ابدأ التسوق</a>
  </div>
  <div id="no-login" class="hidden text-center py-16">
    <i class="fa-solid fa-lock text-6xl text-gray-300 mb-4"></i>
    <p class="text-xl text-gray-500 mb-4" data-i18n="please_login">سجّل الدخول أولاً</p>
    <a href="login.html" class="bg-black text-white px-6 py-2 rounded-lg inline-block" data-i18n="login">تسجيل الدخول</a>
  </div>
</main>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCXYzZgFIFU2u6R02_ConvSonD9SJRWS9Q",
  authDomain: "varen-f7756.firebaseapp.com",
  projectId: "varen-f7756",
  storageBucket: "varen-f7756.firebasestorage.app",
  messagingSenderId: "648684291842",
  appId: "1:648684291842:web:f3e806fc76a6e119caa41b",
  measurementId: "G-SV7DKGPH2M"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const ADMIN_EMAIL = 'y0892100@gmail.com';

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 5000);
}
function formatDate(timestamp) {
  if (!timestamp) return t('undefined');
  const d = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
  const lang = getCurrentLanguage();
  return d.toLocaleString(lang === 'ar' ? 'ar-AE' : 'en-AE');
}
function isWithinCancellationWindow(createdAt) {
  if (!createdAt) return false;
  const orderDate = createdAt.toDate ? createdAt.toDate() : new Date(createdAt);
  const now = new Date();
  const hoursDiff = (now - orderDate) / (1000 * 60 * 60);
  return hoursDiff < 6;
}
function getHoursRemaining(createdAt) {
  if (!createdAt) return 0;
  const orderDate = createdAt.toDate ? createdAt.toDate() : new Date(createdAt);
  const now = new Date();
  const hoursDiff = (now - orderDate) / (1000 * 60 * 60);
  return Math.max(0, 6 - hoursDiff).toFixed(1);
}

// ❌ إلغاء الطلب + إرجاع الكمية للمخزون
window.cancelOrder = async function(orderId, orderItems) {
  if (!confirm(t('confirm_cancel'))) return;
  try {
    const batch = db.batch();
    const orderRef = db.collection('orders').doc(orderId);
    batch.update(orderRef, { status: 'ملغي', updatedAt: firebase.firestore.FieldValue.serverTimestamp() });

    // إرجاع كل كميات المنتجات للمخزون
    for (const item of orderItems) {
      if (!item.productId || !item.color || !item.size) continue;
      const qty = item.qty || item.quantity || 1;
      const productRef = db.collection('products').doc(item.productId);
      const productDoc = await productRef.get();
      if (productDoc.exists) {
        const data = productDoc.data();
        const variants = data.variants || [];
        const idx = variants.findIndex(v => 
          String(v.color).trim() === String(item.color).trim() && 
          String(v.size).trim() === String(item.size).trim()
        );
        if (idx !== -1) {
          variants[idx].stock = (variants[idx].stock || 0) + qty;
          batch.update(productRef, { variants });
        }
      }
    }
    await batch.commit();
    showToast(t('cancel_success'));
    setTimeout(() => location.reload(), 1500);
  } catch (err) {
    console.error(err);
    showToast(t('cancel_error') + err.message, 'error');
  }
};

// 🧭 شريط التقدم حسب الحالة
function getProgressPercent(status) {
  const map = {
    'جديد': 15,
    'pending': 15,
    'مؤكد': 35,
    'confirmed': 35,
    'يتم تجهيز طلبك': 60,
    'preparing': 60,
    'يتم تجهيز توصيل طلبك': 85,
    'shipping': 85,
    'تم التسليم': 100,
    'delivered': 100,
    'ملغي': 0,
    'cancelled': 0
  };
  return map[status] || 10;
}

function updateUserNav(user) {
  const lang = getCurrentLanguage();
  const area = document.getElementById('user-area');
  if (!user) {
    area.innerHTML = `<button onclick="window.location.href='login.html'" class="bg-black text-white px-4 py-2 rounded-lg hover:bg-gray-800" data-i18n="login">تسجيل الدخول</button>`;
    return;
  }
  const isAdmin = user.email === ADMIN_EMAIL;
  area.innerHTML = `
    <div class="relative">
      <button id="account-nav-btn" class="flex items-center gap-2 bg-gray-100 px-3 py-2 rounded-lg hover:bg-gray-200">
        <i class="fa-solid fa-user-circle"></i>
        <span>${user.displayName || (lang === 'ar' ? 'حسابي' : 'My Account')}</span>
        <i class="fa-solid fa-chevron-down text-xs ml-1"></i>
      </button>
      <div id="account-nav-menu" class="hidden absolute left-0 mt-2 w-56 bg-white rounded-lg shadow-xl border z-50">
        <a href="account.html" class="block px-4 py-3 hover:bg-gray-50 border-b">
          <i class="fa-solid fa-id-card ml-2"></i> <span data-i18n="my_info">${t('my_info')}</span>
        </a>
        <a href="orders.html" class="block px-4 py-3 hover:bg-gray-50 border-b">
          <i class="fa-solid fa-box ml-2"></i> <span data-i18n="my_orders">${t('my_orders')}</span>
        </a>
        <a href="returns.html" class="block px-4 py-3 hover:bg-gray-50 border-b">
          <i class="fa-solid fa-undo ml-2"></i> <span data-i18n="returns">${t('returns')}</span>
        </a>
        ${isAdmin ? `<a href="admin.html" class="block px-4 py-3 hover:bg-gray-50 border-b text-red-600 font-medium">
          <i class="fa-solid fa-gear ml-2"></i> <span data-i18n="admin_panel">${t('admin_panel')}</span>
        </a>` : ''}
        <hr class="mx-3">
        <div class="px-4 py-2">
          <p class="text-sm font-semibold text-gray-500 mb-2" data-i18n="language">${t('language')}</p>
          <button onclick="setLanguage('ar')" class="lang-option w-full text-right px-3 py-2 rounded text-sm" data-lang="ar">العربية</button>
          <button onclick="setLanguage('en')" class="lang-option w-full text-right px-3 py-2 rounded text-sm mt-1" data-lang="en">English</button>
        </div>
        <hr class="mx-3 mt-2">
        <button onclick="logout()" class="w-full text-right px-4 py-3 hover:bg-gray-50 text-red-500 font-medium">
          <i class="fa-solid fa-right-from-bracket ml-2"></i> <span data-i18n="logout">${t('logout')}</span>
        </button>
      </div>
    </div>
  `;
  setTimeout(() => {
    const btn = document.getElementById('account-nav-btn');
    const menu = document.getElementById('account-nav-menu');
    if (btn && menu) {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.classList.toggle('hidden');
      });
      document.addEventListener('click', () => menu.classList.add('hidden'));
      menu.addEventListener('click', (e) => e.stopPropagation());
    }
  }, 0);
}

window.logout = async () => {
  await auth.signOut();
  window.location.href = 'index.html';
};

auth.onAuthStateChanged(async user => {
  document.getElementById('loading').classList.add('hidden');
  
  if (!user) {
    document.getElementById('no-login').classList.remove('hidden');
    return;
  }
  
  document.getElementById('content').classList.remove('hidden');
  updateUserNav(user);
  
  try {
    const unsubscribe = db.collection('orders')
      .where('userId', '==', user.uid)
      .orderBy('createdAt', 'desc')
      .onSnapshot(snapshot => {
        const list = document.getElementById('orders-list');
        list.innerHTML = '';
        
        if (snapshot.empty) {
          document.getElementById('no-orders').classList.remove('hidden');
          return;
        }
        document.getElementById('no-orders').classList.add('hidden');
        
        snapshot.forEach(doc => {
          const order = { id: doc.id, ...doc.data() };
          const canCancel = (order.status !== 'ملغي' && order.status !== 'cancelled') && isWithinCancellationWindow(order.createdAt);
          const hoursLeft = getHoursRemaining(order.createdAt);
          const progress = getProgressPercent(order.status);
          
          // تحديد لون ونص الحالة
          let statusClass, statusText;
          if (order.status === 'جديد' || order.status === 'pending' || order.status === 'New') {
            statusClass = 'status-new';
            statusText = t('status_new');
          } else if (order.status === 'مؤكد' || order.status === 'confirmed' || order.status === 'Confirmed') {
            statusClass = 'status-confirmed';
            statusText = t('status_confirmed');
          } else if (order.status === 'يتم تجهيز طلبك' || order.status === 'preparing') {
            statusClass = 'status-preparing';
            statusText = t('status_preparing');
          } else if (order.status === 'يتم تجهيز توصيل طلبك' || order.status === 'shipping') {
            statusClass = 'status-shipping';
            statusText = t('status_shipping');
          } else if (order.status === 'تم التسليم' || order.status === 'delivered' || order.status === 'Delivered') {
            statusClass = 'status-delivered';
            statusText = t('status_delivered');
          } else if (order.status === 'ملغي' || order.status === 'cancelled' || order.status === 'Cancelled') {
            statusClass = 'status-cancelled';
            statusText = t('status_cancelled');
          } else {
            statusClass = 'bg-gray-100 text-gray-700';
            statusText = order.status || t('status_new');
          }
          
          // عرض تاريخ التوصيل لو موجود
          const deliveryDateLine = order.deliveryDate ? 
            `<p class="text-sm text-green-700 font-medium mb-2">📅 ${t('delivery_date')}: ${order.deliveryDate}</p>` : '';
          
          list.innerHTML += `
            <div class="bg-white p-5 rounded-xl shadow-sm mb-4 border">
              <div class="flex flex-wrap justify-between items-center mb-3 gap-2">
                <span class="font-bold">${t('order_number')}: ${(order.orderNumber || order.id).slice(0, 12)}</span>
                <span class="status-badge ${statusClass}">${statusText}</span>
              </div>
              
              <!-- شريط التقدم -->
              <div class="progress-bar mb-3">
                <div class="progress-fill" style="width: ${progress}%"></div>
              </div>
              
              <p class="text-sm text-gray-600 mb-1">${t('date')}: ${formatDate(order.createdAt)}</p>
              ${deliveryDateLine}
              <p class="text-sm text-gray-600 mb-1">${t('customer_name')}: ${order.fullName || order.customerName || order.name || t('not_provided')}</p>
              <p class="text-sm text-gray-600 mb-1">${t('phone')}: ${order.phone || order.customerPhone || t('not_provided')}</p>
              <p class="text-sm text-gray-600 mb-3">${t('address')}: ${order.address || t('not_provided')}</p>
              
              <div class="border-t pt-3 mb-3">
                <p class="font-semibold mb-2">${t('products')}:</p>
                ${(order.items || []).map(item => {
                  const qty = item.qty || item.quantity || 1;
                  return `
                    <div class="flex justify-between text-sm py-1">
                      <span>${item.name} — ${t('size')}: ${item.size || '-'} — ${t('color')}: ${item.color || '-'} × ${qty}</span>
                      <span class="font-medium">${((item.price || 0) * qty).toFixed(2)} ${t('AED')}</span>
                    </div>
                  `;
                }).join('')}
                <div class="flex justify-between font-bold mt-2 pt-2 border-t">
                  <span>${t('total')}</span>
                  <span>${(order.totalPrice || order.total || 0).toFixed(2)} ${t('AED')}</span>
                </div>
              </div>
              
              ${(order.status !== 'ملغي' && order.status !== 'cancelled' && order.status !== 'delivered' && order.status !== 'تم التسليم') ? `
                <div class="flex flex-wrap gap-2 pt-2 border-t">
                  ${canCancel ? `
                    <button onclick="cancelOrder('${order.id}', ${JSON.stringify(order.items || []).replace(/"/g, '&quot;')})" 
                      class="px-4 py-2 bg-red-500 text-white rounded-lg text-sm hover:bg-red-600">
                      <i class="fa-solid fa-xmark ml-1"></i> ${t('cancel_order')} (${hoursLeft} ${t('hours_remaining')})
                    </button>
                  ` : `
                    <span class="text-sm text-gray-500 px-2 py-2">${t('cancellation_expired')}</span>
                  `}
                  <a href="returns.html?order=${encodeURIComponent(order.orderNumber || order.id)}" 
                    class="px-4 py-2 border border-gray-300 rounded-lg text-sm hover:bg-gray-50">
                    <i class="fa-solid fa-rotate-left ml-1"></i> ${t('request_return')}
                  </a>
                </div>
              ` : ''}
            </div>
          `;
        });
      });
    };
  } catch (err) {
    console.error(err);
    document.getElementById('orders-list').innerHTML = `<p class="text-red-500">${t('load_error')} ${err.message}</p>`;
  }
});
</script>
</body>
</html>
