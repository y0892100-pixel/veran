<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلباتي - VAREN</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import firebaseConfig from './firebase-config.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        window.app = { auth, db, collection, query, where, getDocs, onAuthStateChanged };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap'); * { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50">
<nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <a href="index.html" class="text-2xl font-bold">VAREN</a>
        <a href="account.html" class="text-gray-600 hover:text-black">رجوع للحساب</a>
    </div>
</nav>

<main class="max-w-4xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-bold mb-8">طلباتي</h1>
    <div id="orders-list" class="space-y-4">
        <p class="text-gray-500 text-center py-10">جاري التحميل...</p>
    </div>
</main>

<script type="module">
    const { auth, db, collection, query, where, getDocs, onAuthStateChanged } = window.app;

    onAuthStateChanged(auth, async user => {
        if (!user) { window.location.href = 'index.html'; return; }
        const listEl = document.getElementById('orders-list');
        const q = query(collection(db, 'orders'), where('userId', '==', user.uid));
        const snap = await getDocs(q);

        if (snap.empty) {
            listEl.innerHTML = '<p class="text-gray-500 text-center py-10">ليس لديك طلبات حتى الآن 🛒</p>';
            return;
        }

        listEl.innerHTML = '';
        snap.forEach(doc => {
            const order = doc.data();
            const date = order.createdAt?.toDate ? order.createdAt.toDate().toLocaleDateString('ar-AE') : 'غير محدد';
            listEl.innerHTML += `
                <div class="bg-white p-5 rounded-xl shadow-sm border">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold">طلب بتاريخ: ${date}</span>
                        <span class="px-3 py-1 rounded-full text-sm ${order.status === 'جديد' ? 'bg-blue-100 text-blue-800' : 'bg-gray-100'}">${order.status || 'قيد المراجعة'}</span>
                    </div>
                    <p class="text-lg font-semibold">المجموع: ${order.total || 0} درهم</p>
                    <p class="text-sm text-gray-500">العنوان: ${order.address || 'غير محدد'}</p>
                </div>
            `;
        });
    });
</script>
</body>
</html>
