<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المنتج - VAREN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/png" href="varen.jpeg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #22c55e; color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; display: none; }
    .toast.show { display: block; }
    .img-thumb { transition: all 0.2s; border: 2px solid transparent; }
    .img-thumb.active { border-color: black; }
    .size-option, .color-option { @apply border rounded-lg w-12 h-12 flex items-center justify-center cursor-pointer; }
    .size-option.selected, .color-option.selected { @apply bg-black text-white border-black; }
    .size-option.unavailable { @apply opacity-40 cursor-not-allowed; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, query, where, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import firebaseConfig from './firebase-config.js';
    import * as Store from './store.js';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();
    window.app = { auth, db, googleProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, signOut, onAuthStateChanged, updateProfile, doc, getDoc, collection, query, where, limit, getDocs };
    window.Store = Store;
  </script>
</head>
<body class="bg-gray-50 text-gray-800">

<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <a href="index.html" class="text-2xl font-bold text-gray-900">VAREN</a>
    <div class="hidden md:flex gap-8">
      <a href="index.html" class="hover:text-gray-600">الرئيسية</a>
      <a href="category.html?gender=women" class="hover:text-gray-600">نسائي</a>
      <a href="category.html?gender=men" class="hover:text-gray-600">رجالي</a>
      <a href="category.html?gender=girls" class="hover:text-gray-600">بنات</a>
      <a href="category.html?gender=boys" class="hover:text-gray-600">أولاد</a>
    </div>
    <div class="flex items-center gap-4">
      <a href="cart.html" class="text-xl relative">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
      </a>
      <div id="user-area">
        <button id="login-btn" onclick="openModal('login-modal')" class="bg-black text-white px-4 py-2 rounded-lg hover:bg-gray-800">تسجيل الدخول</button>
      </div>
    </div>
  </div>
</nav>

<main class="max-w-7xl mx-auto px-4 py-8">
  <button onclick="history.back()" class="mb-6 flex items-center gap-2 text-gray-600 hover:text-black">
    <i class="fa-solid fa-arrow-right"></i>
    <span>الرجوع للمنتجات</span>
  </button>

  <div id="product-content" class="grid md:grid-cols-2 gap-10">
    <p class="col-span-full text-center py-10">جاري التحميل...</p>
  </div>

  <section id="related-section" class="mt-16 pt-10 border-t hidden">
    <h2 class="text-2xl font-bold mb-6">منتجات مشابهة قد تعجبك</h2>
    <div id="related-products" class="grid sm:grid-cols-2 md:grid-cols-4 gap-6"></div>
  </section>
</main>

<div id="login-modal" class="modal">
  <div class="bg-white rounded-xl p-8 max-w-md w-full mx-4">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold">تسجيل الدخول</h2>
      <button onclick="closeModal('login-modal')" class="text-gray-500 text-2xl">&times;</button>
    </div>
    <div id="login-options">
      <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-2 border border-gray-300 py-3 rounded-lg mb-4 hover:bg-gray-50">
        <i class="fa-brands fa-google text-red-500"></i> الدخول بحساب قوقل
      </button>
      <div class="flex items-center gap-4 my-4"><hr class="flex-1"><span>أو</span><hr class="flex-1"></div>
      <button onclick="showEmailLogin()" class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800">الدخول بالإيميل</button>
      <p class="text-center mt-4">ليس لديك حساب؟ <button onclick="showRegister()" class="text-black font-semibold">إنشاء حساب جديد</button></p>
    </div>
    <div id="email-login" class="hidden">
      <input type="email" id="login-email" placeholder="الإيميل" class="w-full border border-gray-300 rounded-lg p-3 mb-3">
      <input type="password" id="login-password" placeholder="كلمة المرور" class="w-full border border-gray-300 rounded-lg p-3 mb-4">
      <button onclick="loginWithEmail()" class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800">دخول</button>
      <button onclick="backToOptions()" class="w-full mt-2 text-gray-600">رجوع</button>
    </div>
    <div id="register-form" class="hidden">
      <input type="text" id="reg-name" placeholder="الاسم الكامل" class="w-full border border-gray-300 rounded-lg p-3 mb-3">
      <input type="email" id="reg-email" placeholder="الإيميل" class="w-full border border-gray-300 rounded-lg p-3 mb-3">
      <input type="password" id="reg-password" placeholder="كلمة المرور (6 أحرف على الأقل)" class="w-full border border-gray-300 rounded-lg p-3 mb-3">
      <input type="tel" id="reg-phone" placeholder="رقم الهاتف" class="w-full border border-gray-300 rounded-lg p-3 mb-3">
      <textarea id="reg-address" placeholder="العنوان بالتفصيل" class="w-full border border-gray-300 rounded-lg p-3 mb-4" rows="2"></textarea>
      <button onclick="registerUser()" class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800">إنشاء حساب</button>
      <button onclick="backToOptions()" class="w-full mt-2 text-gray-600">رجوع</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
let selectedSize = null;
let selectedColor = null;

window.openModal = id => { document.getElementById(id).classList.add('active'); };
window.closeModal = id => { document.getElementById(id).classList.remove('active'); };
window.showEmailLogin = () => {
  document.getElementById('login-options').classList.add('hidden');
  document.getElementById('email-login').classList.remove('hidden');
};
window.showRegister = () => {
  document.getElementById('login-options').classList.add('hidden');
  document.getElementById('register-form').classList.remove('hidden');
};
window.backToOptions = () => {
  document.getElementById('login-options').classList.remove('hidden');
  document.getElementById('email-login').classList.add('hidden');
  document.getElementById('register-form').classList.add('hidden');
};

window.selectImage = src => {
  document.getElementById('main-img').src = src;
  document.querySelectorAll('.img-thumb').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
};

window.selectColor = (colorName, el) => {
  selectedColor = colorName;
  document.querySelectorAll('.color-option').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
};

window.selectSize = (sizeName, el) => {
  if (el.classList.contains('unavailable')) return;
  selectedSize = sizeName;
  document.querySelectorAll('.size-option').forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');
};

window.addToCart = (id, name, price, img) => {
  if (!selectedSize) {
    alert('الرجاء اختيار المقاس أولاً');
    return;
  }
  window.Store.addToCart(id, name, price, img, selectedSize, selectedColor || 'غير محدد');
};

function updateUI(user) {
  const area = document.getElementById('user-area');
  if (user) {
    area.innerHTML = `
      <div class="relative" id="account-menu-container">
        <button id="account-menu-btn" class="flex items-center gap-2 bg-gray-100 px-3 py-2 rounded-lg">
          <i class="fa-solid fa-user"></i>
          <span>${user.displayName || 'حسابي'}</span>
          <i class="fa-solid fa-chevron-down text-xs"></i>
        </button>
        <div id="account-menu" class="absolute left-0 bottom-full mb-2 w-48 bg-white shadow-lg rounded-lg p-2 hidden z-50">
          <a href="account.html" class="block px-4 py-2 hover:bg-gray-100 rounded">حسابي</a>
          <a href="orders.html" class="block px-4 py-2 hover:bg-gray-100 rounded">طلباتي</a>
          <a href="returns.html" class="block px-4 py-2 hover:bg-gray-100 rounded">الاسترجاعات</a>
          <hr class="my-2">
          <button onclick="logout()" class="block w-full text-right px-4 py-2 text-red-500 hover:bg-gray-100 rounded">تسجيل الخروج</button>
        </div>
      </div>
    `;
    setTimeout(() => {
      const btn = document.getElementById('account-menu-btn');
      const menu = document.getElementById('account-menu');
      if (!btn || !menu) return;
      btn.onclick = (e) => { e.stopPropagation(); menu.classList.toggle('hidden'); };
      document.onclick = () => menu.classList.add('hidden');
      menu.onclick = (e) => e.stopPropagation();
    }, 10);
  } else {
    area.innerHTML = `<button onclick="openModal('login-modal')" class="bg-black text-white px-4 py-2 rounded-lg hover:bg-gray-800">تسجيل الدخول</button>`;
  }
  window.Store.updateCartCount();
}

window.loginWithGoogle = async () => {
  try {
    await window.app.signInWithPopup(window.app.auth, window.app.googleProvider);
    closeModal('login-modal');
    window.Store.showToast('تم تسجيل الدخول بنجاح!');
  } catch (e) {
    window.Store.showToast(e.message, 'error');
  }
};

window.registerUser = async () => {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass = document.getElementById('reg-password').value;
  if (!name || !email || pass.length < 6) {
    return window.Store.showToast('املأ الحقول وكلمة المرور 6 أحرف على الأقل', 'error');
  }
  try {
    const cred = await window.app.createUserWithEmailAndPassword(window.app.auth, email, pass);
    await window.app.updateProfile(cred.user, { displayName: name });
    closeModal('login-modal');
    window.Store.showToast('تم إنشاء الحساب بنجاح! ✅');
  } catch (e) {
    window.Store.showToast(e.message, 'error');
  }
};

window.loginWithEmail = async () => {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  try {
    await window.app.signInWithEmailAndPassword(window.app.auth, email, pass);
    closeModal('login-modal');
    window.Store.showToast('تم تسجيل الدخول! ✅');
  } catch (e) {
    window.Store.showToast('إيميل أو كلمة مرور خاطئة', 'error');
  }
};

window.logout = async () => {
  await window.app.signOut(window.app.auth);
  window.Store.showToast('تم تسجيل الخروج');
};

document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const productId = params.get('id');
  const contentEl = document.getElementById('product-content');
  const relatedSection = document.getElementById('related-section');
  const relatedEl = document.getElementById('related-products');

  if (!productId) {
    contentEl.innerHTML = '<p class="col-span-full text-center text-red-500">لم يتم تحديد المنتج</p>';
    return;
  }

  window.app.onAuthStateChanged(window.app.auth, updateUI);
  loadProduct(productId);

  async function loadProduct(id) {
    try {
      const snap = await window.app.getDoc(window.app.doc(window.app.db, 'products', id));
      if (!snap.exists()) throw new Error('المنتج غير موجود');
      
      const p = snap.data();
      const images = p.images && Array.isArray(p.images) && p.images.length > 0 
        ? p.images 
        : [p.img || 'https://via.placeholder.com/600x700?text=صورة+غير+متوفرة'];
      const hasDiscount = p.priceOriginal && p.priceOriginal > p.price;
      const isAvailable = p.available !== false;

      contentEl.innerHTML = `
        <div>
          <img id="main-img" src="${images[0]}" class="w-full h-[450px] object-cover rounded-xl mb-4">
          <div class="grid grid-cols-5 gap-2">
            ${images.map((img, i) => `
              <img src="${img}" onclick="selectImage('${img}')" 
                  class="img-thumb w-full h-20 object-cover rounded-lg cursor-pointer ${i===0?'active':''}">
            `).join('')}
          </div>
        </div>
        <div>
          ${!isAvailable ? `<div class="bg-red-50 text-red-600 px-4 py-2 rounded-lg mb-4 font-semibold">غير متوفر حالياً ❌</div>` : ''}
          ${isAvailable ? `<div class="bg-green-50 text-green-600 px-4 py-2 rounded-lg mb-4 font-semibold">متوفر ✅</div>` : ''}
          
          <h1 class="text-3xl font-bold mb-3">${p.name || 'منتج'}</h1>
          
          <div class="flex items-center gap-3 mb-6">
            <span class="text-3xl font-semibold text-black">${p.price || 0} درهم</span>
            ${hasDiscount ? `
              <span class="text-xl text-gray-400 line-through">${p.priceOriginal} درهم</span>
              <span class="bg-red-500 text-white px-2 py-1 rounded text-sm font-bold">خصم ${Math.round(100 - (p.price / p.priceOriginal * 100))}%</span>
            ` : ''}
          </div>
          
          <p class="text-gray-600 mb-6">التصنيف: ${p.gender === 'women' ? 'نسائي' : p.gender === 'men' ? 'رجالي' : p.gender === 'girls' ? 'بنات' : 'أولاد'}</p>
          
          ${p.colors && p.colors.length > 0 ? `
            <div class="mb-6">
              <label class="block font-semibold mb-3">اللون:</label>
              <div class="flex flex-wrap gap-3">
                ${p.colors.map(c => `
                  <button class="color-option" style="background-color: ${window.Store.getColorBg(c)}; ${c === 'أبيض' ? 'border:1px solid #ddd;' : ''}" 
                      title="${c}" onclick="selectColor('${c}', this)"></button>
                `).join('')}
              </div>
            </div>
          ` : ''}
          
          ${p.sizes && p.sizes.length > 0 ? `
            <div class="mb-6">
              <label class="block font-semibold mb-3">المقاس:</label>
              <div class="flex flex-wrap gap-3">
                ${p.sizes.map(s => `
                  <button class="size-option" onclick="selectSize('${s}', this)">${s}</button>
                `).join('')}
              </div>
            </div>
          ` : ''}
          
          <button onclick="addToCart('${id}','${(p.name||'').replace(/'/g, "\\'")}',${p.price||0},'${images[0]}')" 
              class="w-full ${isAvailable ? 'bg-black hover:bg-gray-800' : 'bg-gray-400 cursor-not-allowed'} text-white py-3 rounded-lg text-lg"
              ${!isAvailable ? 'disabled' : ''}>
            ${isAvailable ? 'أضف للسلة' : 'غير متوفر'}
          </button>
        </div>
      `;

      loadRelated(p.gender, p.type, id);

    } catch (e) {
      contentEl.innerHTML = `<p class="col-span-full text-center text-red-500">خطأ: ${e.message}</p>`;
    }
  }

  async function loadRelated(gender, type, excludeId) {
    try {
      const q = window.app.query(
        window.app.collection(window.app.db, 'products'),
        window.app.where('gender', '==', gender),
        window.app.where('type', '==', type || ''),
        window.app.limit(4)
      );
      const snap = await window.app.getDocs(q);
      relatedEl.innerHTML = '';
      let count = 0;
      snap.forEach(d => {
        if (d.id === excludeId) return;
        const p = d.data();
        const img = p.images?.[0] || p.img || '';
        relatedEl.innerHTML += `
          <a href="product.html?id=${d.id}" class="block bg-white rounded-xl shadow-sm overflow-hidden group">
            <img src="${img}" class="w-full h-48 object-cover group-hover:scale-105 transition">
            <div class="p-3">
              <h3 class="font-bold">${p.name || 'منتج'}</h3>
              <p class="font-semibold">${p.price || 0} درهم</p>
              ${p.priceOriginal && p.priceOriginal > p.price ? `<span class="text-xs text-red-500">خصم!</span>` : ''}
            </div>
          </a>
        `;
        count++;
      });
      if (count > 0) relatedSection.classList.remove('hidden');
    } catch (e) {
      console.log('لا يوجد منتجات مشابهة');
    }
  }
});
</script>
</body>
</html>
