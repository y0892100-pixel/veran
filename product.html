    total_exceeds_stock: "⚠️ Total quantity in cart will exceed available stock ({stock})",

function setLanguage(lang) {
  if (!translations[lang]) return;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  localStorage.setItem('varen_lang', lang);
  
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (translations[lang][key]) el.textContent = translations[lang][key];
  });
  
  updateLangUI(lang);
}

function updateLangUI(lang) {
  document.querySelectorAll('.lang-option').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}

function getCurrentLanguage() {
  return localStorage.getItem('varen_lang') || 'ar';
}

function t(key, params = {}) {
  const lang = getCurrentLanguage();
  let text = translations[lang][key] || key;
  Object.keys(params).forEach(p => {
    text = text.replace(`{${p}}`, params[p]);
  });
  return text;
}

document.addEventListener('DOMContentLoaded', () => {
  setLanguage(getCurrentLanguage());
});

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCXYzZgFIFU2u6R02_ConvSonD9SJRWS9Q",
  authDomain: "varen-f7756.firebaseapp.com",
  projectId: "varen-f7756",
  storageBucket: "varen-f7756.firebasestorage.app",
  messagingSenderId: "648684291842",
  appId: "1:648684291842:web:f3e806fc76a6e119caa41b",
  measurementId: "G-SV7DKGPH2M"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const ADMIN_EMAIL = 'y0892100@gmail.com';

// 🎨 أسماء الألوان وأكوادها
const COLOR_MAP = {
  'أسود': '#000000', 'أبيض': '#ffffff', 'رمادي': '#9ca3af', 'بيج': '#d9c7b8',
  'أحمر': '#ef4444', 'أزرق': '#3b82f6', 'أخضر': '#22c55e', 'وردي': '#f472b6',
  'بني': '#a16207', 'برتقالي': '#f97316', 'ذهبي': '#f59e0b', 'فضي': '#d1d5db',
  'بنفسجي': '#8b5cf6', 'أصفر': '#facc15'
};

let product = null;
let selectedColor = null;
let selectedSize = null;
let selectedVariant = null;
let quantity = 1;
let currentImageIndex = 0;
let productImages = [];

function updateCartCount() {
  const cart = JSON.parse(localStorage.getItem('varen_cart_v1') || '[]');
  const countEl = document.getElementById('cart-count');
  if (countEl) {
    const total = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
    countEl.textContent = total;
  }
}

function showToast(msg, type='success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast ${type} show`;
  setTimeout(() => toast.classList.remove('show'), 4000);
}

function getProductId() {
  return new URLSearchParams(window.location.search).get('id');
}

async function loadProduct() {
  const id = getProductId();
  if (!id) return showNotFound();
  try {
    const doc = await db.collection('products').doc(id).get();
    if (!doc.exists) return showNotFound();
    product = { id: doc.id, ...doc.data() };
    productImages = product.images?.length ? [...product.images] : ['https://via.placeholder.com/600x600?text=No+Image'];
    renderProduct();
    loadRelated();
  } catch (err) {
    console.error(err);
    showToast(t('loading_error'), 'error');
  }
}

function showNotFound() {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('not-found').classList.remove('hidden');
}

function renderProduct() {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('product-content').classList.remove('hidden');
  
  // الاسم والمعلومات
  document.getElementById('prod-name').textContent = product.name || 'منتج بدون اسم';
  const lang = getCurrentLanguage();
  const parts = [
    product.gender === 'women' ? (lang === 'ar' ? 'نسائي' : 'Women') : 
    product.gender === 'men' ? (lang === 'ar' ? 'رجالي' : 'Men') : 
    product.gender === 'girls' ? (lang === 'ar' ? 'بنات' : 'Girls') : 
    product.gender === 'boys' ? (lang === 'ar' ? 'أولاد' : 'Boys') : null,
    product.type || '',
    product.season === 'winter' ? (lang === 'ar' ? 'شتوي' : 'Winter') : 
    product.season === 'summer' ? (lang === 'ar' ? 'صيفي' : 'Summer') : product.season || ''
  ].filter(Boolean);
  document.getElementById('prod-meta').textContent = parts.join(' • ');
  
  // السعر
  const price = Number(product.price) || 0;
  const origPrice = product.priceOriginal ? Number(product.priceOriginal) : null;
  document.getElementById('prod-price').textContent = `${price.toFixed(2)} ${lang === 'ar' ? 'درهم' : 'AED'}`;
  if (origPrice && origPrice > price) {
    document.getElementById('prod-original-price').textContent = `${origPrice.toFixed(2)} ${lang === 'ar' ? 'درهم' : 'AED'}`;
    document.getElementById('prod-original-price').classList.remove('hidden');
  }
  
  // الصور
  document.getElementById('main-img-el').src = productImages[0];
  const thumbs = document.getElementById('thumbnails');
  thumbs.innerHTML = '';
  productImages.forEach((img, i) => {
    thumbs.innerHTML += `<button onclick="changeMainImg(${i})" class="aspect-square overflow-hidden rounded-lg border-2 ${i===0?'border-black':'border-transparent'} hover:border-gray-400"><img src="${img}" alt="" class="w-full h-full object-cover"></button>`;
  });
  
  // 🎨 تحميل الألوان الفريدة من الـ variants
  const variants = product.variants || [];
  const uniqueColors = [...new Set(variants.map(v => v.color))];
  const colorsCont = document.getElementById('colors-container');
  colorsCont.innerHTML = '';
  
  if (variants.length === 0) {
    colorsCont.innerHTML = `<span class="text-gray-400 text-sm">${t('no_options')}</span>`;
    document.getElementById('sizes-container').innerHTML = `<span class="text-gray-400 text-sm">${t('choose_color_first')}</span>`;
    return;
  }
  
  uniqueColors.forEach(c => {
    const bgColor = COLOR_MAP[c] || c;
    const isLight = (bgColor.startsWith('#') && parseInt(bgColor.slice(1), 16) > 0x888888);
    colorsCont.innerHTML += `<button class="color-btn w-10 h-10 rounded-full ${isLight?'border border-gray-400':''} hover:scale-110 transition-transform" style="background:${bgColor}" title="${c}" onclick="selectColor('${c}', this)"></button>`;
  });
  
  // إعادة تعيين الحالة
  selectedColor = null;
  selectedSize = null;
  selectedVariant = null;
  quantity = 1;
  document.getElementById('qty-val').textContent = '1';
  document.getElementById('stock-display').innerHTML = `<span data-i18n="choose_color_size">${t('choose_color_size')}</span>`;
  document.getElementById('unavailable-msg').classList.add('hidden');
  document.getElementById('sizes-container').innerHTML = `<span class="text-gray-400 text-sm" data-i18n="choose_color_first">${t('choose_color_first')}</span>`;
}

function changeMainImg(index) {
  currentImageIndex = index;
  document.getElementById('main-img-el').src = productImages[index];
  document.querySelectorAll('#thumbnails button').forEach((btn, i) => {
    btn.classList.toggle('border-black', i === index);
    btn.classList.toggle('border-transparent', i !== index);
  });
}

function openLightbox(index) {
  currentImageIndex = index;
  document.getElementById('lightbox-img').src = productImages[index];
  document.getElementById('lightbox').classList.add('active');
}

function closeLightbox(event) {
  if (!event || event.target === event.currentTarget) {
    document.getElementById('lightbox').classList.remove('active');
  }
}

function prevImage(event) {
  event.stopPropagation();
  currentImageIndex = (currentImageIndex - 1 + productImages.length) % productImages.length;
  document.getElementById('lightbox-img').src = productImages[currentImageIndex];
}

function nextImage(event) {
  event.stopPropagation();
  currentImageIndex = (currentImageIndex + 1) % productImages.length;
  document.getElementById('lightbox-img').src = productImages[currentImageIndex];
}

// 🎨 اختيار اللون → تحميل المقاسات المتاحة لهذا اللون فقط
function selectColor(color, btn) {
  selectedColor = color;
  selectedSize = null;
  selectedVariant = null;
  quantity = 1;
  document.getElementById('qty-val').textContent = '1';
  
  // تحديث تحديد اللون
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  
  // جلب المقاسات المتاحة لهذا اللون فقط
  const variants = product.variants || [];
  const sizesForColor = variants.filter(v => v.color === color);
  const sizesCont = document.getElementById('sizes-container');
  sizesCont.innerHTML = '';
  
  if (sizesForColor.length === 0) {
    sizesCont.innerHTML = `<span class="text-gray-400 text-sm">${t('no_sizes_for_color')}</span>`;
    document.getElementById('stock-display').innerHTML = '';
    return;
  }
  
  // عرض المقاسات مع حالة المخزون
  sizesForColor.forEach(v => {
    const isOutOfStock = v.stock <= 0;
    sizesCont.innerHTML += `
      <button class="size-btn border px-4 py-2 rounded-lg hover:bg-gray-100 ${isOutOfStock?'opacity-40 cursor-not-allowed':''}" 
              ${isOutOfStock?'disabled':''} 
              onclick="${isOutOfStock?'':'selectSize(\'' + v.size + '\', this)'}">
        ${v.size}
        ${isOutOfStock?`<span class="block text-xs text-red-500" data-i18n="sold_out">${t('sold_out')}</span>`:''}
      </button>
    `;
  });
  
  document.getElementById('stock-display').innerHTML = t('choose_color_and_size');
  document.getElementById('unavailable-msg').classList.add('hidden');
}

// 📏 اختيار المقاس → عرض المخزون الدقيق لهذا اللون+المقاس
function selectSize(size, btn) {
  selectedSize = size;
  
  // تحديث تحديد المقاس
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  
  // جلب الـ variant المحدد
  const variants = product.variants || [];
  selectedVariant = variants.find(v => v.color === selectedColor && v.size === size);
  
  if (!selectedVariant || selectedVariant.stock <= 0) {
    document.getElementById('stock-display').innerHTML = `<span class="text-red-500" data-i18n="out_of_stock">${t('out_of_stock')}</span>`;
    document.getElementById('unavailable-msg').classList.remove('hidden');
    selectedVariant = null;
    return;
  }
  
  // عرض المخزون
  const stock = selectedVariant.stock;
  const stockEl = document.getElementById('stock-display');
  document.getElementById('unavailable-msg').classList.add('hidden');
  
  if (stock <= 3) {
    stockEl.innerHTML = `<span class="text-orange-500">⚠️ ${t('low_stock', {stock, color: selectedColor, size: selectedSize})}</span>`;
  } else {
    stockEl.innerHTML = `<span class="text-green-600">✅ ${t('available_stock', {stock, color: selectedColor, size: selectedSize})}</span>`;
  }
}

// ⚠️ التحكم في الكمية بناءً على مخزون الـ variant المحدد
function changeQty(delta) {
  if (!selectedVariant) {
    showToast(t('choose_color_and_size'), 'error');
    return;
  }
  const maxStock = selectedVariant.stock || 0;
  const newQty = quantity + delta;
  
  if (newQty < 1) return;
  if (newQty > maxStock) {
    showToast(`⚠️ ${t('quantity_exceeds_stock', {qty: newQty, stock: maxStock})}`, 'error');
    return;
  }
  
  quantity = newQty;
  document.getElementById('qty-val').textContent = quantity;
}

function addToCart() {
  const variants = product.variants || [];
  
  if (!selectedColor) return showToast(t('color_required'), 'error');
  if (!selectedSize) return showToast(t('size_required'), 'error');
  if (!selectedVariant || selectedVariant.stock <= 0) {
    return showToast(t('option_unavailable'), 'error');
  }
  if (quantity > selectedVariant.stock) {
    return showToast(`⚠️ ${t('quantity_exceeds_stock', {qty: quantity, stock: selectedVariant.stock})}`, 'error');
  }
  
  const cart = JSON.parse(localStorage.getItem('varen_cart_v1') || '[]');
  const existingIdx = cart.findIndex(item => 
    item.id === product.id && item.size === selectedSize && item.color === selectedColor
  );
  
  const itemData = {
    id: product.id,
    name: product.name,
    price: Number(product.price),
    image: productImages[0],
    size: selectedSize,
    color: selectedColor,
    qty: quantity,
    variantStock: selectedVariant.stock
  };
  
  if (existingIdx !== -1) {
    const newTotalQty = cart[existingIdx].qty + quantity;
    if (newTotalQty > selectedVariant.stock) {
      return showToast(`⚠️ ${t('total_exceeds_stock', {stock: selectedVariant.stock})}`, 'error');
    }
    cart[existingIdx].qty = newTotalQty;
  } else {
    cart.push(itemData);
  }
  
  localStorage.setItem('varen_cart_v1', JSON.stringify(cart));
  showToast(t('added_to_cart'));
  quantity = 1;
  document.getElementById('qty-val').textContent = '1';
  updateCartCount();
}

// تحميل منتجات مشابهة
async function loadRelated() {
  const grid = document.getElementById('related-grid');
  const lang = getCurrentLanguage();
  try {
    const snapshot = await db.collection('products').limit(8).get();
    let products = [];
    snapshot.forEach(doc => {
      const p = { id: doc.id, ...doc.data() };
      const totalStock = (p.variants || []).reduce((sum, v) => sum + (v.stock || 0), 0);
      if (p.available !== false && totalStock > 0 && p.id !== product.id) {
        products.push(p);
      }
    });
    products = products.slice(0, 4);
    
    if (products.length === 0) {
      grid.innerHTML = `<p class="col-span-full text-center text-gray-500">${t('no_similar_products')}</p>`;
      return;
    }
    
    grid.innerHTML = '';
    products.forEach(p => {
      const img = p.images?.[0] || 'https://via.placeholder.com/300x400';
      grid.innerHTML += `
        <a href="product.html?id=${p.id}" class="related-card block bg-white rounded-xl shadow-sm overflow-hidden border">
          <img src="${img}" alt="${p.name}" class="w-full h-36 object-cover">
          <div class="p-3">
            <h3 class="font-bold text-sm mb-1">${p.name}</h3>
            <span class="font-semibold">${p.price} ${lang === 'ar' ? 'درهم' : 'AED'}</span>
          </div>
        </a>
      `;
    });
  } catch (err) {
    console.error(err);
  }
}

function updateUserUI(user) {
  const loginBtn = document.getElementById('login-btn');
  const accountBtn = document.getElementById('account-btn');
  const accountMenu = document.getElementById('account-menu');
  const adminLink = document.getElementById('admin-nav-link');
  
  if (user) {
    if (loginBtn) loginBtn.classList.add('hidden');
    if (accountBtn) { accountBtn.classList.remove('hidden'); accountBtn.classList.add('flex'); }
  } else {
    if (loginBtn) loginBtn.classList.remove('hidden');
    if (accountBtn) accountBtn.classList.add('hidden');
    if (accountMenu) accountMenu.classList.add('hidden');
  }
  updateCartCount();
}

window.logout = async function () {
  await auth.signOut();
  showToast(getCurrentLanguage() === 'ar' ? '✅ تم تسجيل الخروج' : '✅ Logged out successfully');
  setTimeout(() => window.location.href = 'index.html', 1000);
};

const accountBtn = document.getElementById('account-btn');
const accountMenu = document.getElementById('account-menu');
if (accountBtn && accountMenu) {
  accountBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    accountMenu.classList.toggle('hidden');
  });
  document.addEventListener('click', () => accountMenu.classList.add('hidden'));
  accountMenu.addEventListener('click', (e) => e.stopPropagation());
}

document.addEventListener('DOMContentLoaded', () => {
  auth.onAuthStateChanged(updateUserUI);
  updateCartCount();
  setTimeout(() => loadProduct(), 100);
});
</script>
