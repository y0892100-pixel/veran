<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المنتج - VAREN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/jpeg" href="https://i.imgur.com/QXFR5XO.jpeg">
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    html[lang="en"] { direction: ltr; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; display: none; }
    .toast.show { display: block; }
    .toast.success { background: #16a34a; }
    .toast.error { background: #dc2626; }
    .color-option.selected { border: 3px solid black; }
    .size-option.selected { background: black; color: white; }
    .main-image { cursor: zoom-in; }
    .thumbnail { cursor: pointer; border: 2px solid transparent; }
    .thumbnail.active { border-color: black; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

<script>
const translations = {
  ar: {
    page_title: "تفاصيل المنتج - VAREN",
    back: "الرجوع",
    price: "السعر",
    original_price: "السعر الأصلي",
    color: "اللون",
    size: "المقاس",
    stock: "المتوفر",
    qty: "الكمية",
    add_to_cart: "أضف إلى السلة",
    added: "✅ تمت الإضافة إلى السلة",
    no_color_size: "الرجاء اختيار اللون والمقاس أولاً",
    out_of_stock: "⚠️ غير متوفر حالياً",
    max_qty: "⚠️ الكمية تتجاوز المخزون المتاح",
    not_found: "المنتج غير موجود"
  },
  en: {
    page_title: "Product Details - VAREN",
    back: "Back",
    price: "Price",
    original_price: "Original Price",
    color: "Color",
    size: "Size",
    stock: "In Stock",
    qty: "Quantity",
    add_to_cart: "Add to Cart",
    added: "✅ Added to Cart",
    no_color_size: "Please select color and size first",
    out_of_stock: "⚠️ Out of stock",
    max_qty: "⚠️ Exceeds available stock",
    not_found: "Product not found"
  }
};

function setLanguage(lang) {
  if (!translations[lang]) return;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  localStorage.setItem('varen_lang', lang);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (translations[lang][key]) el.textContent = translations[lang][key];
  });
}

function getCurrentLanguage() {
  return localStorage.getItem('varen_lang') || 'ar';
}

function t(key) {
  return translations[getCurrentLanguage()][key] || key;
}

document.addEventListener('DOMContentLoaded', () => {
  setLanguage(getCurrentLanguage());
});

const firebaseConfig = {
  apiKey: "AIzaSyCXYzZgFIFU2u6R02_ConvSonD9SJRWS9Q",
  authDomain: "varen-f7756.firebaseapp.com",
  projectId: "varen-f7756",
  storageBucket: "varen-f7756.firebasestorage.app",
  messagingSenderId: "648684291842",
  appId: "1:648684291842:web:f3e806fc76a6e119caa41b",
  measurementId: "G-SV7DKGPH2M"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
</script>

<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <a href="index.html" class="flex items-center gap-3">
      <img src="https://i.imgur.com/QXFR5XO.jpeg" alt="VAREN Logo" class="w-10 h-10 object-contain rounded">
      <span class="text-3xl md:text-4xl font-black text-gray-900 tracking-tight">VAREN</span>
    </a>
    <a href="javascript:history.back()" class="text-sm text-gray-600 hover:text-black">
      <i class="fa-solid fa-arrow-right ml-1"></i> <span data-i18n="back">الرجوع</span>
    </a>
  </div>
</nav>

<main class="max-w-7xl mx-auto px-4 py-8">
  <div id="loading" class="text-center py-16">
    <i class="fa-solid fa-spinner fa-spin fa-2xl"></i>
  </div>

  <div id="product-content" class="hidden grid md:grid-cols-2 gap-8">
    <!-- الصور -->
    <div>
      <div class="bg-white rounded-xl shadow-sm border overflow-hidden mb-4">
        <img id="main-image" src="" alt="" class="main-image w-full h-96 object-contain bg-gray-50">
      </div>
      <div id="thumbnails" class="flex gap-2 overflow-x-auto pb-2">
        <!-- الصور المصغرة -->
      </div>
    </div>

    <!-- التفاصيل -->
    <div class="bg-white rounded-xl shadow-sm border p-6 space-y-4">
      <h1 id="prod-name" class="text-3xl font-bold"></h1>
      
      <div class="flex items-baseline gap-3">
        <span class="text-2xl font-bold text-black" data-i18n="price">السعر</span>
        <span id="prod-price" class="text-2xl font-bold"></span>
        <span id="prod-price-orig" class="text-lg text-gray-400 line-through hidden"></span>
      </div>

      <!-- الألوان -->
      <div id="colors-section">
        <h3 class="font-semibold mb-2" data-i18n="color">اللون</h3>
        <div id="colors-list" class="flex flex-wrap gap-2">
          <!-- خيارات الألوان -->
        </div>
      </div>

      <!-- المقاسات -->
      <div id="sizes-section">
        <h3 class="font-semibold mb-2" data-i18n="size">المقاس</h3>
        <div id="sizes-list" class="flex flex-wrap gap-2">
          <!-- خيارات المقاسات -->
        </div>
      </div>

      <!-- المخزون -->
      <div>
        <span class="font-semibold" data-i18n="stock">المتوفر</span>: 
        <span id="stock-count" class="text-green-600 font-bold">-</span>
      </div>

      <!-- الكمية -->
      <div class="flex items-center gap-4">
        <span class="font-semibold" data-i18n="qty">الكمية</span>
        <div class="flex items-center border rounded-lg overflow-hidden">
          <button id="qty-minus" class="px-4 py-2 hover:bg-gray-100">-</button>
          <input id="qty-input" type="number" value="1" min="1" class="w-12 text-center border-0 focus:outline-none">
          <button id="qty-plus" class="px-4 py-2 hover:bg-gray-100">+</button>
        </div>
      </div>

      <!-- زر الإضافة -->
      <button id="add-cart-btn" class="w-full bg-black text-white py-3 rounded-lg font-semibold text-lg hover:bg-gray-800 mt-4">
        <i class="fa-solid fa-cart-plus ml-2"></i> <span data-i18n="add_to_cart">أضف إلى السلة</span>
      </button>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script>
let productData = null;
let selectedColor = null;
let selectedSize = null;
let maxStock = 0;

function showToast(msg, type='success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast ${type} show`;
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function getCart() {
  return JSON.parse(localStorage.getItem('varen_cart_v1') || '[]');
}

function saveCart(cart) {
  localStorage.setItem('varen_cart_v1', JSON.stringify(cart));
}

function formatPrice(amount) {
  const lang = getCurrentLanguage();
  return `${amount.toFixed(2)} ${lang === 'ar' ? 'درهم' : 'AED'}`;
}

// عرض الصور
function setupImages(images) {
  const mainImg = document.getElementById('main-image');
  const thumbs = document.getElementById('thumbnails');
  thumbs.innerHTML = '';

  if (!images || images.length === 0) {
    mainImg.src = 'https://via.placeholder.com/400';
    return;
  }

  mainImg.src = images[0];
  thumbs.innerHTML = images.map((img, i) => `
    <img src="${img}" alt="" class="thumbnail w-20 h-20 object-cover rounded ${i===0?'active':''}" 
         onclick="changeMainImage('${img}', this)">
  `).join('');
}

window.changeMainImage = function(src, el) {
  document.getElementById('main-image').src = src;
  document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
};

// تحديث المخزون عند اختيار اللون والمقاس
function updateStock() {
  if (!selectedColor || !selectedSize || !productData.variants) {
    document.getElementById('stock-count').textContent = '-';
    maxStock = 0;
    return;
  }

  const variant = productData.variants.find(v => 
    (v.color || '').trim() === selectedColor.trim() && 
    (v.size || '').trim() === selectedSize.trim()
  );

  maxStock = variant ? (variant.stock || 0) : 0;
  document.getElementById('stock-count').textContent = maxStock;
  
  const qtyInput = document.getElementById('qty-input');
  if (parseInt(qtyInput.value) > maxStock) {
    qtyInput.value = Math.max(1, maxStock);
  }
  qtyInput.max = maxStock;
}

// تحميل بيانات المنتج
async function loadProduct() {
  const params = new URLSearchParams(window.location.search);
  const productId = params.get('id');
  
  if (!productId) {
    document.getElementById('loading').innerHTML = `<p class="text-red-500">${t('not_found')}</p>`;
    return;
  }

  try {
    const doc = await db.collection('products').doc(productId).get();
    if (!doc.exists) {
      document.getElementById('loading').innerHTML = `<p class="text-red-500">${t('not_found')}</p>`;
      return;
    }

    productData = { id: doc.id, ...doc.data() };
    
    // عرض البيانات
    document.getElementById('prod-name').textContent = productData.name || 'منتج';
    document.getElementById('prod-price').textContent = formatPrice(productData.price);
    
    if (productData.priceOriginal && productData.priceOriginal > productData.price) {
      document.getElementById('prod-price-orig').textContent = formatPrice(productData.priceOriginal);
      document.getElementById('prod-price-orig').classList.remove('hidden');
    }

    // عرض الصور
    setupImages(productData.images);

    // استخراج الألوان والمقاسات الفريدة
    const variants = productData.variants || [];
    const colors = [...new Set(variants.map(v => v.color).filter(Boolean))];
    const sizes = [...new Set(variants.map(v => v.size).filter(Boolean))];

    // عرض الألوان
    const colorsList = document.getElementById('colors-list');
    if (colors.length > 0) {
      colorsList.innerHTML = colors.map(c => `
        <button class="color-option px-4 py-2 border rounded-lg hover:bg-gray-100" 
                data-color="${c}" onclick="selectColor('${c}', this)">${c}</button>
      `).join('');
    } else {
      document.getElementById('colors-section').style.display = 'none';
    }

    // عرض المقاسات
    const sizesList = document.getElementById('sizes-list');
    if (sizes.length > 0) {
      sizesList.innerHTML = sizes.map(s => `
        <button class="size-option px-4 py-2 border rounded-lg hover:bg-gray-100" 
                data-size="${s}" onclick="selectSize('${s}', this)">${s}</button>
      `).join('');
    } else {
      document.getElementById('sizes-section').style.display = 'none';
    }

    // إظهار المحتوى
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('product-content').classList.remove('hidden');

  } catch (err) {
    document.getElementById('loading').innerHTML = `<p class="text-red-500">خطأ: ${err.message}</p>`;
  }
}

window.selectColor = function(color, el) {
  selectedColor = color;
  document.querySelectorAll('.color-option').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  updateStock();
};

window.selectSize = function(size, el) {
  selectedSize = size;
  document.querySelectorAll('.size-option').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  updateStock();
};

// التحكم في الكمية
document.getElementById('qty-minus').addEventListener('click', () => {
  const input = document.getElementById('qty-input');
  const val = parseInt(input.value);
  if (val > 1) input.value = val - 1;
});

document.getElementById('qty-plus').addEventListener('click', () => {
  const input = document.getElementById('qty-input');
  const val = parseInt(input.value);
  if (!maxStock || val < maxStock) input.value = val + 1;
});

// إضافة إلى السلة
document.getElementById('add-cart-btn').addEventListener('click', () => {
  const qty = parseInt(document.getElementById('qty-input').value) || 1;

  // التحقق من الاختيار
  const hasColors = document.getElementById('colors-section').style.display !== 'none';
  const hasSizes = document.getElementById('sizes-section').style.display !== 'none';

  if ((hasColors && !selectedColor) || (hasSizes && !selectedSize)) {
    showToast(t('no_color_size'), 'error');
    return;
  }

  if (maxStock === 0) {
    showToast(t('out_of_stock'), 'error');
    return;
  }

  if (qty > maxStock) {
    showToast(t('max_qty'), 'error');
    return;
  }

  // إضافة العنصر للسلة
  const cart = getCart();
  cart.push({
    productId: productData.id,
    name: productData.name,
    price: productData.price,
    image: productData.images?.[0] || '',
    color: selectedColor || '-',
    size: selectedSize || '-',
    qty: qty,
    variantStock: maxStock
  });

  saveCart(cart);
  showToast(t('added'));
});

// تحميل المنتج عند فتح الصفحة
document.addEventListener('DOMContentLoaded', loadProduct);
</script>

</body>
</html>
