<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج - VAREN</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, query, where, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import firebaseConfig from './firebase-config.js';

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.app = { db, doc, getDoc, collection, query, where, limit, getDocs };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
        * { font-family: 'Cairo', sans-serif; }
        .img-thumb { transition: all 0.2s; }
        .img-thumb:hover, .img-thumb.active { border-color: black; opacity: 1; }
    </style>
</head>
<body class="bg-gray-50">

<nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <a href="index.html" class="text-2xl font-bold">VAREN</a>
        
        <div class="hidden md:flex gap-6">
            <a href="index.html" class="hover:text-gray-600">الرئيسية</a>
            <a href="category.html?gender=women" class="hover:text-gray-600">نسائي</a>
            <a href="category.html?gender=men" class="hover:text-gray-600">رجالي</a>
            <a href="category.html?gender=girls" class="hover:text-gray-600">بنات</a>
            <a href="category.html?gender=boys" class="hover:text-gray-600">أولاد</a>
        </div>

        <div class="flex items-center gap-4">
            <a href="cart.html" class="text-xl relative">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
            </a>
            <div class="relative group">
                <button class="flex items-center gap-2 bg-gray-100 px-3 py-2 rounded-lg">
                    <i class="fa-solid fa-user"></i>
                    <span>حسابي</span>
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </button>
                <div class="absolute left-0 mt-2 w-48 bg-white shadow-lg rounded-lg p-2 hidden group-hover:block z-50">
                    <a href="account.html" class="block px-4 py-2 hover:bg-gray-100">معلومات الحساب</a>
                    <a href="orders.html" class="block px-4 py-2 hover:bg-gray-100">طلباتي</a>
                    <a href="returns.html" class="block px-4 py-2 hover:bg-gray-100">الاسترجاعات</a>
                    <hr class="my-1">
                    <a href="admin.html" class="block px-4 py-2 hover:bg-gray-100">لوحة التحكم</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<main class="max-w-7xl mx-auto px-4 py-8">
    <!-- زر الرجوع -->
    <button onclick="history.back()" class="mb-6 flex items-center gap-2 text-gray-600 hover:text-black">
        <i class="fa-solid fa-arrow-right"></i>
        <span>الرجوع للمنتجات</span>
    </button>

    <div id="product-content" class="grid md:grid-cols-2 gap-10">
        <p class="col-span-full text-center py-10">جاري التحميل...</p>
    </div>

    <!-- منتجات مشابهة -->
    <section id="related-section" class="mt-16 pt-10 border-t hidden">
        <h2 class="text-2xl font-bold mb-6">منتجات مشابهة قد تعجبك</h2>
        <div id="related-products" class="grid sm:grid-cols-2 md:grid-cols-4 gap-6"></div>
    </section>
</main>

<script>
const CART_KEY = 'fl_cart_v4';
function getCart() { return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); }
function saveCart(cart) { localStorage.setItem(CART_KEY, JSON.stringify(cart)); updateCartCount(); }
function updateCartCount() { document.getElementById('cart-count').textContent = getCart().length; }

window.addToCart = (id, name, price, img) => {
    const cart = getCart();
    const existing = cart.find(i => i.id === id);
    if (existing) existing.quantity = (existing.quantity || 1) + 1;
    else cart.push({ id, name, price, img, quantity: 1 });
    saveCart(cart);
    alert('أضيف للسلة ✅');
};

window.selectImage = (src) => {
    document.getElementById('main-img').src = src;
    document.querySelectorAll('.img-thumb').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
};
</script>

<script type="module">
    const { db, doc, getDoc, collection, query, where, limit, getDocs } = window.app;
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');
    const contentEl = document.getElementById('product-content');
    const relatedSection = document.getElementById('related-section');
    const relatedEl = document.getElementById('related-products');

    if (!productId) {
        contentEl.innerHTML = '<p class="col-span-full text-center text-red-500">لم يتم تحديد المنتج</p>';
    }

    async function loadProduct() {
        try {
            const snap = await getDoc(doc(db, 'products', productId));
            if (!snap.exists()) throw new Error('المنتج غير موجود');
            
            const p = snap.data();
            const images = p.images && Array.isArray(p.images) && p.images.length > 0 
                ? p.images 
                : [p.img || 'https://via.placeholder.com/600x700?text=صورة+غير+متوفرة'];

            contentEl.innerHTML = `
                <div>
                    <img id="main-img" src="${images[0]}" class="w-full h-[450px] object-cover rounded-xl mb-4">
                    <div class="grid grid-cols-5 gap-2">
                        ${images.map((img, i) => `
                            <img src="${img}" onclick="selectImage('${img}')" 
                                class="img-thumb w-full h-20 object-cover rounded-lg border-2 border-transparent cursor-pointer ${i===0?'active':''}">
                        `).join('')}
                    </div>
                </div>
                <div>
                    <h1 class="text-3xl font-bold mb-3">${p.name || 'منتج'}</h1>
                    <p class="text-3xl font-semibold text-black mb-6">${p.price || 0} درهم</p>
                    <p class="text-gray-600 mb-6">تصنيف: ${p.gender === 'women' ? 'نسائي' : p.gender === 'men' ? 'رجالي' : p.gender === 'girls' ? 'بنات' : 'أولاد'}</p>
                    
                    <div class="mb-6">
                        <label class="block font-semibold mb-2">المقاس</label>
                        <select class="w-full border rounded-lg p-3">
                            <option>XS</option><option>S</option><option>M</option>
                            <option>L</option><option>XL</option><option>XXL</option>
                        </select>
                    </div>
                    
                    <button onclick="addToCart('${productId}','${p.name||''}',${p.price||0},'${images[0]}')" 
                        class="w-full bg-black text-white py-3 rounded-lg text-lg hover:bg-gray-800">
                        أضف للسلة
                    </button>
                </div>
            `;

            // تحميل منتجات مشابهة
            loadRelated(p.gender, p.type, productId);

        } catch (e) {
            contentEl.innerHTML = `<p class="col-span-full text-center text-red-500">خطأ: ${e.message}</p>`;
        }
    }

    async function loadRelated(gender, type, excludeId) {
        try {
            const q = query(
                collection(db, 'products'),
                where('gender', '==', gender),
                where('type', '==', type || ''),
                limit(4)
            );
            const snap = await getDocs(q);
            relatedEl.innerHTML = '';
            let count = 0;
            snap.forEach(d => {
                if (d.id === excludeId) return;
                const p = d.data();
                const img = p.images?.[0] || p.img || '';
                relatedEl.innerHTML += `
                    <a href="product.html?id=${d.id}" class="block bg-white rounded-xl shadow-sm overflow-hidden group">
                        <img src="${img}" class="w-full h-48 object-cover group-hover:scale-105 transition">
                        <div class="p-3">
                            <h3 class="font-bold">${p.name || 'منتج'}</h3>
                            <p class="font-semibold">${p.price || 0} درهم</p>
                        </div>
                    </a>
                `;
                count++;
            });
            if (count > 0) relatedSection.classList.remove('hidden');
        } catch (e) {
            console.log('لا يوجد منتجات مشابهة');
        }
    }

    loadProduct();
    updateCartCount();
</script>
</body>
</html>
