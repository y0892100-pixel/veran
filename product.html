<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المنتج - VAREN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; display: none; }
    .toast.show { display: block; }
    .color-option { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .color-option.selected { border-color: #000; }
    .size-option { padding: 8px 16px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; }
    .size-option.selected { border-color: #000; background: #000; color: white; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import firebaseConfig from './firebase-config.js';
    import * as Store from './store.js';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    window.app = { auth, db, onAuthStateChanged, signOut, doc, getDoc };
    window.Store = Store;
  </script>
</head>
<body class="bg-gray-50 text-gray-800">

<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <a href="index.html" class="text-2xl font-bold text-gray-900">VAREN</a>
    <div class="hidden md:flex gap-8">
      <a href="index.html" class="font-medium hover:text-gray-600">الرئيسية</a>
      <a href="category.html?gender=women" class="font-medium hover:text-gray-600">نسائي</a>
      <a href="category.html?gender=men" class="font-medium hover:text-gray-600">رجالي</a>
    </div>
    <div class="flex items-center gap-4">
      <a href="cart.html" class="text-xl relative">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
      </a>
      <div id="user-area"></div>
    </div>
  </div>
</nav>

<main class="max-w-7xl mx-auto px-4 py-8">
  <div id="loading" class="text-center py-16 text-gray-500">
    <i class="fa-solid fa-spinner fa-spin fa-2xl mb-4"></i>
    <p>جاري تحميل تفاصيل المنتج...</p>
  </div>
  <div id="product-content" class="hidden">
    <div class="grid md:grid-cols-2 gap-8">
      <div>
        <img id="main-img" src="" alt="" class="w-full h-96 object-cover rounded-xl mb-4">
        <div id="thumbnails" class="flex gap-2 overflow-x-auto"></div>
      </div>
      <div>
        <h1 id="p-name" class="text-3xl font-bold mb-2"></h1>
        <p id="p-type" class="text-gray-600 mb-4"></p>
        <div class="flex items-center gap-3 mb-6">
          <span id="p-price" class="text-2xl font-bold"></span>
          <span id="p-price-original" class="text-lg text-gray-400 line-through"></span>
        </div>
        <p id="p-available" class="mb-6 font-medium"></p>

        <div class="mb-6">
          <h3 class="font-semibold mb-3">اللون:</h3>
          <div id="colors-list" class="flex gap-3 flex-wrap"></div>
        </div>

        <div class="mb-6">
          <h3 class="font-semibold mb-3">المقاس:</h3>
          <div id="sizes-list" class="flex gap-3 flex-wrap"></div>
        </div>

        <button id="add-to-cart-btn" class="w-full bg-black text-white py-3 rounded-lg text-lg hover:bg-gray-800">
          أضف للسلة
        </button>
      </div>
    </div>
  </div>
</main>

<footer class="bg-gray-900 text-white py-8 text-center">
  <p>&copy; 2026 VAREN. جميع الحقوق محفوظة.</p>
</footer>

<div id="toast" class="toast"></div>

<script>
let productData = null;
let selectedColor = null;
let selectedSize = null;

function updateUserUI(user) {
  const area = document.getElementById('user-area');
  if (user) {
    area.innerHTML = `<div class="flex items-center gap-2"><span class="text-sm">أهلاً بك</span><button onclick="logout()" class="text-sm text-red-500">خروج</button></div>`;
  } else {
    area.innerHTML = `<button onclick="location.href='admin.html'" class="bg-black text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-800">تسجيل الدخول</button>`;
  }
  window.Store.updateCartCount();
}

async function logout() { await window.app.signOut(window.app.auth); window.Store.showToast('تم الخروج'); }

function renderColors(colors) {
  const list = document.getElementById('colors-list');
  list.innerHTML = '';
  colors.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'color-option';
    btn.style.backgroundColor = window.Store.getColorBg(c);
    btn.title = c;
    btn.onclick = () => {
      document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
      btn.classList.add('selected');
      selectedColor = c;
    };
    list.appendChild(btn);
  });
}

function renderSizes(sizes) {
  const list = document.getElementById('sizes-list');
  list.innerHTML = '';
  sizes.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'size-option';
    btn.textContent = s;
    btn.onclick = () => {
      document.querySelectorAll('.size-option').forEach(el => el.classList.remove('selected'));
      btn.classList.add('selected');
      selectedSize = s;
    };
    list.appendChild(btn);
  });
}

function renderImages(images) {
  const main = document.getElementById('main-img');
  const thumbs = document.getElementById('thumbnails');
  main.src = images[0] || 'https://via.placeholder.com/600x600?text=لا+صورة';
  thumbs.innerHTML = '';
  images.forEach(img => {
    const t = document.createElement('img');
    t.src = img;
    t.className = 'w-20 h-20 object-cover rounded cursor-pointer border-2 border-transparent hover:border-black';
    t.onclick = () => main.src = img;
    thumbs.appendChild(t);
  });
}

async function loadProduct() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id) {
    document.getElementById('loading').innerHTML = '<p class="text-red-500">معرف المنتج غير موجود</p>';
    return;
  }
  try {
    const docSnap = await window.app.getDoc(window.app.doc(window.app.db, 'products', id));
    if (!docSnap.exists()) {
      document.getElementById('loading').innerHTML = '<p class="text-red-500">المنتج غير موجود</p>';
      return;
    }
    productData = { id: docSnap.id, ...docSnap.data() };
    document.getElementById('loading').classList.add('hidden');
    const content = document.getElementById('product-content');
    content.classList.remove('hidden');

    document.getElementById('p-name').textContent = productData.name;
    document.getElementById('p-type').textContent = productData.type || '';
    document.getElementById('p-price').textContent = `${productData.price} ر.س`;
    if (productData.priceOriginal) {
      document.getElementById('p-price-original').textContent = `${productData.priceOriginal} ر.س`;
    }
    document.getElementById('p-available').innerHTML = productData.available ? '<span class="text-green-600">متوفر ✅</span>' : '<span class="text-red-500">غير متوفر ❌</span>';

    renderImages(productData.images || []);
    renderColors(productData.colors || []);
    renderSizes(productData.sizes || []);

  } catch (err) {
    console.error(err);
    document.getElementById('loading').innerHTML = `<p class="text-red-500">خطأ: ${err.message}</p>`;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  window.app.onAuthStateChanged(window.app.auth, updateUserUI);
  loadProduct();
  document.getElementById('add-to-cart-btn').onclick = () => {
    if (!selectedColor || !selectedSize) {
      window.Store.showToast('اختر اللون والمقاس أولاً', 'error');
      return;
    }
    window.Store.addToCart(
      productData.id,
      productData.name,
      productData.price,
      productData.images?.[0] || '',
      selectedSize,
      selectedColor
    );
  };
});
</script>
</body>
</html>
