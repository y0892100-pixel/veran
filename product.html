<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المنتج - VAREN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; display: none; }
    .toast.show { display: block; }
    .toast.success { background: #16a34a; }
    .toast.error { background: #dc2626; }
    .size-btn.selected { background: black; color: white; }
    .color-btn.selected { border: 3px solid black; transform: scale(1.15); }
    .related-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    .related-card { transition: all 0.3s ease; }
    /* نافذة تكبير الصور */
    .image-lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; align-items: center; justify-content: center; }
    .image-lightbox.active { display: flex; }
    .image-lightbox img { max-width: 90%; max-height: 80%; object-fit: contain; border-radius: 8px; }
    .image-lightbox .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .image-lightbox .prev-btn { right: 20px; }
    .image-lightbox .next-btn { left: 20px; }
    .image-lightbox .close-btn { position: absolute; top: 20px; right: 20px; background: transparent; color: white; border: none; font-size: 30px; cursor: pointer; }
    .main-image-container { cursor: zoom-in; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <a href="index.html" class="text-2xl font-bold text-gray-900">VAREN</a>
    <a href="javascript:history.back()" class="text-sm text-gray-600 hover:text-black">
      <i class="fa-solid fa-arrow-right ml-1"></i> الرجوع
    </a>
  </div>
</nav>

<main class="max-w-7xl mx-auto px-4 py-8">
  <div id="loading" class="text-center py-16">
    <i class="fa-solid fa-spinner fa-spin fa-2xl"></i>
    <p class="mt-2">جاري التحميل...</p>
  </div>

  <div id="product-content" class="hidden">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
      <!-- صور المنتج -->
      <div>
        <div id="main-image" class="main-image-container w-full aspect-square bg-gray-100 rounded-xl overflow-hidden mb-4" onclick="openLightbox(0)">
          <img src="" alt="" class="w-full h-full object-cover" id="main-img-el">
        </div>
        <div id="thumbnails" class="grid grid-cols-5 gap-2"></div>
      </div>

      <!-- معلومات المنتج -->
      <div>
        <h1 id="prod-name" class="text-3xl font-bold mb-2"></h1>
        <p id="prod-meta" class="text-gray-600 mb-4"></p>
        
        <div class="flex items-center gap-3 mb-3">
          <span id="prod-price" class="text-2xl font-bold"></span>
          <span id="prod-original-price" class="text-lg text-gray-400 line-through hidden"></span>
        </div>
        
        <!-- عرض المخزون -->
        <div id="stock-display" class="mb-4 font-medium"></div>
        
        <div id="unavailable-msg" class="hidden text-red-500 font-medium mb-4">
          <i class="fa-solid fa-circle-xmark ml-1"></i> المنتج غير متوفر حالياً
        </div>

        <!-- اختيار المقاس -->
        <div class="mb-4">
          <p class="font-medium mb-2">المقاس:</p>
          <div id="sizes-container" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- اختيار اللون -->
        <div class="mb-4">
          <p class="font-medium mb-2">اللون:</p>
          <div id="colors-container" class="flex flex-wrap gap-3"></div>
        </div>

        <!-- الكمية -->
        <div class="mb-6">
          <p class="font-medium mb-2">الكمية:</p>
          <div class="flex items-center gap-3">
            <button onclick="changeQty(-1)" class="w-10 h-10 border rounded-lg flex items-center justify-center hover:bg-gray-100">-</button>
            <span id="qty-val" class="text-lg font-medium w-10 text-center">1</span>
            <button onclick="changeQty(1)" class="w-10 h-10 border rounded-lg flex items-center justify-center hover:bg-gray-100">+</button>
          </div>
          <p id="max-stock-msg" class="text-sm text-gray-500 mt-1"></p>
        </div>

        <!-- زر الإضافة -->
        <button id="add-cart-btn" onclick="addToCart()" class="w-full bg-black text-white py-3 rounded-lg font-semibold hover:bg-gray-800">
          <i class="fa-solid fa-cart-plus ml-1"></i> أضف للسلة
        </button>
      </div>
    </div>

    <!-- منتجات مشابهة -->
    <div id="related-section" class="border-t pt-10">
      <h2 class="text-2xl font-bold mb-6">منتجات مشابهة</h2>
      <div id="related-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </div>
  </div>

  <div id="not-found" class="hidden text-center py-16">
    <i class="fa-solid fa-circle-exclamation text-gray-300 text-6xl mb-4"></i>
    <h2 class="text-xl font-bold text-gray-500 mb-2">المنتج غير موجود</h2>
    <a href="index.html" class="bg-black text-white px-6 py-2 rounded-lg inline-block mt-2">العودة للرئيسية</a>
  </div>
</main>

<!-- نافذة تكبير الصور -->
<div id="lightbox" class="image-lightbox" onclick="closeLightbox(event)">
  <button class="close-btn" onclick="closeLightbox(event)">&times;</button>
  <button class="nav-btn prev-btn" onclick="prevImage(event)">&#8592;</button>
  <img id="lightbox-img" src="" alt="" onclick="event.stopPropagation()">
  <button class="nav-btn next-btn" onclick="nextImage(event)">&#8594;</button>
</div>

<div id="toast" class="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCXYzZgFIFU2u6R02_ConvSonD9SJRWS9Q",
  authDomain: "varen-f7756.firebaseapp.com",
  projectId: "varen-f7756",
  storageBucket: "varen-f7756.firebasestorage.app",
  messagingSenderId: "648684291842",
  appId: "1:648684291842:web:f3e806fc76a6e119caa41b",
  measurementId: "G-SV7DKGPH2M"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 🎨 أسماء الألوان و أكوادها الحقيقية
const COLOR_MAP = {
  'أسود': '#000000',
  'أبيض': '#ffffff',
  'رمادي': '#9ca3af',
  'بيج': '#d9c7b8',
  'أحمر': '#ef4444',
  'أزرق': '#3b82f6',
  'أخضر': '#22c55e',
  'وردي': '#f472b6',
  'بني': '#a16207',
  'برتقالي': '#f97316',
  'ذهبي': '#f59e0b',
  'فضي': '#d1d5db',
  'بنفسجي': '#8b5cf6',
  'أصفر': '#facc15'
};

let product = null;
let selectedSize = null;
let selectedColor = null;
let quantity = 1;
let currentImageIndex = 0;
let productImages = [];

const DEFAULT_SIZES = ['XS', 'S', 'M', 'L', 'XL', 'XXL'];

function showToast(msg, type='success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast ${type} show`;
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function getProductId() {
  return new URLSearchParams(window.location.search).get('id');
}

async function loadProduct() {
  const id = getProductId();
  if (!id) return showNotFound();
  try {
    const doc = await db.collection('products').doc(id).get();
    if (!doc.exists) return showNotFound();
    product = { id: doc.id, ...doc.data() };
    productImages = product.images?.length ? [...product.images] : ['https://via.placeholder.com/600x600?text=لا+صورة'];
    renderProduct();
    loadRelated();
  } catch (err) {
    console.error(err);
    showToast('خطأ في تحميل المنتج', 'error');
  }
}

function showNotFound() {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('not-found').classList.remove('hidden');
}

function renderProduct() {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('product-content').classList.remove('hidden');
  
  // الاسم والمعلومات
  document.getElementById('prod-name').textContent = product.name || 'منتج بدون اسم';
  const parts = [
    product.gender === 'women' ? 'نسائي' : 
    product.gender === 'men' ? 'رجالي' : 
    product.gender === 'girls' ? 'بنات' : 
    product.gender === 'boys' ? 'أولاد' : null,
    product.type || '',
    product.season === 'winter' ? 'شتوي' : 
    product.season === 'summer' ? 'صيفي' : 
    product.season || ''
  ].filter(Boolean);
  document.getElementById('prod-meta').textContent = parts.join(' • ');

  // السعر
  const price = Number(product.price) || 0;
  const origPrice = product.priceOriginal ? Number(product.priceOriginal) : null;
  document.getElementById('prod-price').textContent = `${price.toFixed(2)} درهم`;
  if (origPrice && origPrice > price) {
    document.getElementById('prod-original-price').textContent = `${origPrice.toFixed(2)} درهم`;
    document.getElementById('prod-original-price').classList.remove('hidden');
  }

  // 📦 عرض المخزون
  const stock = product.stock || 0;
  const stockEl = document.getElementById('stock-display');
  if (stock === 0) {
    stockEl.innerHTML = '<span class="text-red-500">❌ نفذ من المخزون</span>';
  } else if (stock <= 3) {
    stockEl.innerHTML = `<span class="text-orange-500">⚠️ تبقى فقط ${stock} قطع!</span>`;
  } else {
    stockEl.innerHTML = `<span class="text-green-600">✅ متوفر: ${stock} قطعة</span>`;
  }

  // التوفر
  const isAvailable = product.available !== false && stock > 0;
  if (!isAvailable) {
    document.getElementById('unavailable-msg').classList.remove('hidden');
    document.getElementById('add-cart-btn').disabled = true;
    document.getElementById('add-cart-btn').classList.add('opacity-50', 'cursor-not-allowed');
  }

  // 🖼️ الصور والمعرض
  currentImageIndex = 0;
  document.getElementById('main-img-el').src = productImages[0];
  const thumbs = document.getElementById('thumbnails');
  thumbs.innerHTML = '';
  productImages.forEach((img, i) => {
    thumbs.innerHTML += `<button onclick="changeMainImg(${i})" class="aspect-square overflow-hidden rounded-lg border-2 ${i===0?'border-black':'border-transparent'} hover:border-gray-400"><img src="${img}" alt="" class="w-full h-full object-cover"></button>`;
  });

  // المقاسات
  const sizes = product.sizes?.length ? product.sizes : DEFAULT_SIZES;
  const sizesCont = document.getElementById('sizes-container');
  sizesCont.innerHTML = '';
  sizes.forEach(s => {
    sizesCont.innerHTML += `<button class="size-btn border px-4 py-2 rounded-lg hover:bg-gray-100" onclick="selectSize('${s}', this)">${s}</button>`;
  });

  // 🎨 الألوان — نعرض اللون الحقيقي
  const colors = product.colors?.length ? product.colors : Object.keys(COLOR_MAP);
  const colorsCont = document.getElementById('colors-container');
  colorsCont.innerHTML = '';
  colors.forEach(c => {
    const bgColor = COLOR_MAP[c] || c;
    const isLight = (bgColor.startsWith('#') && parseInt(bgColor.slice(1), 16) > 0x888888);
    const borderStyle = isLight ? 'border border-gray-400' : '';
    colorsCont.innerHTML += `<button class="color-btn w-10 h-10 rounded-full ${borderStyle} hover:scale-110 transition-transform" style="background:${bgColor}" title="${c}" onclick="selectColor('${c}', this)"></button>`;
  });
}

function changeMainImg(index) {
  currentImageIndex = index;
  document.getElementById('main-img-el').src = productImages[index];
  // تحديث تحديد الصورة المصغرة
  document.querySelectorAll('#thumbnails button').forEach((btn, i) => {
    btn.classList.toggle('border-black', i === index);
    btn.classList.toggle('border-transparent', i !== index);
  });
}

// 🖼️ نافذة تكبير الصور
function openLightbox(index) {
  currentImageIndex = index;
  document.getElementById('lightbox-img').src = productImages[index];
  document.getElementById('lightbox').classList.add('active');
}

function closeLightbox(event) {
  if (!event || event.target === event.currentTarget) {
    document.getElementById('lightbox').classList.remove('active');
  }
}

function prevImage(event) {
  event.stopPropagation();
  currentImageIndex = (currentImageIndex - 1 + productImages.length) % productImages.length;
  document.getElementById('lightbox-img').src = productImages[currentImageIndex];
}

function nextImage(event) {
  event.stopPropagation();
  currentImageIndex = (currentImageIndex + 1) % productImages.length;
  document.getElementById('lightbox-img').src = productImages[currentImageIndex];
}

function selectSize(size, btn) {
  selectedSize = size;
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function selectColor(color, btn) {
  selectedColor = color;
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

// ⚠️ منع تجاوز المخزون
function changeQty(delta) {
  const maxStock = product.stock || 0;
  const newQty = quantity + delta;
  
  if (newQty < 1) return;
  if (newQty > maxStock) {
    showToast(`⚠️ المتوفر فقط: ${maxStock} قطعة`, 'error');
    return;
  }
  
  quantity = newQty;
  document.getElementById('qty-val').textContent = quantity;
  
  const msgEl = document.getElementById('max-stock-msg');
  msgEl.textContent = maxStock <= 5 ? `الكمية المتاحة: ${maxStock} قطعة` : '';
}

function addToCart() {
  const stock = product.stock || 0;
  const isAvailable = product.available !== false && stock > 0;
  
  if (!isAvailable) return showToast('❌ المنتج غير متوفر أو نفذ من المخزون', 'error');
  if (!selectedSize) return showToast('اختر المقاس أولاً', 'error');
  if (!selectedColor) return showToast('اختر اللون أولاً', 'error');
  if (quantity > stock) return showToast(`⚠️ الكمية المطلوبة (${quantity}) أكثر من المتوفر (${stock})`, 'error');

  const cart = JSON.parse(localStorage.getItem('varen_cart_v1') || '[]');
  const existingIdx = cart.findIndex(item => 
    item.id === product.id && item.size === selectedSize && item.color === selectedColor
  );

  const itemData = {
    id: product.id,
    name: product.name,
    price: Number(product.price),
    image: productImages[0],
    size: selectedSize,
    color: selectedColor,
    qty: quantity,
    stock: stock // نحفظ المخزون وقت الإضافة للتحقق لاحقاً
  };

  if (existingIdx !== -1) {
    const newTotalQty = cart[existingIdx].qty + quantity;
    if (newTotalQty > stock) {
      return showToast(`⚠️ الكمية الإجمالية في السلة ستتجاوز المخزون المتاح (${stock})`, 'error');
    }
    cart[existingIdx].qty = newTotalQty;
  } else {
    cart.push(itemData);
  }

  localStorage.setItem('varen_cart_v1', JSON.stringify(cart));
  showToast('✅ أضيف للسلة بنجاح!');
  quantity = 1;
  document.getElementById('qty-val').textContent = '1';
}

// تحميل منتجات مشابهة
async function loadRelated() {
  const grid = document.getElementById('related-grid');
  try {
    const snapshot = await db.collection('products').limit(8).get();
    let products = [];
    snapshot.forEach(doc => {
      const p = { id: doc.id, ...doc.data() };
      if (p.available !== false && (p.stock || 0) > 0 && p.id !== product.id) {
        products.push(p);
      }
    });
    products = products.slice(0, 4);
    
    if (products.length === 0) {
      grid.innerHTML = '<p class="col-span-full text-center text-gray-500">لا توجد منتجات مشابهة حالياً</p>';
      return;
    }
    
    grid.innerHTML = '';
    products.forEach(p => {
      const img = p.images?.[0] || 'https://via.placeholder.com/300x400';
      grid.innerHTML += `
        <a href="product.html?id=${p.id}" class="related-card block bg-white rounded-xl shadow-sm overflow-hidden border">
          <img src="${img}" alt="${p.name}" class="w-full h-36 object-cover">
          <div class="p-3">
            <h3 class="font-bold text-sm mb-1">${p.name}</h3>
            <span class="font-semibold">${p.price} درهم</span>
          </div>
        </a>
      `;
    });
  } catch (err) {
    console.error(err);
  }
}

document.addEventListener('DOMContentLoaded', loadProduct);
</script>

</body>
</html>
