<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المنتج - VAREN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; display: none; }
    .toast.show { display: block; }
    .toast.success { background: #16a34a; }
    .toast.error { background: #dc2626; }
    .size-btn.selected { background: black; color: white; }
    .color-btn.selected { border: 3px solid black; }
    .related-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    .related-card { transition: all 0.3s ease; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">
<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <a href="index.html" class="text-2xl font-bold text-gray-900">VAREN</a>
    <a href="javascript:history.back()" class="text-sm text-gray-600 hover:text-black">
      <i class="fa-solid fa-arrow-right ml-1"></i> الرجوع
    </a>
  </div>
</nav>
<main class="max-w-7xl mx-auto px-4 py-8">
  <div id="loading" class="text-center py-16">
    <i class="fa-solid fa-spinner fa-spin fa-2xl"></i>
    <p class="mt-2">جاري التحميل...</p>
  </div>
  <div id="product-content" class="hidden">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
      <!-- صور المنتج -->
      <div>
        <div id="main-image" class="w-full aspect-square bg-gray-100 rounded-xl overflow-hidden mb-4">
          <img src="" alt="" class="w-full h-full object-cover" id="main-img-el">
        </div>
        <div id="thumbnails" class="grid grid-cols-5 gap-2"></div>
      </div>
      <!-- معلومات المنتج -->
      <div>
        <h1 id="prod-name" class="text-3xl font-bold mb-2"></h1>
        <p id="prod-meta" class="text-gray-600 mb-4"></p>
        
        <div class="flex items-center gap-3 mb-6">
          <span id="prod-price" class="text-2xl font-bold"></span>
          <span id="prod-original-price" class="text-lg text-gray-400 line-through hidden"></span>
        </div>
        <div id="unavailable-msg" class="hidden text-red-500 font-medium mb-4">
          <i class="fa-solid fa-circle-xmark ml-1"></i> المنتج غير متوفر حالياً
        </div>
        <!-- اختيار المقاس -->
        <div class="mb-4">
          <p class="font-medium mb-2">المقاس:</p>
          <div id="sizes-container" class="flex flex-wrap gap-2"></div>
        </div>
        <!-- اختيار اللون -->
        <div class="mb-4">
          <p class="font-medium mb-2">اللون:</p>
          <div id="colors-container" class="flex flex-wrap gap-2"></div>
        </div>
        <!-- الكمية -->
        <div class="mb-6">
          <p class="font-medium mb-2">الكمية:</p>
          <div class="flex items-center gap-3">
            <button onclick="changeQty(-1)" class="w-10 h-10 border rounded-lg flex items-center justify-center hover:bg-gray-100">-</button>
            <span id="qty-val" class="text-lg font-medium w-10 text-center">1</span>
            <button onclick="changeQty(1)" class="w-10 h-10 border rounded-lg flex items-center justify-center hover:bg-gray-100">+</button>
          </div>
        </div>
        <!-- زر الإضافة -->
        <button id="add-cart-btn" onclick="addToCart()" class="w-full bg-black text-white py-3 rounded-lg font-semibold hover:bg-gray-800">
          <i class="fa-solid fa-cart-plus ml-1"></i> أضف للسلة
        </button>
      </div>
    </div>
    <!-- منتجات مشابهة -->
    <div id="related-section" class="border-t pt-10">
      <h2 class="text-2xl font-bold mb-6">منتجات مشابهة</h2>
      <div id="related-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </div>
  </div>
  <div id="not-found" class="hidden text-center py-16">
    <i class="fa-solid fa-circle-exclamation text-gray-300 text-6xl mb-4"></i>
    <h2 class="text-xl font-bold text-gray-500 mb-2">المنتج غير موجود</h2>
    <a href="index.html" class="bg-black text-white px-6 py-2 rounded-lg inline-block mt-2">العودة للرئيسية</a>
  </div>
</main>
<div id="toast" class="toast"></div>

<script>
// ✅ إعدادات المشروع الجديد
const firebaseConfig = {
  apiKey: "AIzaSyDQTvVXrLYgbkpNI_YfwdVpZrQFBIzzPmU",
  authDomain: "varen-5dcfd.firebaseapp.com",
  projectId: "varen-5dcfd",
  storageBucket: "varen-5dcfd.firebasestorage.app",
  messagingSenderId: "769663614271",
  appId: "1:769663614271:web:4b2b843f99a8d7a071678a",
  measurementId: "G-DNHBHJHDVX"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.firestore();

const COLOR_HEX = {
  Black: '#111111', White: '#ffffff', Gray: '#9ca3af', Beige: '#d6c2a1',
  Red: '#ef4444', Blue: '#3b82f6', Green: '#22c55e', Pink: '#ec4899',
  Brown: '#8b5e3c', Purple: '#8b5cf6', Yellow: '#facc15', Orange: '#f97316'
};

let product = null;
let selectedSize = null;
let selectedColor = null;
let quantity = 1;
const DEFAULT_SIZES = ['XS', 'S', 'M', 'L', 'XL', 'XXL'];
const DEFAULT_COLORS = Object.keys(COLOR_HEX);

function showToast(msg, type='success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast ${type} show`;
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function getProductId() {
  const params = new URLSearchParams(window.location.search);
  return params.get('id');
}

async function loadProduct() {
  const id = getProductId();
  if (!id) return showNotFound();
  try {
    const doc = await db.collection('products').doc(id).get();
    if (!doc.exists) return showNotFound();
    
    product = { id: doc.id, ...doc.data() };
    renderProduct();
    loadRelated();
  } catch (err) {
    console.error(err);
    showToast('خطأ في تحميل المنتج', 'error');
  }
}

function showNotFound() {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('not-found').classList.remove('hidden');
}

function renderProduct() {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('product-content').classList.remove('hidden');
  
  // الاسم والمعلومات
  document.getElementById('prod-name').textContent = product.name || 'منتج بدون اسم';
  const parts = [
    product.gender === 'women' ? 'نسائي' : 
    product.gender === 'men' ? 'رجالي' : 
    product.gender === 'girls' ? 'بنات' : 
    product.gender === 'boys' ? 'أولاد' : null,
    product.type || '',
    product.season === 'winter' ? 'شتوي' : 
    product.season === 'summer' ? 'صيفي' : 
    product.season || ''
  ].filter(Boolean);
  document.getElementById('prod-meta').textContent = parts.join(' • ');
  
  // السعر
  const price = Number(product.price) || 0;
  const origPrice = product.priceOriginal ? Number(product.priceOriginal) : null;
  document.getElementById('prod-price').textContent = `${price} درهم`;
  if (origPrice && origPrice > price) {
    document.getElementById('prod-original-price').textContent = `${origPrice} درهم`;
    document.getElementById('prod-original-price').classList.remove('hidden');
  }
  
  // التوفر
  const isAvailable = product.available !== false;
  if (!isAvailable) {
    document.getElementById('unavailable-msg').classList.remove('hidden');
    document.getElementById('add-cart-btn').disabled = true;
    document.getElementById('add-cart-btn').classList.add('opacity-50', 'cursor-not-allowed');
  }
  
  // الصور
  const images = product.images?.length ? product.images : ['https://via.placeholder.com/600x600?text=لا+صورة'];
  document.getElementById('main-img-el').src = images[0];
  const thumbs = document.getElementById('thumbnails');
  thumbs.innerHTML = '';
  images.forEach((img, i) => {
    thumbs.innerHTML += `<button onclick="changeMainImg('${img}')" class="aspect-square overflow-hidden rounded-lg border-2 ${i===0?'border-black':'border-transparent'} hover:border-gray-400"><img src="${img}" alt="" class="w-full h-full object-cover"></button>`;
  });
  
  // المقاسات
  const sizes = product.sizes?.length ? product.sizes : DEFAULT_SIZES;
  const sizesCont = document.getElementById('sizes-container');
  sizesCont.innerHTML = '';
  sizes.forEach(s => {
    sizesCont.innerHTML += `<button class="size-btn border px-4 py-2 rounded-lg hover:bg-gray-100" onclick="selectSize('${s}', this)">${s}</button>`;
  });
  
  // الألوان
  const colors = product.colors?.length ? product.colors : DEFAULT_COLORS;
  const colorsCont = document.getElementById('colors-container');
  colorsCont.innerHTML = '';
  colors.forEach(c => {
    const bg = COLOR_HEX[c] || c;
    const border = c === 'White' ? 'border border-gray-300' : '';
    colorsCont.innerHTML += `<button class="color-btn w-10 h-10 rounded-full ${border} hover:scale-110 transition-transform" style="background:${bg}" title="${c}" onclick="selectColor('${c}', this)"></button>`;
  });
}

function changeMainImg(src) {
  document.getElementById('main-img-el').src = src;
}

function selectSize(size, btn) {
  selectedSize = size;
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function selectColor(color, btn) {
  selectedColor = color;
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function changeQty(delta) {
  quantity = Math.max(1, quantity + delta);
  document.getElementById('qty-val').textContent = quantity;
}

function addToCart() {
  const isAvailable = product.available !== false;
  if (!isAvailable) return showToast('المنتج غير متوفر', 'error');
  if (!selectedSize) return showToast('اختر المقاس أولاً', 'error');
  if (!selectedColor) return showToast('اختر اللون أولاً', 'error');
  
  const cart = JSON.parse(localStorage.getItem('varen_cart') || '[]');
  const existingIdx = cart.findIndex(item => 
    item.id === product.id && item.size === selectedSize && item.color === selectedColor
  );
  
  const itemData = {
    id: product.id,
    name: product.name,
    price: Number(product.price),
    image: product.images?.[0] || '',
    size: selectedSize,
    color: selectedColor,
    quantity: quantity
  };
  
  if (existingIdx !== -1) {
    cart[existingIdx].quantity += quantity;
  } else {
    cart.push(itemData);
  }
  
  localStorage.setItem('varen_cart', JSON.stringify(cart));
  showToast('✅ أضيف للسلة بنجاح!');
  quantity = 1;
  document.getElementById('qty-val').textContent = '1';
}

// ✅ تحميل منتجات مشابهة
async function loadRelated() {
  const grid = document.getElementById('related-grid');
  try {
    const snapshot = await db.collection('products').limit(8).get();
    let products = [];
    snapshot.forEach(doc => {
      const p = { id: doc.id, ...doc.data() };
      if (p.available !== false && p.id !== product.id) {
        products.push(p);
      }
    });
    
    // نعرض حتى 4 منتجات مشابهة
    products = products.slice(0, 4);
    
    if (products.length === 0) {
      grid.innerHTML = '<p class="col-span-full text-center text-gray-500">لا توجد منتجات مشابهة حالياً</p>';
      return;
    }
    
    grid.innerHTML = '';
    products.forEach(p => {
      const img = p.images?.[0] || 'https://via.placeholder.com/300x400';
      grid.innerHTML += `
        <a href="product.html?id=${p.id}" class="related-card block bg-white rounded-xl shadow-sm overflow-hidden border">
          <img src="${img}" alt="${p.name}" class="w-full h-36 object-cover">
          <div class="p-3">
            <h3 class="font-bold text-sm mb-1">${p.name}</h3>
            <span class="font-semibold">${p.price} درهم</span>
          </div>
        </a>
      `;
    });
  } catch (err) {
    console.error(err);
  }
}

// ✅ عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', loadProduct);
</script>
</body>
</html>
