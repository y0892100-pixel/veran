<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معلوماتي - VAREN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; display: none; }
    .toast.show { display: block; }
    .toast.success { background: #16a34a; }
    .toast.error { background: #dc2626; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection, addDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import firebaseConfig from './firebase-config.js';
    import * as Store from './store.js';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    window.app = { auth, db, onAuthStateChanged, signOut, doc, getDoc, setDoc, collection, addDoc, getDocs, deleteDoc };
    window.Store = Store;
  </script>
</head>
<body class="bg-gray-50 text-gray-800">

<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <a href="index.html" class="text-2xl font-bold text-gray-900">VAREN</a>
    <div class="hidden md:flex gap-8">
      <a href="index.html" class="font-medium hover:text-gray-600">الرئيسية</a>
      <a href="category.html?gender=women" class="font-medium hover:text-gray-600">نسائي</a>
      <a href="category.html?gender=men" class="font-medium hover:text-gray-600">رجالي</a>
    </div>
    <div id="user-area" class="relative flex items-center gap-4">
      <a href="cart.html" class="text-xl relative">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
      </a>
      <button id="account-btn" class="hidden items-center gap-1 font-medium hover:text-gray-600">
        حسابي <i class="fa-solid fa-chevron-down text-xs"></i>
      </button>
      <button id="login-btn" onclick="location.href='admin.html'" class="bg-black text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-800">تسجيل الدخول</button>
      <div id="account-menu" class="hidden absolute right-0 mt-8 w-48 bg-white rounded-lg shadow-lg border z-50">
        <a href="account.html" class="block px-4 py-3 hover:bg-gray-100">معلوماتي</a>
        <a href="orders.html" class="block px-4 py-3 hover:bg-gray-100">طلباتي</a>
        <a href="returns.html" class="block px-4 py-3 hover:bg-gray-100">الاسترجاع</a>
        <button onclick="logout()" class="w-full text-right px-4 py-3 text-red-500 hover:bg-gray-100">تسجيل الخروج</button>
      </div>
    </div>
  </div>
</nav>

<main class="max-w-lg mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-6 text-center">معلومات الحساب</h1>

  <!-- ✅ المعلومات الشخصية -->
  <form id="account-form" class="bg-white p-6 rounded-xl shadow-md space-y-4 mb-8">
    <div>
      <label class="block font-semibold mb-1">الاسم الكامل</label>
      <input type="text" id="full-name" class="w-full border rounded-lg p-3" required>
    </div>
    <div>
      <label class="block font-semibold mb-1">رقم الهاتف (الإمارات)</label>
      <input type="tel" id="phone" class="w-full border rounded-lg p-3" placeholder="050XXXXXXX أو +9715XXXXXXXX" required>
      <p id="phone-error" class="text-red-500 text-sm mt-1 hidden">أدخل رقم هاتف صالح في الإمارات (يبدأ بـ 05 أو +9715)</p>
    </div>
    <div>
      <label class="block font-semibold mb-1">موقعك على قوقل ماب</label>
      <input type="url" id="location-url" class="w-full border rounded-lg p-3" placeholder="انسخ رابط الموقع من قوقل ماب ولصقه هنا">
      <p class="text-gray-500 text-sm mt-1">مثال: https://www.google.com/maps/search/?api=1&query=25.2048,55.2708</p>
    </div>
    <button type="submit" class="w-full bg-black text-white py-3 rounded-lg text-lg hover:bg-gray-800">حفظ المعلومات</button>
  </form>

  <!-- ✅ طرق الدفع -->
  <div class="bg-white p-6 rounded-xl shadow-md">
    <h2 class="text-xl font-bold mb-4">طرق الدفع</h2>
    <div id="payment-methods-list" class="space-y-3 mb-4">
      <p class="text-gray-500 text-sm">لم تضف أي طريقة دفع بعد.</p>
    </div>
    <button type="button" onclick="showPaymentForm()" class="text-blue-600 text-sm font-medium">+ إضافة طريقة دفع جديدة</button>

    <!-- نموذج إضافة طريقة دفع -->
    <div id="payment-form" class="hidden mt-4 p-4 bg-gray-50 rounded-lg border space-y-3">
      <select id="pm-type" class="w-full border rounded-lg p-2">
        <option value="card">بطاقة ائتمان/خصم</option>
        <option value="bank">حساب بنكي</option>
        <option value="paypal">PayPal</option>
      </select>
      <input type="text" id="pm-name" class="w-full border rounded-lg p-2" placeholder="الاسم على البطاقة/الحساب">
      <input type="text" id="pm-last4" class="w-full border rounded-lg p-2" placeholder="آخر 4 أرقام فقط (للحماية)">
      <div class="flex gap-2">
        <button type="button" onclick="savePaymentMethod()" class="flex-1 bg-black text-white py-2 rounded-lg hover:bg-gray-800">حفظ</button>
        <button type="button" onclick="hidePaymentForm()" class="flex-1 bg-gray-300 py-2 rounded-lg hover:bg-gray-400">إلغاء</button>
      </div>
    </div>
  </div>
</main>

<footer class="bg-gray-900 text-white py-8 text-center">
  <p>&copy; 2026 VAREN. جميع الحقوق محفوظة.</p>
</footer>

<div id="toast" class="toast"></div>

<script>
const accountBtn = document.getElementById('account-btn');
const accountMenu = document.getElementById('account-menu');
const toast = document.getElementById('toast');
let paymentMethods = [];

function showToast(msg, type='success') {
  toast.textContent = msg;
  toast.className = `toast show ${type}`;
  setTimeout(() => toast.classList.remove('show'), 4000);
}

if (accountBtn) {
  accountBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    accountMenu.classList.toggle('hidden');
  });
  document.addEventListener('click', () => accountMenu?.classList.add('hidden'));
  accountMenu?.addEventListener('click', (e) => e.stopPropagation());
}

function updateUserUI(user) {
  const loginBtn = document.getElementById('login-btn');
  if (user) {
    if (loginBtn) loginBtn.classList.add('hidden');
    if (accountBtn) {
      accountBtn.classList.remove('hidden');
      accountBtn.classList.add('flex');
    }
  } else {
    if (loginBtn) loginBtn.classList.remove('hidden');
    if (accountBtn) accountBtn.classList.add('hidden');
    if (accountMenu) accountMenu.classList.add('hidden');
  }
  window.Store?.updateCartCount?.();
}

async function logout() {
  await window.app.signOut(window.app.auth);
  window.location.href = 'index.html';
}

function validatePhone(phone) {
  const regex = /^(?:\+9715|009715|05)[0-9]{7,8}$/;
  return regex.test(phone.replace(/\s/g, ''));
}

async function loadUserData(user) {
  if (!user) return;
  try {
    const docSnap = await window.app.getDoc(window.app.doc(window.app.db, 'users', user.uid));
    if (docSnap.exists()) {
      const data = docSnap.data();
      document.getElementById('full-name').value = data.name || '';
      document.getElementById('phone').value = data.phone || '';
      document.getElementById('location-url').value = data.locationUrl || '';
    }
    loadPaymentMethods(user);
  } catch (err) {
    console.error(err);
  }
}

// ✅ طرق الدفع
function showPaymentForm() {
  document.getElementById('payment-form').classList.remove('hidden');
}

function hidePaymentForm() {
  document.getElementById('payment-form').classList.add('hidden');
  document.getElementById('pm-type').value = 'card';
  document.getElementById('pm-name').value = '';
  document.getElementById('pm-last4').value = '';
}

async function loadPaymentMethods(user) {
  try {
    const snap = await window.app.getDocs(window.app.collection(window.app.db, 'users', user.uid, 'paymentMethods'));
    paymentMethods = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderPaymentMethods();
  } catch (err) {
    console.error(err);
  }
}

function renderPaymentMethods() {
  const list = document.getElementById('payment-methods-list');
  if (!paymentMethods.length) {
    list.innerHTML = '<p class="text-gray-500 text-sm">لم تضف أي طريقة دفع بعد.</p>';
    return;
  }
  list.innerHTML = paymentMethods.map(pm => `
    <div class="flex justify-between items-center p-3 border rounded-lg">
      <div>
        <span class="font-medium">${pm.type === 'card' ? 'بطاقة' : pm.type === 'bank' ? 'حساب بنكي' : 'PayPal'}</span>
        <span class="text-sm text-gray-500 ml-2">**** ${pm.last4}</span>
        <p class="text-xs text-gray-400">${pm.name}</p>
      </div>
      <button onclick="deletePaymentMethod('${pm.id}')" class="text-red-500 text-sm hover:text-red-700">حذف</button>
    </div>
  `).join('');
}

async function savePaymentMethod() {
  const user = window.app.auth.currentUser;
  const type = document.getElementById('pm-type').value;
  const name = document.getElementById('pm-name').value.trim();
  const last4 = document.getElementById('pm-last4').value.trim();

  if (!name || !last4 || last4.length !== 4) {
    return showToast('املأ البيانات بشكل صحيح (آخر 4 أرقام فقط)', 'error');
  }

  try {
    await window.app.addDoc(
      window.app.collection(window.app.db, 'users', user.uid, 'paymentMethods'),
      { type, name, last4, createdAt: new Date() }
    );
    hidePaymentForm();
    loadPaymentMethods(user);
    showToast('تم حفظ طريقة الدفع ✅');
  } catch (err) {
    showToast('خطأ في الحفظ: ' + err.message, 'error');
  }
}

async function deletePaymentMethod(pmId) {
  const user = window.app.auth.currentUser;
  try {
    await window.app.deleteDoc(
      window.app.doc(window.app.db, 'users', user.uid, 'paymentMethods', pmId)
    );
    loadPaymentMethods(user);
    showToast('تم الحذف ✅');
  } catch (err) {
    showToast('خطأ في الحذف: ' + err.message, 'error');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  window.app.onAuthStateChanged(window.app.auth, async (user) => {
    updateUserUI(user);
    if (!user) {
      window.location.href = 'admin.html';
      return;
    }
    loadUserData(user);
  });

  // حفظ المعلومات الشخصية
  document.getElementById('account-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const user = window.app.auth.currentUser;
    if (!user) return;

    const name = document.getElementById('full-name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const locationUrl = document.getElementById('location-url').value.trim();
    const phoneError = document.getElementById('phone-error');

    if (!validatePhone(phone)) {
      phoneError.classList.remove('hidden');
      return;
    }
    phoneError.classList.add('hidden');

    try {
      await window.app.setDoc(window.app.doc(window.app.db, 'users', user.uid), {
        name,
        phone,
        locationUrl,
        email: user.email,
        updatedAt: new Date()
      }, { merge: true });
      showToast('تم حفظ المعلومات بنجاح ✅');
    } catch (err) {
      showToast('خطأ في الحفظ: ' + err.message, 'error');
    }
  });

  // جعل الدوال متاحة عالمياً
  window.showPaymentForm = showPaymentForm;
  window.hidePaymentForm = hidePaymentForm;
  window.savePaymentMethod = savePaymentMethod;
  window.deletePaymentMethod = deletePaymentMethod;
});
</script>
</body>
</html>
