<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسابي - VAREN</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import firebaseConfig from './firebase-config.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        window.app = { auth, db, doc, setDoc, getDoc, onAuthStateChanged };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap'); * { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50">
<nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <a href="index.html" class="text-2xl font-bold">VAREN</a>
        <div id="user-area"></div>
    </div>
</nav>

<main class="max-w-2xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-bold mb-8">معلومات الحساب</h1>
    <form id="account-form" class="bg-white p-6 rounded-xl shadow-md space-y-4">
        <div>
            <label class="block font-semibold mb-1">الاسم الكامل</label>
            <input type="text" id="acc-name" class="w-full border border-gray-300 rounded-lg p-3">
        </div>
        <div>
            <label class="block font-semibold mb-1">الإيميل</label>
            <input type="email" id="acc-email" class="w-full border border-gray-300 rounded-lg p-3 bg-gray-100" readonly>
        </div>
        <div>
            <label class="block font-semibold mb-1">رقم الهاتف</label>
            <input type="tel" id="acc-phone" class="w-full border border-gray-300 rounded-lg p-3">
        </div>
        <div>
            <label class="block font-semibold mb-1">العنوان</label>
            <textarea id="acc-address" class="w-full border border-gray-300 rounded-lg p-3" rows="3"></textarea>
        </div>
        <button type="submit" class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800">حفظ التغييرات</button>
    </form>
</main>

<script type="module">
    const { auth, db, doc, setDoc, getDoc, onAuthStateChanged } = window.app;
    let currentUser = null;
    let userDataRef = null;

    onAuthStateChanged(auth, async user => {
        if (!user) { window.location.href = 'index.html'; return; }
        currentUser = user;
        userDataRef = doc(db, 'users', user.uid);
        const snap = await getDoc(userDataRef);
        if (snap.exists()) {
            const data = snap.data();
            document.getElementById('acc-name').value = data.name || user.displayName || '';
            document.getElementById('acc-email').value = data.email || user.email || '';
            document.getElementById('acc-phone').value = data.phone || '';
            document.getElementById('acc-address').value = data.address || '';
        } else {
            document.getElementById('acc-name').value = user.displayName || '';
            document.getElementById('acc-email').value = user.email || '';
        }
    });

    document.getElementById('account-form').addEventListener('submit', async e => {
        e.preventDefault();
        if (!currentUser) return;
        const name = document.getElementById('acc-name').value.trim();
        const phone = document.getElementById('acc-phone').value.trim();
        const address = document.getElementById('acc-address').value.trim();
        await setDoc(userDataRef, { name, phone, address }, { merge: true });
        alert('تم حفظ المعلومات بنجاح ✅');
    });
</script>
</body>
</html>
