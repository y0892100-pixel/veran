<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حسابي - VAREN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; display: none; }
    .toast.show { display: block; }
    .toast.success { background: #16a34a; }
    .toast.error { background: #dc2626; }
  </style>
</head>
<body class="bg-gray-50">

<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <a href="index.html" class="text-2xl font-bold text-gray-900">VAREN</a>
    <div id="user-area"></div>
  </div>
</nav>

<main class="max-w-lg mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-6">بيانات الحساب</h1>
  <div id="loading" class="text-center py-16"><i class="fa-solid fa-spinner fa-spin fa-2xl"></i></div>
  <div id="content" class="hidden">
    <form id="profile-form" class="bg-white p-6 rounded-xl shadow-md space-y-4">
      <div>
        <label class="block font-semibold mb-1">الاسم الكامل</label>
        <input type="text" id="u-name" class="w-full border rounded-lg p-3">
      </div>
      <div>
        <label class="block font-semibold mb-1">البريد الإلكتروني</label>
        <input type="email" id="u-email" class="w-full border rounded-lg p-3 bg-gray-100" readonly>
      </div>
      <div>
        <label class="block font-semibold mb-1">رقم الهاتف</label>
        <input type="tel" id="u-phone" class="w-full border rounded-lg p-3" placeholder="مثال: 0501234567">
      </div>
      <div>
        <label class="block font-semibold mb-1">العنوان الكامل</label>
        <textarea id="u-address" class="w-full border rounded-lg p-3" rows="3" placeholder="المدينة — المنطقة — الشارع — المبنى — رقم الهاتف"></textarea>
      </div>
      <button type="submit" class="w-full bg-black text-white py-3 rounded-lg font-semibold hover:bg-gray-800">حفظ التغييرات</button>
    </form>
  </div>
  <div id="no-login" class="hidden text-center py-16">
    <i class="fa-solid fa-lock text-6xl text-gray-300 mb-4"></i>
    <p class="text-xl text-gray-500 mb-4">سجّل الدخول أولاً</p>
    <a href="login.html" class="bg-black text-white px-6 py-2 rounded-lg inline-block">تسجيل الدخول</a>
  </div>
  <div id="toast" class="toast"></div>
</main>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCXYzZgFIFU2u6R02_ConvSonD9SJRWS9Q",
  authDomain: "varen-f7756.firebaseapp.com",
  projectId: "varen-f7756",
  storageBucket: "varen-f7756.firebasestorage.app",
  messagingSenderId: "648684291842",
  appId: "1:648684291842:web:f3e806fc76a6e119caa41b"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 4000);
}

// ✅ القائمة المنسدلة الموحدة
function updateUserNav(user) {
  const area = document.getElementById('user-area');
  if (!user) {
    area.innerHTML = `<button onclick="window.location.href='login.html'" class="bg-black text-white px-4 py-2 rounded-lg hover:bg-gray-800">تسجيل الدخول</button>`;
    return;
  }
  const isAdmin = user.email === 'y0892100@gmail.com';
  area.innerHTML = `
    <div class="relative group">
      <button class="flex items-center gap-2 bg-gray-100 px-3 py-2 rounded-lg hover:bg-gray-200">
        <i class="fa-solid fa-user-circle"></i>
        <span>${user.displayName || 'حسابي'}</span>
        <i class="fa-solid fa-chevron-down text-xs mr-1 transition-transform group-hover:rotate-180"></i>
      </button>
      <div class="absolute left-0 mt-2 w-56 bg-white rounded-lg shadow-xl border invisible group-hover:visible opacity-0 group-hover:opacity-100 transition-all duration-200 z-50">
        <a href="account.html" class="block px-4 py-3 hover:bg-gray-50 border-b">
          <i class="fa-solid fa-id-card ml-2"></i> بيانات الحساب
        </a>
        <a href="orders.html" class="block px-4 py-3 hover:bg-gray-50 border-b">
          <i class="fa-solid fa-box ml-2"></i> طلباتي
        </a>
        <a href="returns.html" class="block px-4 py-3 hover:bg-gray-50 border-b">
          <i class="fa-solid fa-undo ml-2"></i> طلبات الاسترجاع
        </a>
        ${isAdmin ? `<a href="admin.html" class="block px-4 py-3 hover:bg-gray-50 border-b text-red-600 font-medium">
          <i class="fa-solid fa-gear ml-2"></i> لوحة التحكم
        </a>` : ''}
        <button onclick="logout()" class="w-full text-right px-4 py-3 hover:bg-gray-50 text-red-500 font-medium">
          <i class="fa-solid fa-right-from-bracket ml-2"></i> تسجيل الخروج
        </button>
      </div>
    </div>
  `;
}

window.logout = async () => {
  await auth.signOut();
  showToast('✅ تم تسجيل الخروج');
  setTimeout(() => window.location.href = 'index.html', 1000);
};

auth.onAuthStateChanged(async user => {
  document.getElementById('loading').classList.add('hidden');
  if (!user) {
    document.getElementById('no-login').classList.remove('hidden');
    return;
  }
  document.getElementById('content').classList.remove('hidden');
  updateUserNav(user);

  // تعبئة البيانات
  document.getElementById('u-name').value = user.displayName || '';
  document.getElementById('u-email').value = user.email || '';

  const doc = await db.collection('users').doc(user.uid).get();
  if (doc.exists) {
    const data = doc.data();
    document.getElementById('u-phone').value = data.phone || '';
    document.getElementById('u-address').value = data.address || '';
  }

  // حفظ البيانات
  document.getElementById('profile-form').addEventListener('submit', async e => {
    e.preventDefault();
    const name = document.getElementById('u-name').value.trim();
    const phone = document.getElementById('u-phone').value.trim();
    const address = document.getElementById('u-address').value.trim();

    await user.updateProfile({ displayName: name });
    await db.collection('users').doc(user.uid).set({
      name, phone, address, email: user.email
    }, { merge: true });

    showToast('✅ تم حفظ البيانات بنجاح');
    updateUserNav(user);
  });
});
</script>
</body>
</html>
