<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الطلبات - VAREN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; display: none; }
    .toast.show { display: block; }
    .toast.success { background: #16a34a; }
    .toast.error { background: #dc2626; }
    .status-new { background: #fef3c7; color: #92400e; }
    .status-confirmed { background: #d1fae5; color: #065f46; }
    .status-cancelled { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body class="bg-gray-50">
<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <a href="admin.html" class="text-2xl font-bold text-gray-900">VAREN</a>
    <a href="admin.html" class="text-sm text-gray-600 hover:text-black">
      <i class="fa-solid fa-arrow-right ml-1"></i> العودة للوحة التحكم
    </a>
  </div>
</nav>
<main class="max-w-7xl mx-auto px-4 py-8">
  <h1 class="text-2xl md:text-3xl font-bold mb-6 text-center">إدارة الطلبات</h1>
  <div id="toast" class="toast"></div>
  <div id="loading" class="text-center py-16">
    <i class="fa-solid fa-spinner fa-spin fa-2xl"></i>
    <p class="mt-2">جاري تحميل الطلبات...</p>
  </div>
  <div id="content" class="hidden">
    <div class="mb-4 flex justify-between items-center">
      <h2 class="text-lg font-semibold">جميع الطلبات</h2>
      <button onclick="loadOrders()" class="text-sm text-gray-600 hover:text-black">
        <i class="fa-solid fa-rotate-right ml-1"></i> تحديث
      </button>
    </div>
    <div id="orders-list" class="space-y-4"></div>
  </div>
  <div id="no-orders" class="hidden text-center py-16">
    <i class="fa-solid fa-inbox text-gray-300 text-6xl mb-4"></i>
    <p class="text-xl text-gray-500">لا توجد طلبات حتى الآن</p>
  </div>
  <div id="no-permission" class="hidden text-center py-16">
    <i class="fa-solid fa-lock text-gray-300 text-6xl mb-4"></i>
    <p class="text-xl text-gray-500">غير مسموح لك بالوصول لهذه الصفحة</p>
    <a href="index.html" class="bg-black text-white px-6 py-2 rounded-lg inline-block mt-2">العودة للرئيسية</a>
  </div>
</main>

<script>
// ✅ إعدادات المشروع الجديد
const firebaseConfig = {
  apiKey: "AIzaSyDQTvVXrLYgbkpNI_YfwdVpZrQFBIzzPmU",
  authDomain: "varen-5dcfd.firebaseapp.com",
  projectId: "varen-5dcfd",
  storageBucket: "varen-5dcfd.firebasestorage.app",
  messagingSenderId: "769663614271",
  appId: "1:769663614271:web:4b2b843f99a8d7a071678a",
  measurementId: "G-DNHBHJHDVX"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const ADMIN_EMAIL = 'y0892100@gmail.com';

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 4000);
}

function formatDate(timestamp) {
  if (!timestamp) return '';
  const d = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
  return d.toLocaleString('ar-AE');
}

function getStatusClass(status) {
  if (status === 'جديد') return 'status-new';
  if (status === 'مؤكد') return 'status-confirmed';
  if (status === 'ملغي') return 'status-cancelled';
  return 'bg-gray-100 text-gray-700';
}

async function loadOrders() {
  const list = document.getElementById('orders-list');
  list.innerHTML = '';
  
  try {
    const snap = await db.collection('orders').orderBy('createdAt', 'desc').limit(50).get();
    
    if (snap.empty) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('no-orders').classList.remove('hidden');
      return;
    }

    snap.forEach(doc => {
      const o = { id: doc.id, ...doc.data() };
      
      list.innerHTML += `
        <div class="bg-white rounded-xl shadow-sm border p-5">
          <div class="flex flex-wrap justify-between items-start gap-3 mb-4">
            <div>
              <h3 class="font-bold text-lg">${o.orderNumber || o.id}</h3>
              <p class="text-sm text-gray-500">${formatDate(o.createdAt)}</p>
            </div>
            <span class="px-3 py-1 rounded-full text-sm font-medium ${getStatusClass(o.status || 'جديد')}">
              ${o.status || 'جديد'}
            </span>
          </div>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4 text-sm">
            <div>
              <p class="font-semibold mb-1">العميل:</p>
              <p>${o.fullName || 'غير مذكور'}</p>
              <p>${o.phone || ''}</p>
              <p class="text-gray-500">${o.userEmail || ''}</p>
            </div>
            <div>
              <p class="font-semibold mb-1">العنوان:</p>
              <p>${o.address || 'غير مذكور'}</p>
              ${o.notes ? `<p class="text-orange-600 mt-1">ملاحظات: ${o.notes}</p>` : ''}
            </div>
          </div>
          
          <div class="border-t pt-3 mb-3">
            <p class="font-semibold mb-2">المنتجات:</p>
            <div class="text-sm space-y-1">
              ${(o.items || []).map(i => `
                <p>• ${i.name} — المقاس: ${i.size || '-'} — اللون: ${i.color || '-'} — الكمية: ${i.quantity} — ${i.price} درهم</p>
              `).join('')}
            </div>
          </div>
          
          <div class="flex flex-wrap justify-between items-center gap-3 pt-2 border-t">
            <p class="font-bold text-lg">المجموع: ${o.total?.toFixed(2) || '0.00'} درهم</p>
            <div class="flex gap-2">
              <select onchange="changeStatus('${o.id}', this.value)" class="border rounded-lg px-3 py-2 text-sm">
                <option value="جديد" ${o.status === 'جديد' ? 'selected' : ''}>جديد</option>
                <option value="مؤكد" ${o.status === 'مؤكد' ? 'selected' : ''}>مؤكد</option>
                <option value="ملغي" ${o.status === 'ملغي' ? 'selected' : ''}>ملغي</option>
              </select>
            </div>
          </div>
        </div>
      `;
    });

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');

  } catch (err) {
    console.error(err);
    document.getElementById('loading').innerHTML = `<p class="text-red-500">خطأ في تحميل الطلبات: ${err.message}</p>`;
  }
}

window.changeStatus = async function(orderId, newStatus) {
  try {
    await db.collection('orders').doc(orderId).update({ status: newStatus });
    showToast('✅ تم تحديث حالة الطلب');
  } catch (err) {
    console.error(err);
    showToast('❌ خطأ في التحديث', 'error');
  }
};

auth.onAuthStateChanged(user => {
  document.getElementById('loading').classList.add('hidden');
  
  if (!user || user.email !== ADMIN_EMAIL) {
    document.getElementById('no-permission').classList.remove('hidden');
    return;
  }
  
  document.getElementById('content').classList.remove('hidden');
  loadOrders();
});
</script>
</body>
</html>
