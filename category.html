<script>
// تحميل منتجات حسب القسم
async function loadProductsByCategory(gender, type, sectionTitle) {
  const grid = document.getElementById('products-grid');
  document.getElementById('section-title').textContent = sectionTitle;
  grid.innerHTML = '<p class="col-span-full text-center py-8"><i class="fa-solid fa-spinner fa-spin fa-xl"></i></p>';

  try {
    let query = db.collection('products').where('available', '!=', false);
    if (gender) query = query.where('gender', '==', gender);
    if (type) query = query.where('type', '==', type);
    
    const snap = await query.limit(20).get();
    grid.innerHTML = '';

    if (snap.empty) {
      grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-8">لا توجد منتجات في هذا القسم حالياً</p>';
      return;
    }

    snap.forEach(doc => {
      const p = { id: doc.id, ...doc.data() };
      const img = p.images?.[0] || 'https://via.placeholder.com/300x400';
      grid.innerHTML += `
        <a href="product.html?id=${p.id}" class="block bg-white rounded-xl shadow-sm overflow-hidden border hover:shadow-md transition-shadow">
          <img src="${img}" alt="${p.name}" class="w-full h-48 object-cover">
          <div class="p-3">
            <h3 class="font-bold text-sm mb-1">${p.name}</h3>
            <span class="font-semibold text-lg">${p.price} درهم</span>
          </div>
        </a>
      `;
    });
  } catch (err) {
    grid.innerHTML = `<p class="col-span-full text-center text-red-500">خطأ في التحميل: ${err.message}</p>`;
  }
}

// روابط الأقسام
document.addEventListener('click', e => {
  const link = e.target.closest('a[href^="#"]');
  if (!link) return;
  e.preventDefault();
  const hash = link.getAttribute('href').substring(1);

  const map = {
    'men-hoodies': { g: 'men', t: 'هودي', title: 'هودي رجالي' },
    'men-tshirts': { g: 'men', t: 'تيشيرت', title: 'تيشيرت رجالي' },
    'men-pants': { g: 'men', t: 'بناطيل', title: 'بناطيل رجالية' },
    'men-formal': { g: 'men', t: 'لبس رسمي', title: 'لبس رسمي رجالي' },
    'men-tracksuit': { g: 'men', t: 'ترينق', title: 'ترينق رجالي' },
    'men-underwear': { g: 'men', t: 'ملابس داخلية', title: 'ملابس داخلية رجالية' },
    'women-hoodies': { g: 'women', t: 'هودي', title: 'هودي نسائي' },
    'women-tshirts': { g: 'women', t: 'تيشيرت', title: 'تيشيرت نسائي' },
    'women-pants': { g: 'women', t: 'بناطيل', title: 'بناطيل نسائية' },
    'women-dresses': { g: 'women', t: 'فساتين', title: 'فساتين نسائية' },
    'women-tracksuit': { g: 'women', t: 'ترينق', title: 'ترينق نسائي' },
    'women-underwear': { g: 'women', t: 'ملابس داخلية', title: 'ملابس داخلية نسائية' },
    'kids-tshirts': { g: 'kids', t: 'تيشيرت', title: 'تيشيرت أطفال' },
    'kids-pants': { g: 'kids', t: 'بناطيل', title: 'بناطيل أطفال' },
    'kids-tracksuit': { g: 'kids', t: 'ترينق', title: 'ترينق أطفال' },
    'kids-underwear': { g: 'kids', t: 'ملابس داخلية', title: 'ملابس داخلية أطفال' },
  };

  if (map[hash]) {
    loadProductsByCategory(map[hash].g, map[hash].t, map[hash].title);
    document.getElementById('products-area').scrollIntoView({ behavior: 'smooth' });
  }
});
</script>
