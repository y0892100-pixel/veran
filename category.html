<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التصنيفات - VAREN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; display: none; }
    .toast.show { display: block; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .product-card { transition: all 0.3s ease; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import firebaseConfig from './firebase-config.js';
    import * as Store from './store.js';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    window.app = { auth, db, onAuthStateChanged, signOut, collection, getDocs, query, where };
    window.Store = Store;
  </script>
</head>
<body class="bg-gray-50 text-gray-800">

<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <a href="index.html" class="text-2xl font-bold text-gray-900">VAREN</a>
    <div class="hidden md:flex gap-8">
      <a href="index.html" class="font-medium hover:text-gray-600">الرئيسية</a>
      <a href="category.html?gender=women" class="font-medium hover:text-gray-600">نسائي</a>
      <a href="category.html?gender=men" class="font-medium hover:text-gray-600">رجالي</a>
      <a href="category.html?gender=girls" class="font-medium hover:text-gray-600">بنات</a>
      <a href="category.html?gender=boys" class="font-medium hover:text-gray-600">أولاد</a>
    </div>
    <div class="flex items-center gap-4">
      <a href="cart.html" class="text-xl relative">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
      </a>
      <div id="user-area"></div>
    </div>
  </div>
</nav>

<main class="max-w-7xl mx-auto px-4 py-8">
  <h1 id="category-title" class="text-2xl font-bold mb-8 text-center">المنتجات</h1>
  <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <div class="col-span-full text-center py-12 text-gray-500">
      <i class="fa-solid fa-spinner fa-spin fa-2xl mb-4"></i>
      <p>جاري تحميل المنتجات...</p>
    </div>
  </div>
</main>

<footer class="bg-gray-900 text-white py-8 text-center">
  <p>&copy; 2026 VAREN. جميع الحقوق محفوظة.</p>
</footer>

<div id="toast" class="toast"></div>

<script>
function getCategoryTitle(gender) {
  const map = { women: 'الملابس النسائية', men: 'الملابس الرجالية', girls: 'ملابس البنات', boys: 'ملابس الأولاد' };
  return map[gender] || 'المنتجات';
}

function updateUserUI(user) {
  const area = document.getElementById('user-area');
  if (user) {
    area.innerHTML = `<div class="flex items-center gap-2"><span class="text-sm">أهلاً بك</span><button onclick="logout()" class="text-sm text-red-500">خروج</button></div>`;
  } else {
    area.innerHTML = `<button onclick="location.href='admin.html'" class="bg-black text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-800">تسجيل الدخول</button>`;
  }
  window.Store.updateCartCount();
}

async function logout() { await window.app.signOut(window.app.auth); window.Store.showToast('تم الخروج'); }

async function loadProducts() {
  const params = new URLSearchParams(window.location.search);
  const gender = params.get('gender') || 'women';
  document.getElementById('category-title').textContent = getCategoryTitle(gender);
  const grid = document.getElementById('products-grid');
  try {
    const q = window.app.query(window.app.collection(window.app.db, 'products'), window.app.where('gender', '==', gender));
    const snapshot = await window.app.getDocs(q);
    if (snapshot.empty) {
      grid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500"><p>لا توجد منتجات في هذا القسم حالياً.</p></div>';
      return;
    }
    grid.innerHTML = '';
    snapshot.forEach(doc => {
      const p = { id: doc.id, ...doc.data() };
      const priceTag = p.priceOriginal ? `<span class="text-sm text-gray-400 line-through ml-2">${p.priceOriginal}درهم</span>` : '';
      const img = p.images?.[0] || 'https://via.placeholder.com/400x500?text=لا+صورة';
      grid.innerHTML += `
        <a href="product.html?id=${p.id}" class="product-card bg-white rounded-xl overflow-hidden shadow-sm block">
          <img src="${img}" alt="${p.name}" class="w-full h-64 object-cover">
          <div class="p-4">
            <h3 class="font-bold text-lg mb-1">${p.name}</h3>
            <p class="text-gray-600 text-sm mb-2">${p.type || ''}</p>
            <div class="flex items-center justify-between">
              <span class="font-bold text-lg">${p.price}درهم</span>
              ${priceTag}
            </div>
            <button class="mt-3 w-full bg-black text-white py-2 rounded-lg hover:bg-gray-800 text-sm">عرض التفاصيل</button>
          </div>
        </a>
      `;
    });
  } catch (err) {
    console.error(err);
    grid.innerHTML = `<div class="col-span-full text-center py-12 text-red-500"><p>خطأ في التحميل: ${err.message}</p></div>`;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  window.app.onAuthStateChanged(window.app.auth, updateUserUI);
  loadProducts();
});
</script>
</body>
</html>
