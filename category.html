function setLanguage(lang) {
  if (!translations[lang]) return;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  localStorage.setItem('varen_lang', lang);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (translations[lang][key]) el.textContent = translations[lang][key];
  });
  updateLangUI(lang);
  updatePageTitle();
}

function updateLangUI(lang) {
  document.querySelectorAll('.lang-option').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}

function getCurrentLanguage() {
  return localStorage.getItem('varen_lang') || 'ar';
}

function updatePageTitle() {
  const lang = getCurrentLanguage();
  const params = new URLSearchParams(window.location.search);
  const gender = params.get('gender');
  const tag = params.get('tag');
  let titleKey = 'all_products';
  if (gender === 'women') titleKey = 'women_products';
  else if (gender === 'men') titleKey = 'men_products';
  else if (gender === 'kids') titleKey = 'kids_products';
  else if (tag === 'offers') titleKey = 'offers_products';
  else if (tag === 'gifts') titleKey = 'gifts_products';
  document.getElementById('category-title').textContent = translations[lang][titleKey];
}

document.addEventListener('DOMContentLoaded', () => {
  setLanguage(getCurrentLanguage());
});

const auth = firebase.auth();
const db = firebase.firestore();

let currentGender = null;
let currentTag = null;
let searchQuery = '';
let selectedCategories = [];
let selectedSeasons = [];
let selectedStyles = [];
let selectedSizes = ['M'];
let selectedColors = ['black'];
let priceMin = null;
let priceMax = null;

function showToast(msg, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast show ${type}`;
  setTimeout(() => toast.classList.remove('show'), 4000);
}

function toggleSection(section) {
  const panel = document.getElementById(`${section}-filters`);
  const icon = panel.previousElementSibling.querySelector('i');
  panel.classList.toggle('open');
  icon.style.transform = panel.classList.contains('open') ? 'rotate(180deg)' : '';
}

function matchesSearch(product, query) {
  if (!query.trim()) return true;
  const q = query.toLowerCase().trim();
  const fields = [
    product.name, product.nameEn,
    product.type, product.season, product.style,
    product.description, product.descriptionEn
  ].filter(f => f);
  return fields.some(f => String(f).toLowerCase().includes(q));
}

function matchesCategory(product) {
  if (!selectedCategories.length) return true;
  const map = {
    hoodies: ['hoodies', 'هودي'],
    tshirts: ['tshirts', 'تيشيرت'],
    pants: ['pants', 'بناطيل'],
    formal: ['formal', 'لبس رسمي'],
    tracksuit: ['tracksuit', 'ترينق'],
    underwear: ['underwear', 'ملابس داخلية'],
    dresses: ['dresses', 'فساتين']
  };
  return selectedCategories.some(cat => map[cat]?.includes(product.type));
}

function matchesSeason(product) {
  if (!selectedSeasons.length) return true;
  return selectedSeasons.some(s => product.season === s || 
    (s === 'winter' && product.season === 'شتوي') ||
    (s === 'summer' && product.season === 'صيفي'));
}

function matchesStyle(product) {
  if (!selectedStyles.length) return true;
  return selectedStyles.some(s => product.style === s || 
    (s === 'simple' && product.style === 'ساده') ||
    (s === 'classic' && product.style === 'كلاسيكي') ||
    (s === 'modern' && product.style === 'عصري'));
}

function matchesPrice(product) {
  if (priceMin !== null && product.price < priceMin) return false;
  if (priceMax !== null && product.price > priceMax) return false;
  return true;
}

function matchesSizeColor(product) {
  const hasSize = !selectedSizes.length || 
    (product.sizes && selectedSizes.some(s => product.sizes.includes(s)));
  const hasColor = !selectedColors.length || 
    (product.colors && selectedColors.some(c => product.colors.includes(c)));
  return hasSize && hasColor;
}

function updateCartCount() {
  const cart = JSON.parse(localStorage.getItem('varen_cart_v1') || '[]');
  const countEl = document.getElementById('cart-count');
  if (countEl) {
    countEl.textContent = cart.reduce((sum, item) => sum + (item.qty || item.quantity || 1), 0);
  }
}

async function loadProducts() {
  const grid = document.getElementById('products-grid');
  const resultsInfo = document.getElementById('results-info');
  const lang = getCurrentLanguage();
  const currency = lang === 'ar' ? 'درهم' : 'AED';
  grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500"><i class="fa-solid fa-spinner fa-spin fa-2xl mb-4"></i><p>${translations[lang].loading_products}</p></div>`;
  resultsInfo.textContent = '';
  
  try {
    let query = db.collection('products').where('available', '!=', false);
    if (currentGender) query = query.where('gender', '==', currentGender);
    if (currentTag) query = query.where('tag', '==', currentTag);
    
    const snapshot = await query.get();
    let products = [];
    snapshot.forEach(doc => products.push({ id: doc.id, ...doc.data() }));
    
    // تطبيق كل الفلاتر والبحث
    products = products.filter(p => 
      matchesSearch(p, searchQuery) &&
      matchesCategory(p) &&
      matchesSeason(p) &&
      matchesStyle(p) &&
      matchesPrice(p) &&
      matchesSizeColor(p)
    );
    
    products.sort((a, b) => {
      const dateA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(0);
      const dateB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(0);
      return dateB - dateA;
    });
    
    resultsInfo.textContent = `${products.length} ${translations[lang].results_count}`;
    
    if (products.length === 0) {
      grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500"><p>${translations[lang].no_results}</p></div>`;
      return;
    }
    
    grid.innerHTML = '';
    products.forEach(p => {
      const priceTag = p.priceOriginal ? `<span class="text-sm text-gray-400 line-through ml-2">${p.priceOriginal} ${currency}</span>` : '';
      const img = p.images?.[0] || 'https://via.placeholder.com/400x500?text=No+Image';
      grid.innerHTML += `
        <a href="product.html?id=${p.id}" class="product-card bg-white rounded-xl overflow-hidden shadow-sm block">
          <img src="${img}" alt="${p.name}" class="w-full h-64 object-cover">
          <div class="p-4">
            <h3 class="font-bold text-lg mb-1">${p.name}</h3>
            <p class="text-gray-600 text-sm mb-2">${p.type || ''}${p.season ? ` · ${p.season === 'winter' ? 'شتوي' : p.season === 'summer' ? 'صيفي' : p.season}` : ''}</p>
            <div class="flex items-center justify-between">
              <span class="font-bold text-lg">${p.price} ${currency}</span>
              ${priceTag}
            </div>
          </div>
        </a>
      `;
    });
    
  } catch (err) {
    console.error(err);
    grid.innerHTML = `<div class="col-span-full text-center py-12 text-red-500"><p>${translations[lang].error_loading}: ${err.message}</p></div>`;
  }
}

function updateUserUI(user) {
  const loginBtn = document.getElementById('login-btn');
  const accountBtn = document.getElementById('account-btn');
  const accountMenu = document.getElementById('account-menu');
  const adminLink = document.getElementById('admin-nav-link');
  if (user) {
    if (loginBtn) loginBtn.classList.add('hidden');
    if (accountBtn) { accountBtn.classList.remove('hidden'); accountBtn.classList.add('flex'); }
    if (user.email === ADMIN_EMAIL) adminLink?.classList.remove('hidden');
    else adminLink?.classList.add('hidden');
  } else {
    loginBtn?.classList.remove('hidden');
    accountBtn?.classList.add('hidden');
    accountMenu?.classList.add('hidden');
    adminLink?.classList.add('hidden');
  }
  updateCartCount();
}

window.logout = async function () {
  await auth.signOut();
  showToast(getCurrentLanguage() === 'ar' ? '✅ تم تسجيل الخروج' : '✅ Logged out successfully');
  setTimeout(() => window.location.href = 'index.html', 1000);
};

function resetAllFilters() {
  searchQuery = '';
  selectedCategories = [];
  selectedSeasons = [];
  selectedStyles = [];
  selectedSizes = ['M'];
  selectedColors = ['black'];
  priceMin = null;
  priceMax = null;
  document.getElementById('search-input').value = '';
  document.getElementById('price-min').value = '';
  document.getElementById('price-max').value = '';
  document.querySelectorAll('.category-check, .season-check, .style-check').forEach(cb => cb.checked = false);
  document.querySelectorAll('.size-tag').forEach(b => b.classList.toggle('active', b.dataset.size === 'M'));
  document.querySelectorAll('.color-tag').forEach(b => b.classList.toggle('active', b.dataset.color === 'black'));
  loadProducts();
}

document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  currentGender = params.get('gender');
  currentTag = params.get('tag');
  
  // فتح كل الأقسام بشكل افتراضي
  ['category', 'season', 'style', 'price', 'size', 'color'].forEach(toggleSection);
  
  // تبديل الأقسام
  document.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', () => toggleSection(btn.dataset.toggle));
  });
  
  // البحث
  const searchInput = document.getElementById('search-input');
  searchInput.addEventListener('input', e => {
    searchQuery = e.target.value;
    clearTimeout(window.searchTimer);
    window.searchTimer = setTimeout(loadProducts, 400);
  });
  document.getElementById('search-btn').addEventListener('click', loadProducts);
  
  // تحديث قوائم الاختيار عند التغيير
  document.querySelectorAll('.category-check').forEach(cb => {
    cb.addEventListener('change', () => {
      selectedCategories = Array.from(document.querySelectorAll('.category-check:checked')).map(c => c.value);
    });
  });
  document.querySelectorAll('.season-check').forEach(cb => {
    cb.addEventListener('change', () => {
      selectedSeasons = Array.from(document.querySelectorAll('.season-check:checked')).map(c => c.value);
    });
  });
  document.querySelectorAll('.style-check').forEach(cb => {
    cb.addEventListener('change', () => {
      selectedStyles = Array.from(document.querySelectorAll('.style-check:checked')).map(c => c.value);
    });
  });
  
  // المقاسات
  document.querySelectorAll('.size-tag').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.classList.toggle('active');
      selectedSizes = Array.from(document.querySelectorAll('.size-tag.active')).map(b => b.dataset.size);
    });
  });
  
  // الألوان
  document.querySelectorAll('.color-tag').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.classList.toggle('active');
      selectedColors = Array.from(document.querySelectorAll('.color-tag.active')).map(b => b.dataset.color);
    });
  });
  
  // تطبيق ومسح
  document.getElementById('apply-all').addEventListener('click', () => {
    priceMin = document.getElementById('price-min').value ? Number(document.getElementById('price-min').value) : null;
    priceMax = document.getElementById('price-max').value ? Number(document.getElementById('price-max').value) : null;
    loadProducts();
  });
  document.getElementById('reset-all').addEventListener('click', resetAllFilters);
  
  auth.onAuthStateChanged(updateUserUI);
  updateCartCount();
  setTimeout(loadProducts, 100);
});
</script>
