<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأقسام - VAREN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- ✅ مكتبات Firebase متوافقة وموحّدة -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; display: none; }
    .toast.show { display: block; }
    .toast.success { background: #16a34a; }
    .toast.error { background: #dc2626; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .product-card { transition: all 0.3s ease; }
    .filter-btn.active { background: black; color: white; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">
<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <a href="index.html" class="text-2xl font-bold text-gray-900">VAREN</a>
    <div class="hidden md:flex gap-8">
      <a href="index.html" class="font-medium hover:text-gray-600">الرئيسية</a>
      <a href="category.html?gender=women" class="font-medium hover:text-gray-600">نسائي</a>
      <a href="category.html?gender=men" class="font-medium hover:text-gray-600">رجالي</a>
      <a href="category.html?gender=girls" class="font-medium hover:text-gray-600">بنات</a>
      <a href="category.html?gender=boys" class="font-medium hover:text-gray-600">أولاد</a>
      <a href="admin.html" class="font-medium text-sm text-gray-500 hover:text-black">لوحة التحكم</a>
    </div>
    <div class="flex items-center gap-4">
      <a href="cart.html" class="text-xl relative">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
      </a>
      <div id="user-area" class="relative">
        <button id="account-btn" class="hidden items-center gap-1 font-medium hover:text-gray-600">
          حسابي <i class="fa-solid fa-chevron-down text-xs"></i>
        </button>
        <button id="login-btn" onclick="location.href='login.html'" class="bg-black text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-800">تسجيل الدخول</button>
        <div id="account-menu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border z-50">
          <a href="account.html" class="block px-4 py-3 hover:bg-gray-100">معلوماتي</a>
          <a href="orders.html" class="block px-4 py-3 hover:bg-gray-100">طلباتي</a>
          <a href="returns.html" class="block px-4 py-3 hover:bg-gray-100">الاسترجاع</a>
          <button onclick="logout()" class="w-full text-right px-4 py-3 text-red-500 hover:bg-gray-100">تسجيل الخروج</button>
        </div>
      </div>
    </div>
  </div>
</nav>
<main class="max-w-7xl mx-auto px-4 py-8">
  <h1 id="category-title" class="text-2xl md:text-3xl font-bold mb-8 text-center">جميع المنتجات</h1>
  <!-- فلاتر -->
  <div class="mb-8 flex flex-wrap justify-center gap-3">
    <button class="filter-btn px-4 py-2 border rounded-lg hover:bg-gray-100 active" data-filter="all">الكل</button>
    <button class="filter-btn px-4 py-2 border rounded-lg hover:bg-gray-100" data-filter="hoodies">هودي</button>
    <button class="filter-btn px-4 py-2 border rounded-lg hover:bg-gray-100" data-filter="tshirts">تيشيرت</button>
    <button class="filter-btn px-4 py-2 border rounded-lg hover:bg-gray-100" data-filter="winter">شتوي</button>
    <button class="filter-btn px-4 py-2 border rounded-lg hover:bg-gray-100" data-filter="summer">صيفي</button>
  </div>
  <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <div class="col-span-full text-center py-12 text-gray-500">
      <i class="fa-solid fa-spinner fa-spin fa-2xl mb-4"></i>
      <p>جاري تحميل المنتجات...</p>
    </div>
  </div>
</main>
<footer class="bg-gray-900 text-white py-8 text-center">
  <p>&copy; 2026 VAREN. جميع الحقوق محفوظة.</p>
</footer>
<div id="toast" class="toast"></div>

<script>
// ✅ إعدادات المشروع الجديد
const firebaseConfig = {
  apiKey: "AIzaSyDQTvVXrLYgbkpNI_YfwdVpZrQFBIzzPmU",
  authDomain: "varen-5dcfd.firebaseapp.com",
  projectId: "varen-5dcfd",
  storageBucket: "varen-5dcfd.firebasestorage.app",
  messagingSenderId: "769663614271",
  appId: "1:769663614271:web:4b2b843f99a8d7a071678a",
  measurementId: "G-DNHBHJHDVX"
};

// ✅ تهيئة Firebase
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const auth = firebase.auth();
const db = firebase.firestore();

let currentGender = null;
let currentFilter = 'all';
const toast = document.getElementById('toast');

function showToast(msg, type = 'success') {
  toast.textContent = msg;
  toast.className = `toast show ${type}`;
  setTimeout(() => toast.classList.remove('show'), 4000);
}

function setCategoryTitle(gender) {
  const titles = {
    women: 'المنتجات النسائية',
    men: 'المنتجات الرجالية',
    girls: 'منتجات البنات',
    boys: 'منتجات الأولاد'
  };
  document.getElementById('category-title').textContent = titles[gender] || 'جميع المنتجات';
}

function matchesFilter(product, filter) {
  if (filter === 'all') return true;
  if (filter === 'hoodies') return product.type === 'hoodies' || product.type === 'هودي';
  if (filter === 'tshirts') return product.type === 'tshirts' || product.type === 'تيشيرت';
  if (filter === 'winter') return product.season === 'winter' || product.season === 'شتوي';
  if (filter === 'summer') return product.season === 'summer' || product.season === 'صيفي';
  return false;
}

// ✅ تحديث عداد السلة
function updateCartCount() {
  const cart = JSON.parse(localStorage.getItem('varen_cart') || '[]');
  const countEl = document.getElementById('cart-count');
  if (countEl) {
    const total = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
    countEl.textContent = total;
  }
}

// ✅ تحميل المنتجات بدون فهارس
async function loadProducts() {
  const grid = document.getElementById('products-grid');
  grid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500"><i class="fa-solid fa-spinner fa-spin fa-2xl mb-4"></i><p>جاري تحميل المنتجات...</p></div>';
  
  try {
    // نجلب الكل ثم نفلتر في الكود
    let snapshot;
    if (currentGender) {
      snapshot = await db.collection('products').where('gender', '==', currentGender).get();
    } else {
      snapshot = await db.collection('products').get();
    }

    let products = [];
    snapshot.forEach(doc => {
      const p = { id: doc.id, ...doc.data() };
      // نعرض المتوفر فقط
      if (p.available !== false) {
        products.push(p);
      }
    });

    // نفلتر حسب النوع والموسم
    if (currentFilter !== 'all') {
      products = products.filter(p => matchesFilter(p, currentFilter));
    }

    // نرتب من الأحدث للأقدم
    products.sort((a, b) => {
      const dateA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(0);
      const dateB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(0);
      return dateB - dateA;
    });

    if (products.length === 0) {
      grid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500"><p>لا توجد منتجات في هذا القسم حالياً</p></div>';
      return;
    }

    grid.innerHTML = '';
    products.forEach(p => {
      const priceTag = p.priceOriginal ? `<span class="text-sm text-gray-400 line-through ml-2">${p.priceOriginal} درهم</span>` : '';
      const img = p.images?.[0] || 'https://via.placeholder.com/400x500?text=لا+صورة';
      grid.innerHTML += `
        <a href="product.html?id=${p.id}" class="product-card bg-white rounded-xl overflow-hidden shadow-sm block">
          <img src="${img}" alt="${p.name}" class="w-full h-64 object-cover">
          <div class="p-4">
            <h3 class="font-bold text-lg mb-1">${p.name}</h3>
            <p class="text-gray-600 text-sm mb-2">${p.type || ''}</p>
            <div class="flex items-center justify-between">
              <span class="font-bold text-lg">${p.price} درهم</span>
              ${priceTag}
            </div>
          </div>
        </a>
      `;
    });

  } catch (err) {
    console.error(err);
    grid.innerHTML = `<div class="col-span-full text-center py-12 text-red-500"><p>خطأ في تحميل المنتجات: ${err.message}</p></div>`;
  }
}

// ✅ تحديث واجهة المستخدم
function updateUserUI(user) {
  const loginBtn = document.getElementById('login-btn');
  const accountBtn = document.getElementById('account-btn');
  const accountMenu = document.getElementById('account-menu');

  if (user) {
    if (loginBtn) loginBtn.classList.add('hidden');
    if (accountBtn) { accountBtn.classList.remove('hidden'); accountBtn.classList.add('flex'); }
  } else {
    if (loginBtn) loginBtn.classList.remove('hidden');
    if (accountBtn) accountBtn.classList.add('hidden');
    if (accountMenu) accountMenu.classList.add('hidden');
  }
  updateCartCount();
}

// ✅ تسجيل الخروج
window.logout = async function () {
  await auth.signOut();
  window.location.href = 'index.html';
};

// ✅ فتح وإغلاق قائمة الحساب
const accountBtn = document.getElementById('account-btn');
const accountMenu = document.getElementById('account-menu');
if (accountBtn && accountMenu) {
  accountBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    accountMenu.classList.toggle('hidden');
  });
  document.addEventListener('click', () => accountMenu.classList.add('hidden'));
  accountMenu.addEventListener('click', (e) => e.stopPropagation());
}

// ✅ عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  currentGender = params.get('gender');
  setCategoryTitle(currentGender);

  // أزرار الفلتر
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      loadProducts();
    });
  });

  // مراقبة حالة تسجيل الدخول
  auth.onAuthStateChanged(updateUserUI);

  // تحميل السلة
  updateCartCount();

  // تحميل المنتجات
  loadProducts();
});
</script>
</body>
</html>
