<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - VAREN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; display: none; }
    .toast.show { display: block; }
    .toast.success { background: #16a34a; }
    .toast.error { background: #dc2626; }
    .step { display: none; }
    .step.active { display: block; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex items-center justify-center">
<main class="w-full max-w-md px-4 py-8">
  <a href="index.html" class="block text-center text-2xl font-bold text-gray-900 mb-8">VAREN</a>
  <div id="toast" class="toast"></div>
  <div id="step-auth-type" class="step active bg-white p-8 rounded-xl shadow-md">
    <h2 class="text-2xl font-bold text-center mb-6">أهلاً بك</h2>
    
    <button onclick="handleGoogleLogin()" class="w-full flex items-center justify-center gap-2 border border-gray-300 py-3 rounded-lg mb-4 hover:bg-gray-50">
      <i class="fa-brands fa-google text-red-500 text-xl"></i>
      <span>تسجيل الدخول بقوقل</span>
    </button>
    
    <div class="flex items-center gap-4 my-4"><hr class="flex-1"><span>أو</span><hr class="flex-1"></div>
    
    <button onclick="showStep('step-login')" class="w-full bg-black text-white py-3 rounded-lg mb-3 hover:bg-gray-800">تسجيل الدخول بالإيميل</button>
    <button onclick="showStep('step-register')" class="w-full border-2 border-black text-black py-3 rounded-lg hover:bg-gray-50">إنشاء حساب جديد</button>
  </div>
  <div id="step-login" class="step bg-white p-8 rounded-xl shadow-md">
    <button onclick="showStep('step-auth-type')" class="text-gray-500 mb-4">&larr; رجوع</button>
    <h2 class="text-2xl font-bold text-center mb-6">تسجيل الدخول</h2>
    <input type="email" id="login-email" placeholder="الإيميل" class="w-full border rounded-lg p-3 mb-3">
    <input type="password" id="login-password" placeholder="كلمة المرور" class="w-full border rounded-lg p-3 mb-4">
    <button onclick="handleLogin()" class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800">دخول</button>
    <p class="text-center mt-4 text-sm">ليس لديك حساب؟ <button onclick="showStep('step-register')" class="text-black font-semibold">إنشاء حساب</button></p>
  </div>
  <div id="step-register" class="step bg-white p-8 rounded-xl shadow-md">
    <button onclick="showStep('step-auth-type')" class="text-gray-500 mb-4">&larr; رجوع</button>
    <h2 class="text-2xl font-bold text-center mb-6">إنشاء حساب جديد</h2>
    <input type="text" id="reg-name" placeholder="الاسم الكامل" class="w-full border rounded-lg p-3 mb-3">
    <input type="email" id="reg-email" placeholder="الإيميل" class="w-full border rounded-lg p-3 mb-3">
    <input type="password" id="reg-password" placeholder="كلمة المرور (6 أحرف على الأقل)" class="w-full border rounded-lg p-3 mb-4">
    <button onclick="handleRegister()" class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800">إنشاء الحساب</button>
    <p class="text-center mt-4 text-sm">لديك حساب؟ <button onclick="showStep('step-login')" class="text-black font-semibold">تسجيل الدخول</button></p>
  </div>
</main>

<script>
// ✅ إعدادات المشروع الجديد
const firebaseConfig = {
  apiKey: "AIzaSyCXYzZgFIFU2u6R02_ConvSonD9SJRWS9Q",
  authDomain: "varen-f7756.firebaseapp.com",
  projectId: "varen-f7756",
  storageBucket: "varen-f7756.firebasestorage.app",
  messagingSenderId: "648684291842",
  appId: "1:648684291842:web:f3e806fc76a6e119caa41b",
  measurementId: "G-SV7DKGPH2M"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const auth = firebase.auth();
const db = firebase.firestore();
const ADMIN_EMAIL = 'y0892100@gmail.com';
const googleProvider = new firebase.auth.GoogleAuthProvider();

let isProcessing = false;

function showToast(msg, type='success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast ${type} show`;
  setTimeout(() => toast.classList.remove('show'), 4000);
}

function showStep(stepId) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(stepId).classList.add('active');
}

function redirectAfterLogin(user) {
  if (user.email === ADMIN_EMAIL) {
    window.location.href = 'admin.html';
  } else {
    window.location.href = 'index.html';
  }
}

async function handleGoogleLogin() {
  if (isProcessing) return;
  isProcessing = true;
  
  try {
    const result = await auth.signInWithPopup(googleProvider);
    const user = result.user;
    
    const userRef = db.collection('users').doc(user.uid);
    const doc = await userRef.get();
    if (!doc.exists) {
      await userRef.set({
        name: user.displayName || 'مستخدم',
        email: user.email,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    showToast('✅ تم تسجيل الدخول بنجاح!');
    setTimeout(() => redirectAfterLogin(user), 1000);
  } catch (err) {
    console.error(err);
    let msg = 'فشل تسجيل الدخول';
    if (err.code === 'auth/cancelled-popup-request' || err.code === 'auth/popup-closed-by-user') {
      msg = 'تم إغلاق النافذة، حاول مرة أخرى';
    } else if (err.code === 'auth/unauthorized-domain') {
      msg = 'النطاق غير مسموح به! أضفه في إعدادات Firebase ← المصادقة ← النطاقات المصرح بها';
    }
    showToast(msg, 'error');
  } finally {
    isProcessing = false;
  }
}

async function handleRegister() {
  if (isProcessing) return;
  isProcessing = true;
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  if (!name || !email || password.length < 6) {
    isProcessing = false;
    return showToast('املأ جميع الحقول وكلمة المرور 6 أحرف على الأقل', 'error');
  }
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await cred.user.updateProfile({ displayName: name });
    await db.collection('users').doc(cred.user.uid).set({
      name, 
      email, 
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    showToast('✅ تم إنشاء الحساب!');
    setTimeout(() => redirectAfterLogin(cred.user), 1500);
  } catch (err) {
    console.error(err);
    let msg = 'حدث خطأ';
    if (err.code === 'auth/email-already-in-use') msg = 'هذا الإيميل مستخدم بالفعل! سجّل دخول مباشرة';
    if (err.code === 'auth/invalid-email') msg = 'الإيميل غير صالح';
    if (err.code === 'auth/weak-password') msg = 'كلمة المرور ضعيفة (6 أحرف على الأقل)';
    showToast(msg, 'error');
  } finally {
    isProcessing = false;
  }
}

async function handleLogin() {
  if (isProcessing) return;
  isProcessing = true;
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) {
    isProcessing = false;
    return showToast('أدخل الإيميل وكلمة المرور', 'error');
  }
  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    showToast('✅ تم تسجيل الدخول');
    setTimeout(() => redirectAfterLogin(cred.user), 1000);
  } catch (err) {
    console.error(err);
    let msg = 'خطأ في تسجيل الدخول';
    if (err.code === 'auth/user-not-found') msg = 'لا يوجد حساب بهذا الإيميل! أنشئ حساباً أولاً';
    if (err.code === 'auth/wrong-password') msg = 'كلمة المرور غير صحيحة';
    if (err.code === 'auth/invalid-email') msg = 'الإيميل غير صالح';
    showToast(msg, 'error');
  } finally {
    isProcessing = false;
  }
}
</script>
</body>
</html>
