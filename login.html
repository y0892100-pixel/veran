<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="page_title">تسجيل الدخول - VAREN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/jpeg" href="https://i.imgur.com/QXFR5XO.jpeg">
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    html[lang="en"] { direction: ltr; }
    html[lang="en"] * { font-family: 'Cairo', sans-serif; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; display: none; }
    .toast.show { display: block; }
    .toast.success { background: #16a34a; }
    .toast.error { background: #dc2626; }
    .step { display: none; }
    .step.active { display: block; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex items-center justify-center">

<script>
const translations = {

    page_title: "تسجيل الدخول - VAREN",
    welcome: "أهلاً بك",
    login_with_google: "تسجيل الدخول بقوقل",

    unauthorized_domain: "النطاق غير مسموح به! أضفه في إعدادات Firebase ← المصادقة ← النطاقات المصرح بها",
    fill_all_fields: "املأ جميع الحقول وكلمة المرور 6 أحرف على الأقل",
    email_exists: "هذا الإيميل مستخدم بالفعل! سجّل دخول مباشرة",
    invalid_email: "الإيميل غير صالح",

    wrong_password: "كلمة المرور غير صحيحة",

  en: {
    page_title: "Sign In - VAREN",
    welcome: "Welcome",
    login_with_google: "Sign in with Google",
    or: "or",
    login_with_email: "Sign in with Email",
    create_account: "Create New Account",
    login_title: "Sign In",
    email: "Email",
    password: "Password",
    enter: "Sign In",
    no_account: "Don't have an account?",
    have_account: "Already have an account?",

    full_name: "Full Name",
    password_hint: "Password (at least 6 characters)",
    create: "Create Account",
    back: "Back",
    login_success: "✅ Signed in successfully!",
    account_created: "✅ Account created!",
    login_failed: "Sign in failed",
    popup_closed: "Popup closed by user, please try again",
    unauthorized_domain: "Unauthorized domain! Add it in Firebase Console → Authentication → Authorized Domains",
    fill_all_fields: "Fill in all fields and use at least 6 characters for password",
    email_exists: "This email is already registered! Sign in directly",
    invalid_email: "Invalid email address",
    weak_password: "Password is too weak (min 6 characters required)",
    enter_email_password: "Enter your email and password",
    user_not_found: "No account found with this email! Create one first",
    wrong_password: "Incorrect password",
    error_occurred: "An error occurred"
  }
};

function setLanguage(lang) {
  if (!translations[lang]) return;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  localStorage.setItem('varen_lang', lang);
}

function getCurrentLanguage() {
  return localStorage.getItem('varen_lang') || 'ar';
}

function t(key) {
  return translations[getCurrentLanguage()][key] || key;
}

document.addEventListener('DOMContentLoaded', () => {
  setLanguage(getCurrentLanguage());
});
</script>

<main class="w-full max-w-md px-4 py-8">
  <a href="index.html" class="block text-center mb-6">
    <span class="text-3xl md:text-4xl font-black text-gray-900 tracking-tight">VAREN</span>
  </a>
  
  <div id="toast" class="toast"></div>

  <!-- الخطوة 1: اختيار طريقة تسجيل الدخول -->
  <div id="step-auth-type" class="step active bg-white p-8 rounded-xl shadow-md">
    <h2 class="text-2xl font-bold text-center mb-6" data-i18n="welcome">أهلاً بك</h2>
    
    <button onclick="handleGoogleLogin()" class="w-full flex items-center justify-center gap-2 border border-gray-300 py-3 rounded-lg mb-4 hover:bg-gray-50">
      <i class="fa-brands fa-google text-red-500 text-xl"></i>
      <span data-i18n="login_with_google">تسجيل الدخول بقوقل</span>
    </button>
    
    <div class="flex items-center gap-4 my-4"><hr class="flex-1"><span data-i18n="or">أو</span><hr class="flex-1"></div>
    
    <button onclick="showStep('step-login')" class="w-full bg-black text-white py-3 rounded-lg mb-3 hover:bg-gray-800" data-i18n="login_with_email">تسجيل الدخول بالإيميل</button>
    <button onclick="showStep('step-register')" class="w-full border-2 border-black text-black py-3 rounded-lg hover:bg-gray-50" data-i18n="create_account">إنشاء حساب جديد</button>
  </div>

  <!-- الخطوة 2: تسجيل الدخول بالإيميل -->
  <div id="step-login" class="step bg-white p-8 rounded-xl shadow-md">
    <button onclick="showStep('step-auth-type')" class="text-gray-500 mb-4">&larr; <span data-i18n="back">رجوع</span></button>
    <h2 class="text-2xl font-bold text-center mb-6" data-i18n="login_title">تسجيل الدخول</h2>
    <input type="email" id="login-email" data-i18n-placeholder="email" placeholder="الإيميل" class="w-full border rounded-lg p-3 mb-3">
    <input type="password" id="login-password" data-i18n-placeholder="password" placeholder="كلمة المرور" class="w-full border rounded-lg p-3 mb-4">
    <button onclick="handleLogin()" class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800" data-i18n="enter">دخول</button>
    <p class="text-center mt-4 text-sm">
      <span data-i18n="no_account">ليس لديك حساب؟</span>
      <button onclick="showStep('step-register')" class="text-black font-semibold ml-1" data-i18n="create_account">إنشاء حساب</button>
    </p>
  </div>

  <!-- الخطوة 3: إنشاء حساب جديد -->
  <div id="step-register" class="step bg-white p-8 rounded-xl shadow-md">
    <button onclick="showStep('step-auth-type')" class="text-gray-500 mb-4">&larr; <span data-i18n="back">رجوع</span></button>
    <h2 class="text-2xl font-bold text-center mb-6" data-i18n="register_title">إنشاء حساب جديد</h2>
    <input type="text" id="reg-name" data-i18n-placeholder="full_name" placeholder="الاسم الكامل" class="w-full border rounded-lg p-3 mb-3">
    <input type="email" id="reg-email" data-i18n-placeholder="email" placeholder="الإيميل" class="w-full border rounded-lg p-3 mb-3">
    <input type="password" id="reg-password" data-i18n-placeholder="password_hint" placeholder="كلمة المرور (6 أحرف على الأقل)" class="w-full border rounded-lg p-3 mb-4">
    <button onclick="handleRegister()" class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800" data-i18n="create">إنشاء الحساب</button>
    <p class="text-center mt-4 text-sm">
      <span data-i18n="have_account">لديك حساب؟</span>
      <button onclick="showStep('step-login')" class="text-black font-semibold ml-1" data-i18n="login_title">تسجيل الدخول</button>
    </p>
  </div>
</main>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCXYzZgFIFU2u6R02_ConvSonD9SJRWS9Q",
  authDomain: "varen-f7756.firebaseapp.com",
  projectId: "varen-f7756",
  storageBucket: "varen-f7756.firebasestorage.app",
  messagingSenderId: "648684291842",
  appId: "1:648684291842:web:f3e806fc76a6e119caa41b",
  measurementId: "G-SV7DKGPH2M"
};
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const auth = firebase.auth();
const db = firebase.firestore();
const ADMIN_EMAIL = 'y0892100@gmail.com';
const googleProvider = new firebase.auth.GoogleAuthProvider();
let isProcessing = false;

function showToast(msg, type='success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast ${type} show`;
  setTimeout(() => toast.classList.remove('show'), 4000);
}

function showStep(stepId) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(stepId).classList.add('active');
}

function redirectAfterLogin(user) {
  if (user.email === ADMIN_EMAIL) {
    window.location.href = 'admin.html';
  } else {
    window.location.href = 'index.html';
  }
}

async function handleGoogleLogin() {
  if (isProcessing) return;
  isProcessing = true;
  
  try {
    const result = await auth.signInWithPopup(googleProvider);
    const user = result.user;
    
    const userRef = db.collection('users').doc(user.uid);
    const doc = await userRef.get();
    if (!doc.exists) {
      await userRef.set({
        name: user.displayName || (getCurrentLanguage() === 'ar' ? 'مستخدم' : 'User'),
        email: user.email,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    showToast(t('login_success'));
    setTimeout(() => redirectAfterLogin(user), 1000);
  } catch (err) {
    console.error(err);
    let msg = t('login_failed');
    if (err.code === 'auth/cancelled-popup-request' || err.code === 'auth/popup-closed-by-user') {
      msg = t('popup_closed');
    } else if (err.code === 'auth/unauthorized-domain') {
      msg = t('unauthorized_domain');
    }
    showToast(msg, 'error');
  } finally {
    isProcessing = false;
  }
}

async function handleRegister() {
  if (isProcessing) return;
  isProcessing = true;
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  
  if (!name || !email || password.length < 6) {
    isProcessing = false;
    return showToast(t('fill_all_fields'), 'error');
  }
  
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await cred.user.updateProfile({ displayName: name });
    await db.collection('users').doc(cred.user.uid).set({
      name, 
      email, 
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    showToast(t('account_created'));
    setTimeout(() => redirectAfterLogin(cred.user), 1500);
  } catch (err) {
    console.error(err);
    let msg = t('error_occurred');
    if (err.code === 'auth/email-already-in-use') msg = t('email_exists');
    else if (err.code === 'auth/invalid-email') msg = t('invalid_email');
    else if (err.code === 'auth/weak-password') msg = t('weak_password');
    showToast(msg, 'error');
  } finally {
    isProcessing = false;
  }
}

async function handleLogin() {
  if (isProcessing) return;
  isProcessing = true;
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  
  if (!email || !password) {
    isProcessing = false;
    return showToast(t('enter_email_password'), 'error');
  }
  
  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    showToast(t('login_success'));
    setTimeout(() => redirectAfterLogin(cred.user), 1000);
  } catch (err) {
    console.error(err);
    let msg = t('error_occurred');
    if (err.code === 'auth/user-not-found') msg = t('user_not_found');
    else if (err.code === 'auth/wrong-password') msg = t('wrong_password');
    else if (err.code === 'auth/invalid-email') msg = t('invalid_email');
    showToast(msg, 'error');
  } finally {
    isProcessing = false;
  }
}
</script>

</body>
</html>
