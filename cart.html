<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سلة التسوق - VAREN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; display: none; }
    .toast.show { display: block; }
    .toast.success { background: #16a34a; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <a href="index.html" class="text-2xl font-bold text-gray-900">VAREN</a>
    <a href="index.html" class="text-sm text-gray-600 hover:text-black">
      <i class="fa-solid fa-arrow-right ml-1"></i> متابعة التسوق
    </a>
  </div>
</nav>

<main class="max-w-3xl mx-auto px-4 py-8">
  <h1 class="text-2xl md:text-3xl font-bold mb-6 text-center">سلة التسوق</h1>
  <div id="toast" class="toast"></div>

  <div id="empty-cart" class="hidden text-center py-16">
    <i class="fa-solid fa-cart-shopping text-gray-300 text-6xl mb-4"></i>
    <h2 class="text-xl font-bold text-gray-500 mb-2">السلة فارغة</h2>
    <p class="text-gray-400 mb-6">أضف منتجات للسلة أولاً</p>
    <a href="index.html" class="bg-black text-white px-6 py-2 rounded-lg inline-block hover:bg-gray-800">التصفح</a>
  </div>

  <div id="cart-content">
    <div id="cart-items" class="space-y-4 mb-8"></div>
    <div class="bg-white rounded-xl shadow-sm p-6">
      <div class="flex justify-between text-lg mb-2">
        <span>المجموع الفرعي:</span>
        <span id="subtotal">0.00 درهم</span>
      </div>
      <div class="flex justify-between text-lg font-bold border-t pt-3 mb-4">
        <span>المجموع الكلي:</span>
        <span id="total">0.00 درهم</span>
      </div>
      <a href="checkout.html" id="checkout-link" class="block w-full bg-black text-white text-center py-3 rounded-lg font-semibold hover:bg-gray-800">
        متابعة الدفع <i class="fa-solid fa-arrow-left ml-1"></i>
      </a>
    </div>
  </div>
</main>

<script>
function showToast(msg, type='success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast ${type} show`;
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function getCart() {
  return JSON.parse(localStorage.getItem('varen_cart') || '[]');
}

function saveCart(cart) {
  localStorage.setItem('varen_cart', JSON.stringify(cart));
  renderCart();
}

function removeItem(index) {
  const cart = getCart();
  cart.splice(index, 1);
  saveCart(cart);
  showToast('تم حذف المنتج من السلة');
}

function changeQty(index, delta) {
  const cart = getCart();
  cart[index].quantity = Math.max(1, cart[index].quantity + delta);
  saveCart(cart);
}

function renderCart() {
  const cart = getCart();
  const emptyState = document.getElementById('empty-cart');
  const content = document.getElementById('cart-content');
  const itemsCont = document.getElementById('cart-items');

  if (cart.length === 0) {
    emptyState.classList.remove('hidden');
    content.classList.add('hidden');
    return;
  }

  emptyState.classList.add('hidden');
  content.classList.remove('hidden');
  itemsCont.innerHTML = '';
  let total = 0;

  cart.forEach((item, index) => {
    const subtotal = item.price * item.quantity;
    total += subtotal;
    itemsCont.innerHTML += `
      <div class="bg-white rounded-xl shadow-sm p-4 flex items-center gap-4">
        <img src="${item.image || 'https://via.placeholder.com/100x100'}" alt="${item.name}" class="w-20 h-20 object-cover rounded-lg">
        <div class="flex-1">
          <h3 class="font-bold text-lg">${item.name}</h3>
          <p class="text-sm text-gray-600">المقاس: ${item.size} | اللون: ${item.color}</p>
          <p class="font-semibold mt-1">${item.price} درهم</p>
        </div>
        <div class="flex flex-col items-center gap-1">
          <button onclick="changeQty(${index}, 1)" class="w-8 h-8 border rounded flex items-center justify-center hover:bg-gray-100">+</button>
          <span class="font-medium">${item.quantity}</span>
          <button onclick="changeQty(${index}, -1)" class="w-8 h-8 border rounded flex items-center justify-center hover:bg-gray-100">-</button>
        </div>
        <div class="text-right min-w-[100px]">
          <p class="font-bold">${subtotal.toFixed(2)} درهم</p>
          <button onclick="removeItem(${index})" class="text-red-500 text-sm mt-1 hover:text-red-700">
            <i class="fa-solid fa-trash-can"></i> حذف
          </button>
        </div>
      </div>
    `;
  });

  document.getElementById('subtotal').textContent = `${total.toFixed(2)} درهم`;
  document.getElementById('total').textContent = `${total.toFixed(2)} درهم`;
}

document.addEventListener('DOMContentLoaded', renderCart);
</script>

</body>
</html>
