<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سلة التسوق - VAREN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; display: none; }
    .toast.show { display: block; }
    .toast.success { background: #16a34a; }
    .toast.error { background: #dc2626; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <a href="index.html" class="text-2xl font-bold text-gray-900">VAREN</a>
    <a href="index.html" class="text-sm text-gray-600 hover:text-black">
      <i class="fa-solid fa-arrow-right ml-1"></i> متابعة التسوق
    </a>
  </div>
</nav>

<main class="max-w-3xl mx-auto px-4 py-8">
  <h1 class="text-2xl md:text-3xl font-bold mb-6 text-center">سلة التسوق</h1>
  <div id="toast" class="toast"></div>

  <!-- السلة فارغة -->
  <div id="empty-cart" class="hidden text-center py-16">
    <i class="fa-solid fa-cart-shopping text-gray-300 text-6xl mb-4"></i>
    <h2 class="text-xl font-bold text-gray-500 mb-2">السلة فارغة</h2>
    <p class="text-gray-400 mb-6">أضف منتجات للسلة أولاً</p>
    <a href="index.html" class="bg-black text-white px-6 py-2 rounded-lg inline-block hover:bg-gray-800">التصفح</a>
  </div>

  <!-- محتوى السلة -->
  <div id="cart-content" class="hidden">
    <div id="cart-items" class="space-y-4 mb-8"></div>
    <div class="bg-white rounded-xl shadow-sm p-6">
      <div class="flex justify-between text-lg mb-2">
        <span>المجموع الفرعي:</span>
        <span id="subtotal">0.00 درهم</span>
      </div>
      <div class="flex justify-between text-lg font-bold border-t pt-3 mb-4">
        <span>المجموع الكلي:</span>
        <span id="total">0.00 درهم</span>
      </div>
      <a href="checkout.html" id="checkout-link" class="block w-full bg-black text-white text-center py-3 rounded-lg font-semibold hover:bg-gray-800">
        متابعة الدفع <i class="fa-solid fa-arrow-left ml-1"></i>
      </a>
    </div>
  </div>
</main>

<script>
// ✅ إعدادات Firebase
const firebaseConfig = {
  apiKey: "AIzaSyCXYzZgFIFU2u6R02_ConvSonD9SJRWS9Q",
  authDomain: "varen-f7756.firebaseapp.com",
  projectId: "varen-f7756",
  storageBucket: "varen-f7756.firebasestorage.app",
  messagingSenderId: "648684291842",
  appId: "1:648684291842:web:f3e806fc76a6e119caa41b",
  measurementId: "G-SV7DKGPH2M"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ✅ توحيد اسم السلة
const CART_KEY = 'varen_cart_v1';

function showToast(msg, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast ${type} show`;
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function getCart() {
  const data = localStorage.getItem(CART_KEY);
  return data ? JSON.parse(data) : [];
}

function saveCart(cart) {
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
  renderCart();
}

window.removeItem = function(index) {
  const cart = getCart();
  cart.splice(index, 1);
  saveCart(cart);
  showToast('✅ تم حذف المنتج');
}

// ⚠️ تغيير الكمية مع التحقق من مخزون الـ variant المحدد (لون+مقاس)
window.changeQty = async function(index, delta) {
  const cart = getCart();
  const item = cart[index];
  const key = item.qty !== undefined ? 'qty' : 'quantity';
  const currentQty = item[key] || 1;
  const newQty = currentQty + delta;

  // لا نسمح بأن تصبح أقل من 1
  if (newQty < 1) return;

  // نجلب أحدث بيانات المخزون من قاعدة البيانات
  try {
    const productDoc = await db.collection('products').doc(item.id).get();
    if (!productDoc.exists) {
      showToast(`❌ المنتج "${item.name}" غير متوفر حالياً`, 'error');
      return;
    }

    const productData = productDoc.data();
    const variants = productData.variants || [];

    // نبحث عن الـ variant المطابق للون والمقاس
    const variant = variants.find(v => 
      v.color === item.color && v.size === item.size
    );

    if (!variant) {
      showToast(`❌ الخيار (${item.color} - ${item.size}) غير متوفر حالياً`, 'error');
      return;
    }

    if (newQty > variant.stock) {
      showToast(`⚠️ المتوفر فقط لهذا الخيار: ${variant.stock} قطعة — لا يمكن زيادة الكمية`, 'error');
      return;
    }

    cart[index][key] = newQty;
    saveCart(cart);
  } catch (err) {
    console.error(err);
    showToast('❌ خطأ في التحقق من المخزون', 'error');
  }
}

async function renderCart() {
  const cart = getCart();
  const emptyState = document.getElementById('empty-cart');
  const content = document.getElementById('cart-content');
  const itemsCont = document.getElementById('cart-items');

  if (cart.length === 0) {
    emptyState.classList.remove('hidden');
    content.classList.add('hidden');
    return;
  }

  emptyState.classList.add('hidden');
  content.classList.remove('hidden');
  itemsCont.innerHTML = '';

  let total = 0;
  let hasStockIssue = false;

  for (let index = 0; index < cart.length; index++) {
    const item = cart[index];
    const qty = item.qty || item.quantity || 1;
    const price = Number(item.price);
    const subtotal = price * qty;
    total += subtotal;

    // نتحقق من مخزون الـ variant المحدد ونعرض تنبيه لو محدود
    let stockWarning = '';
    let isUnavailable = false;

    try {
      const productDoc = await db.collection('products').doc(item.id).get();
      if (productDoc.exists) {
        const productData = productDoc.data();
        const variants = productData.variants || [];

        const variant = variants.find(v => 
          v.color === item.color && v.size === item.size
        );

        if (!variant) {
          stockWarning = `<p class="text-red-500 text-xs mt-1">❌ هذا الخيار غير متوفر — ربما تم حذفه أو نفذ تماماً</p>`;
          isUnavailable = true;
          hasStockIssue = true;
        } else if (variant.stock <= 0) {
          stockWarning = `<p class="text-red-500 text-xs mt-1">❌ نفذ من المخزون — المتوفر: 0 قطع</p>`;
          isUnavailable = true;
          hasStockIssue = true;
        } else if (qty > variant.stock) {
          stockWarning = `<p class="text-red-500 text-xs mt-1">⚠️ الكمية المطلوبة (${qty}) أكثر من المتوفر (${variant.stock})</p>`;
          hasStockIssue = true;
        } else if (variant.stock <= 3) {
          stockWarning = `<p class="text-orange-500 text-xs mt-1">⚠️ تبقى فقط ${variant.stock} قطع لهذا الخيار</p>`;
        }
      }
    } catch (e) {
      console.error(e);
    }

    itemsCont.innerHTML += `
      <div class="bg-white rounded-xl shadow-sm p-4 flex items-center gap-4 ${isUnavailable?'opacity-60':''}">
        <img src="${item.image || item.img || 'https://via.placeholder.com/100x100'}" alt="${item.name}" class="w-20 h-20 object-cover rounded-lg">
        <div class="flex-1">
          <h3 class="font-bold text-lg">${item.name}</h3>
          <p class="text-sm text-gray-600">المقاس: ${item.size || 'غير محدد'} | اللون: ${item.color || 'غير محدد'}</p>
          <p class="font-semibold mt-1">${price.toFixed(2)} درهم</p>
          ${stockWarning}
        </div>
        <div class="flex flex-col items-center gap-1">
          <button onclick="changeQty(${index}, 1)" class="w-8 h-8 border rounded flex items-center justify-center hover:bg-gray-100 ${isUnavailable?'opacity-50 cursor-not-allowed':''}" ${isUnavailable?'disabled':''}>+</button>
          <span class="font-medium">${qty}</span>
          <button onclick="changeQty(${index}, -1)" class="w-8 h-8 border rounded flex items-center justify-center hover:bg-gray-100 ${isUnavailable?'opacity-50 cursor-not-allowed':''}" ${isUnavailable?'disabled':''}>-</button>
        </div>
        <div class="text-right min-w-[100px]">
          <p class="font-bold">${subtotal.toFixed(2)} درهم</p>
          <button onclick="removeItem(${index})" class="text-red-500 text-sm mt-1 hover:text-red-700">
            <i class="fa-solid fa-trash-can"></i> حذف
          </button>
        </div>
      </div>
    `;
  }

  // تعطيل زر الدفع لو فيه مشكلة في المخزون
  const checkoutLink = document.getElementById('checkout-link');
  if (hasStockIssue) {
    checkoutLink.classList.add('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
    checkoutLink.innerHTML = 'أصلح الكميات أولاً <i class="fa-solid fa-exclamation-triangle ml-1"></i>';
  } else {
    checkoutLink.classList.remove('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
    checkoutLink.innerHTML = 'متابعة الدفع <i class="fa-solid fa-arrow-left ml-1"></i>';
  }

  document.getElementById('subtotal').textContent = `${total.toFixed(2)} درهم`;
  document.getElementById('total').textContent = `${total.toFixed(2)} درهم`;
}

document.addEventListener('DOMContentLoaded', renderCart);
</script>

</body>
</html>
