<script>

// إعدادات الترجمة
// ====================================
const translations = {
  ar: {
    page_title: "سلة التسوق - VAREN",
    back: "الرجوع للخلف",
    empty_cart: "السلة فارغة حالياً",
    empty_hint: "تصفح منتجاتنا وأضف ما يعجبك إلى سلتك",
    continue_shopping: "تصفح المنتجات",
    product: "المنتج",
    color: "اللون",
    size: "المقاس",
    quantity: "الكمية",
    price: "السعر",
    subtotal: "المجموع الفرعي",
    shipping: "رسوم التوصيل",
    free_shipping: "مجاني",
    total: "المجموع الكلي",
    checkout: "إتمام الطلب الآن",
    remove: "حذف",
    added: "✅ تم تحديث السلة",
    removed: "✅ تم حذف المنتج",
    max_qty: "⚠️ الكمية تتجاوز المخزون المتاح",
    cart_empty: "السلة فارغة، لا يمكن إتمام الطلب",
    items_count: "قطعة"
  },
  en: {
    page_title: "Shopping Cart - VAREN",
    back: "Go Back",
    empty_cart: "Your cart is empty",
    empty_hint: "Browse our products and add items to your cart",
    continue_shopping: "Browse Products",
    product: "Product",
    color: "Color",
    size: "Size",
    quantity: "Quantity",
    price: "Price",
    subtotal: "Subtotal",
    shipping: "Shipping",
    free_shipping: "Free",
    total: "Total",
    checkout: "Proceed to Checkout",
    remove: "Remove",
    added: "✅ Cart updated",
    removed: "✅ Item removed",
    max_qty: "⚠️ Exceeds available stock",
    cart_empty: "Cart is empty, cannot checkout",
    items_count: "items"
  }
};

// ====================================
// دوال اللغة
// ====================================
function setLanguage(lang) {
  if (!translations[lang]) lang = 'ar';
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  localStorage.setItem('varen_lang', lang);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (translations[lang][key]) el.textContent = translations[lang][key];
  });
}
function getCurrentLanguage() {
  return localStorage.getItem('varen_lang') || 'ar';
}
function t(key) {
  return translations[getCurrentLanguage()][key] || key;
}

// ====================================
// إعدادات فايربيز
// ====================================
const firebaseConfig = {
  apiKey: "AIzaSyCXYzZgFIFU2u6R02_ConvSonD9SJRWS9Q",
  authDomain: "varen-f7756.firebaseapp.com",
  projectId: "varen-f7756",
  storageBucket: "varen-f7756.firebasestorage.app",
  messagingSenderId: "648684291842",
  appId: "1:648684291842:web:f3e806fc76a6e119caa41b",
  measurementId: "G-SV7DKGPH2M"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
</script>

<nav class="bg-white shadow-md sticky top-0 z-50">

<main class="max-w-7xl mx-auto px-4 py-8">

  <!-- حالة السلة الفارغة -->
  <div id="empty-cart" class="hidden text-center py-20">
    <i class="fa-solid fa-cart-shopping text-7xl text-gray-300 mb-6"></i>
    <p class="text-2xl text-gray-500 mb-3" data-i18n="empty_cart">السلة فارغة حالياً</p>
    <p class="text-gray-400 mb-8" data-i18n="empty_hint">تصفح منتجاتنا وأضف ما يعجبك إلى سلتك</p>
    <a href="index.html" class="bg-black text-white px-8 py-3 rounded-lg font-semibold text-lg inline-block hover:bg-gray-800 transition-colors">
      <i class="fa-solid fa-store ml-2"></i> <span data-i18n="continue_shopping">تصفح المنتجات</span>
    </a>
  </div>

  <!-- قائمة السلة -->
  <div id="cart-content" class="space-y-4 mb-8">
    <!-- سيتم ملؤها بالجافاسكريبت -->
  </div>

  <!-- ملخص الطلب -->
  <div id="summary" class="hidden mt-6 bg-white rounded-xl shadow-sm p-6 border md:w-1/2 md:mr-auto">
    <h2 class="text-xl font-bold mb-4 border-b pb-2">ملخص الطلب</h2>
    <div class="space-y-3 mb-4">
      <div class="flex justify-between text-lg">
        <span data-i18n="subtotal">المجموع الفرعي</span>
        <span id="subtotal">0 درهم</span>
      </div>
      <div class="flex justify-between text-lg text-gray-600">
        <span data-i18n="shipping">رسوم التوصيل</span>
        <span data-i18n="free_shipping" class="text-green-600 font-medium">مجاني</span>
      </div>
      <hr class="my-2">
      <div class="flex justify-between text-xl font-bold">
        <span data-i18n="total">المجموع الكلي</span>

    </div>

<!-- رسائل التنبيه -->
<div id="toast" class="toast"></div>

<script>
// ====================================
// دوال مساعدة
// ====================================
function showToast(msg, type='success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast ${type} show`;
  setTimeout(() => toast.classList.remove('show'), 4000);
}

function toggleLanguage() {
  const current = getCurrentLanguage();
  const newLang = current === 'ar' ? 'en' : 'ar';
  setLanguage(newLang);
  document.getElementById('lang-btn').textContent = newLang === 'ar' ? 'English' : 'العربية';
  renderCart();
}

function formatPrice(amount) {
  const lang = getCurrentLanguage();
  const num = Number(amount) || 0;
  return `${num.toFixed(2)} ${lang === 'ar' ? 'درهم' : 'AED'}`;
}

// ====================================
// دوال السلة
// ====================================
function getCart() {
  return JSON.parse(localStorage.getItem('varen_cart_v1') || '[]');
}

function saveCart(cart) {
  localStorage.setItem('varen_cart_v1', JSON.stringify(cart));
  renderCart();
  updateCartCounter();
}

function updateCartCounter() {
  const cart = getCart();
  const total = cart.reduce((sum, item) => sum + (Number(item.qty) || 0), 0);
  document.querySelectorAll('.cart-counter').forEach(el => el.textContent = total);
}

// ====================================
// عرض السلة
// ====================================
function renderCart() {
  const cart = getCart();
  const emptyEl = document.getElementById('empty-cart');
  const contentEl = document.getElementById('cart-content');
  const summaryEl = document.getElementById('summary');
  const lang = getCurrentLanguage();

  if (cart.length === 0) {
    emptyEl.classList.remove('hidden');
    contentEl.innerHTML = '';
    summaryEl.classList.add('hidden');
    return;
  }

  emptyEl.classList.add('hidden');
  summaryEl.classList.remove('hidden');

  let subtotal = 0;
  contentEl.innerHTML = '';

  cart.forEach((item, idx) => {
    const price = Number(item.price) || 0;
    const qty = Number(item.qty) || 1;
    const total = price * qty;
    subtotal += total;
    const img = item.image || 'https://via.placeholder.com/150';
    const maxStock = Number(item.variantStock) || 999;

    contentEl.innerHTML += `
      <div class="cart-item bg-white rounded-xl shadow-sm p-4 border flex flex-col sm:flex-row gap-4 items-center">
        <img src="${img}" alt="${item.name}" class="w-28 h-28 object-cover rounded-lg">
        <div class="flex-1 w-full text-center sm:text-right">
          <h3 class="font-bold text-xl mb-2">${item.name || 'منتج'}</h3>
          <p class="text-sm text-gray-500 space-x-2 space-x-reverse">
            <span><strong data-i18n="color">${translations[lang].color}:</strong> ${item.color || '-'}</span>
            <span> | </span>
            <span><strong data-i18n="size">${translations[lang].size}:</strong> ${item.size || '-'}</span>
          </p>
          <p class="font-semibold text-xl mt-2 text-black">${formatPrice(price)}</p>
        </div>
        <div class="flex items-center border rounded-lg overflow-hidden">
          <button class="qty-btn px-4 py-2 bg-gray-50 hover:bg-gray-200 transition-colors" onclick="changeQty(${idx}, -1)">-</button>
          <span class="px-4 font-bold text-lg">${qty}</span>
          <button class="qty-btn px-4 py-2 bg-gray-50 hover:bg-gray-200 transition-colors" onclick="changeQty(${idx}, 1)">+</button>
        </div>
        <button onclick="removeItem(${idx})" class="text-red-500 hover:text-red-700 p-3 rounded-lg hover:bg-red-50 transition-colors" title="${translations[lang].remove}">
          <i class="fa-solid fa-trash-can fa-lg"></i>
        </button>
      </div>
    `;
  });

  document.getElementById('subtotal').textContent = formatPrice(subtotal);
  document.getElementById('total').textContent = formatPrice(subtotal);
}

// ====================================
// تعديل الكمية والحذف
// ====================================
function changeQty(index, delta) {
  const cart = getCart();
  const item = cart[index];
  if (!item) return;
  
  const maxStock = Number(item.variantStock) || 999;
  const newQty = (Number(item.qty) || 1) + delta;
  
  if (newQty < 1) return;
  if (newQty > maxStock) {
    showToast(t('max_qty'), 'warning');
    return;
  }
  
  item.qty = newQty;
  saveCart(cart);
}

function removeItem(index) {
  const cart = getCart();
  cart.splice(index, 1);
  saveCart(cart);
  showToast(t('removed'));
}

// ====================================
// الانتقال للدفع
// ====================================
function goToCheckout() {
  const cart = getCart();
  if (cart.length === 0) {
    showToast(t('cart_empty'), 'error');
    return;
  }
  window.location.href = 'checkout.html';
}

// ====================================
// عند تحميل الصفحة
// ====================================
document.addEventListener('DOMContentLoaded', () => {
  setLanguage(getCurrentLanguage());
  document.getElementById('lang-btn').textContent = getCurrentLanguage() === 'ar' ? 'English' : 'العربية';
  renderCart();
});
</script>
