<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سلة التسوق - VAREN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; display: none; }
    .toast.show { display: block; }
  </style>
  <script type="module">
    import * as Store from './store.js';
    window.Store = Store;
  </script>
</head>
<body class="bg-gray-50 text-gray-800">

<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <a href="index.html" class="text-2xl font-bold text-gray-900">VAREN</a>
    <div class="hidden md:flex gap-8">
      <a href="index.html" class="font-medium hover:text-gray-600">الرئيسية</a>
      <a href="category.html?gender=women" class="font-medium hover:text-gray-600">نسائي</a>
      <a href="category.html?gender=men" class="font-medium hover:text-gray-600">رجالي</a>
    </div>
    <div class="flex items-center gap-4">
      <a href="cart.html" class="text-xl relative">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
      </a>
      <div id="user-area"></div>
    </div>
  </div>
</nav>

<main class="max-w-4xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-8 text-center">سلة التسوق</h1>
  <div id="cart-content"></div>
</main>

<footer class="bg-gray-900 text-white py-8 text-center">
  <p>&copy; 2026 VAREN. جميع الحقوق محفوظة.</p>
</footer>

<div id="toast" class="toast"></div>

<script>
function renderCart() {
  const content = document.getElementById('cart-content');
  const cart = window.Store.getCart();
  window.Store.updateCartCount();

  if (cart.length === 0) {
    content.innerHTML = `
      <div class="text-center py-16">
        <i class="fa-solid fa-cart-shopping text-6xl text-gray-300 mb-4"></i>
        <p class="text-xl text-gray-500">السلة فارغة حالياً</p>
        <a href="index.html" class="inline-block mt-4 bg-black text-white px-6 py-2 rounded-lg hover:bg-gray-800">الذهاب للتسوق</a>
      </div>
    `;
    return;
  }

  let total = 0;
  content.innerHTML = `
    <div class="space-y-4">
      ${cart.map((item, idx) => {
        total += item.price * item.qty;
        return `
          <div class="bg-white p-4 rounded-xl shadow-sm flex items-center gap-4">
            <img src="${item.img || 'https://via.placeholder.com/100'}" alt="${item.name}" class="w-20 h-20 object-cover rounded-lg">
            <div class="flex-1">
              <h3 class="font-bold">${item.name}</h3>
              <p class="text-sm text-gray-500">${item.color} - ${item.size}</p>
              <p class="font-semibold">${item.price} درهم × ${item.qty} = ${item.price * item.qty}درهم</p>
            </div>
            <button onclick="removeItem(${idx})" class="text-red-500 hover:text-red-700">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        `;
      }).join('')}
    </div>
    <div class="mt-8 bg-white p-6 rounded-xl shadow-sm">
      <div class="flex justify-between text-xl font-bold mb-4">
        <span>المجموع الكلي:</span>
        <span>${total}درهم</span>
      </div>
      <a href="checkout.html" class="block w-full text-center bg-black text-white py-3 rounded-lg text-lg hover:bg-gray-800">إتمام الطلب</a>
    </div>
  `;
}

function removeItem(index) {
  const cart = window.Store.getCart();
  cart.splice(index, 1);
  window.Store.saveCart(cart);
  renderCart();
  window.Store.showToast('تم الحذف');
}

document.addEventListener('DOMContentLoaded', renderCart);
</script>
</body>
</html>
