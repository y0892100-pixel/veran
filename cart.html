<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات - VAREN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap'); * { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50">
<nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <a href="index.html" class="text-2xl font-bold">VAREN</a>
        <a href="index.html" class="text-gray-600 hover:text-black">العودة للمتجر</a>
    </div>
</nav>

<main class="max-w-4xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-bold mb-8">سلة المشتريات</h1>
    <div id="cart-items" class="space-y-4"></div>
    <div id="cart-empty" class="text-center py-16 hidden">
        <i class="fa-solid fa-cart-shopping text-6xl text-gray-300 mb-4"></i>
        <p class="text-xl text-gray-500">السلة فارغة حالياً</p>
        <a href="index.html" class="inline-block mt-4 bg-black text-white px-6 py-2 rounded-lg hover:bg-gray-800">ابدأ التسوق</a>
    </div>
    <div id="cart-summary" class="mt-8 pt-6 border-t hidden">
        <div class="flex justify-between text-xl font-bold mb-4">
            <span>المجموع الكلي:</span>
            <span id="cart-total">0 درهم</span>
        </div>
        <a href="checkout.html" class="block w-full text-center bg-black text-white py-3 rounded-lg hover:bg-gray-800">إتمام الطلب</a>
    </div>
</main>

<script>
const CART_KEY = 'fl_cart_v4';
function getCart() { return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); }
function saveCart(cart) { localStorage.setItem(CART_KEY, JSON.stringify(cart)); renderCart(); }
function removeItem(index) { const c = getCart(); c.splice(index,1); saveCart(c); }

function renderCart() {
    const cart = getCart();
    const itemsEl = document.getElementById('cart-items');
    const emptyEl = document.getElementById('cart-empty');
    const summaryEl = document.getElementById('cart-summary');
    itemsEl.innerHTML = '';

    if (!cart.length) {
        emptyEl.classList.remove('hidden');
        summaryEl.classList.add('hidden');
        return;
    }

    emptyEl.classList.add('hidden');
    summaryEl.classList.remove('hidden');
    let total = 0;
    cart.forEach((item, i) => {
        total += (item.price || 0) * (item.quantity || 1);
        itemsEl.innerHTML += `
            <div class="bg-white p-4 rounded-xl shadow-sm flex items-center gap-4">
                <img src="${item.img || ''}" class="w-20 h-20 object-cover rounded-lg">
                <div class="flex-1">
                    <h3 class="font-bold">${item.name || 'منتج'}</h3>
                    <p class="text-gray-500">${item.price || 0} درهم - الكمية: ${item.quantity || 1}</p>
                </div>
                <button onclick="removeItem(${i})" class="text-red-500"><i class="fa-solid fa-trash"></i></button>
            </div>
        `;
    });
    document.getElementById('cart-total').textContent = total + ' درهم';
}
renderCart();
</script>
</body>
</html>
