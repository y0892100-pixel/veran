<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلبات الاسترجاع - VAREN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; display: none; }
    .toast.show { display: block; }
    .toast.success { background: #16a34a; }
    .toast.error { background: #dc2626; }
  </style>
</head>
<body class="bg-gray-50">
<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <a href="index.html" class="text-2xl font-bold text-gray-900">VAREN</a>
    <div id="user-area"></div>
  </div>
</nav>
<main class="max-w-lg mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-6">طلبات الاسترجاع</h1>
  <div id="loading" class="text-center py-16"><i class="fa-solid fa-spinner fa-spin fa-2xl"></i></div>
  <div id="content" class="hidden">
    <form id="return-form" class="bg-white p-6 rounded-xl shadow-md space-y-4 mb-8">
      <h2 class="text-lg font-bold">تقديم طلب استرجاع جديد</h2>
      <div>
        <label class="block font-semibold mb-1">رقم الطلب</label>
        <input type="text" id="r-order-id" class="w-full border rounded-lg p-3" placeholder="أدخل رقم أو معرف الطلب">
      </div>
      <div>
        <label class="block font-semibold mb-1">سبب الاسترجاع</label>
        <textarea id="r-reason" class="w-full border rounded-lg p-3" rows="3" placeholder="اشرح سبب استرجاع المنتج"></textarea>
      </div>
      <button type="submit" class="w-full bg-black text-white py-3 rounded-lg font-semibold hover:bg-gray-800">إرسال الطلب</button>
    </form>
    <h2 class="text-lg font-bold mb-4">طلباتي السابقة</h2>
    <div id="returns-list"></div>
  </div>
  <div id="no-returns" class="hidden text-center py-12">
    <i class="fa-solid fa-rotate-left text-5xl text-gray-300 mb-4"></i>
    <p class="text-gray-500">لا يوجد طلبات استرجاع سابقة</p>
  </div>
  <div id="no-login" class="hidden text-center py-16">
    <i class="fa-solid fa-lock text-6xl text-gray-300 mb-4"></i>
    <p class="text-xl text-gray-500 mb-4">سجّل الدخول أولاً</p>
    <a href="login.html" class="bg-black text-white px-6 py-2 rounded-lg inline-block">تسجيل الدخول</a>
  </div>
  <div id="toast" class="toast"></div>
</main>

<script>
// ✅ إعدادات المشروع الجديد
const firebaseConfig = {
  apiKey: "AIzaSyCXYzZgFIFU2u6R02_ConvSonD9SJRWS9Q",
  authDomain: "varen-f7756.firebaseapp.com",
  projectId: "varen-f7756",
  storageBucket: "varen-f7756.firebasestorage.app",
  messagingSenderId: "648684291842",
  appId: "1:648684291842:web:f3e806fc76a6e119caa41b",
  measurementId: "G-SV7DKGPH2M"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const ADMIN_EMAIL = 'y0892100@gmail.com';

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 4000);
}

// ✅ القائمة المنسدلة للحساب
function updateUserNav(user) {
  const area = document.getElementById('user-area');
  if (!user) {
    area.innerHTML = `<button onclick="window.location.href='login.html'" class="bg-black text-white px-4 py-2 rounded-lg">تسجيل الدخول</button>`;
    return;
  }
  const isAdmin = user.email === ADMIN_EMAIL;
  area.innerHTML = `
    <div class="relative group">
      <button class="flex items-center gap-2 bg-gray-100 px-3 py-2 rounded-lg">
        <i class="fa-solid fa-user-circle"></i>
        <span>${user.displayName || 'حسابي'}</span>
        <i class="fa-solid fa-chevron-down text-xs mr-1 transition-transform group-hover:rotate-180"></i>
      </button>
      <div class="absolute left-0 mt-2 w-56 bg-white rounded-lg shadow-xl border invisible group-hover:visible opacity-0 group-hover:opacity-100 transition-all duration-200 z-50">
        <a href="account.html" class="block px-4 py-3 hover:bg-gray-50 border-b">بيانات الحساب</a>
        <a href="orders.html" class="block px-4 py-3 hover:bg-gray-50 border-b">طلباتي</a>
        <a href="returns.html" class="block px-4 py-3 hover:bg-gray-50 border-b">طلبات الاسترجاع</a>
        ${isAdmin ? `<a href="admin.html" class="block px-4 py-3 hover:bg-gray-50 border-b text-red-600">لوحة التحكم</a>` : ''}
        <button onclick="logout()" class="w-full text-right px-4 py-3 hover:bg-gray-50 text-red-500">تسجيل الخروج</button>
      </div>
    </div>
  `;
}

window.logout = async () => {
  await auth.signOut();
  window.location.href = 'index.html';
};

auth.onAuthStateChanged(async user => {
  document.getElementById('loading').classList.add('hidden');
  
  if (!user) {
    document.getElementById('no-login').classList.remove('hidden');
    return;
  }
  
  document.getElementById('content').classList.remove('hidden');
  updateUserNav(user);

  // ✅ إرسال طلب استرجاع
  document.getElementById('return-form').addEventListener('submit', async e => {
    e.preventDefault();
    const orderId = document.getElementById('r-order-id').value.trim();
    const reason = document.getElementById('r-reason').value.trim();
    
    if (!orderId || !reason) return showToast('املأ جميع الحقول', 'error');
    
    try {
      await db.collection('returns').add({
        userId: user.uid,
        userEmail: user.email,
        orderId,
        reason,
        status: 'قيد المراجعة',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      showToast('✅ تم إرسال طلب الاسترجاع');
      document.getElementById('return-form').reset();
      loadReturns();
    } catch (err) {
      showToast('خطأ في الإرسال: ' + err.message, 'error');
    }
  });

  // ✅ تحميل طلبات الاسترجاع
  async function loadReturns() {
    try {
      const snapshot = await db.collection('returns')
        .where('userId', '==', user.uid)
        .get();

      const list = document.getElementById('returns-list');
      list.innerHTML = '';
      
      if (snapshot.empty) {
        document.getElementById('no-returns').classList.remove('hidden');
        return;
      }
      
      document.getElementById('no-returns').classList.add('hidden');
      
      // ترتيب من الأحدث للأقدم
      let returns = [];
      snapshot.forEach(doc => {
        returns.push({ id: doc.id, ...doc.data() });
      });
      returns.sort((a, b) => {
        const dateA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(0);
        const dateB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(0);
        return dateB - dateA;
      });

      returns.forEach(r => {
        const date = r.createdAt?.toDate 
          ? new Date(r.createdAt.toDate()).toLocaleDateString('ar-AE') 
          : 'غير محدد';
        
        const statusClass = 
          r.status === 'قيد المراجعة' ? 'bg-yellow-100 text-yellow-700' :
          r.status === 'مقبول' ? 'bg-green-100 text-green-700' : 
          r.status === 'مرفوض' ? 'bg-red-100 text-red-700' :
          'bg-gray-100 text-gray-700';

        list.innerHTML += `
          <div class="bg-white p-4 rounded-lg shadow-sm mb-3 border">
            <div class="flex justify-between items-center mb-2">
              <span class="font-semibold">طلب: ${r.orderId}</span>
              <span class="px-2 py-1 rounded text-xs font-medium ${statusClass}">${r.status}</span>
            </div>
            <p class="text-sm text-gray-600 mb-1">التاريخ: ${date}</p>
            <p class="text-sm">السبب: ${r.reason}</p>
          </div>
        `;
      });
    } catch (err) {
      console.error(err);
      document.getElementById('returns-list').innerHTML = `<p class="text-red-500">خطأ في التحميل: ${err.message}</p>`;
    }
  }

  loadReturns();
});
</script>
</body>
</html>
