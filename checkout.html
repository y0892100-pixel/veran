<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إتمام الطلب - VAREN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
    * { font-family: 'Cairo', sans-serif; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; display: none; }
    .toast.show { display: block; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import firebaseConfig from './firebase-config.js';
    import * as Store from './store.js';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    window.app = { auth, db, onAuthStateChanged, collection, addDoc, serverTimestamp };
    window.Store = Store;
  </script>
</head>
<body class="bg-gray-50 text-gray-800">

<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <a href="index.html" class="text-2xl font-bold text-gray-900">VAREN</a>
    <div class="hidden md:flex gap-8">
      <a href="index.html" class="font-medium hover:text-gray-600">الرئيسية</a>
    </div>
    <div class="flex items-center gap-4">
      <a href="cart.html" class="text-xl relative">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
      </a>
    </div>
  </div>
</nav>

<main class="max-w-2xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-8 text-center">إتمام الطلب</h1>
  <form id="checkout-form" class="bg-white p-6 rounded-xl shadow-md space-y-4">
    <div>
      <label class="block font-semibold mb-1">الاسم الكامل</label>
      <input type="text" id="full-name" class="w-full border rounded-lg p-3" required>
    </div>
    <div>
      <label class="block font-semibold mb-1">رقم الهاتف</label>
      <input type="tel" id="phone" class="w-full border rounded-lg p-3" required>
    </div>
    <div>
      <label class="block font-semibold mb-1">العنوان بالكامل</label>
      <textarea id="address" class="w-full border rounded-lg p-3" rows="3" required></textarea>
    </div>
    <div>
      <label class="block font-semibold mb-1">ملاحظات (اختياري)</label>
      <textarea id="notes" class="w-full border rounded-lg p-3" rows="2"></textarea>
    </div>
    <div class="bg-gray-50 p-4 rounded-lg">
      <h3 class="font-bold text-lg mb-2">ملخص الطلب</h3>
      <p class="text-xl font-bold">المجموع: <span id="total-amount">0</span> درهم</p>
    </div>
    <button type="submit" class="w-full bg-black text-white py-3 rounded-lg text-lg hover:bg-gray-800">تأكيد الطلب</button>
  </form>
</main>

<footer class="bg-gray-900 text-white py-8 text-center">
  <p>&copy; 2026 VAREN. جميع الحقوق محفوظة.</p>
</footer>

<div id="toast" class="toast"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  window.Store.updateCartCount();
  const total = window.Store.getCartTotal();
  document.getElementById('total-amount').textContent = total;

  document.getElementById('checkout-form').addEventListener('submit', async e => {
    e.preventDefault();
    const cart = window.Store.getCart();
    if (cart.length === 0) {
      window.Store.showToast('السلة فارغة!', 'error');
      return;
    }

    const user = window.app.auth.currentUser;
    if (!user) {
      window.Store.showToast('سجل دخول أولاً', 'error');
      return;
    }

    const orderData = {
      userId: user.uid,
      userName: document.getElementById('full-name').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      address: document.getElementById('address').value.trim(),
      notes: document.getElementById('notes').value.trim(),
      items: cart,
      total: total,
      status: 'جديد',
      createdAt: window.app.serverTimestamp()
    };

    try {
      await window.app.addDoc(window.app.collection(window.app.db, 'orders'), orderData);
      window.Store.clearCart();
      window.Store.showToast('تم تأكيد طلبك ✅');
      setTimeout(() => window.location.href = 'index.html', 1500);
    } catch (err) {
      window.Store.showToast('خطأ: ' + err.message, 'error');
    }
  });
});
</script>
<!-- EmailJS Library -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<script>
  // تهيئة EmailJS
  (function(){
    emailjs.init("3A0NspFA3vISd64jc");
  })();

  // إرسال إشعار بالطلب الجديد
  async function sendOrderEmail(orderData) {
    const serviceID = "service_pz0cxlr";
    const templateID = "template_g6k71ll";

    const templateParams = {
      to_email: "y0892100@gmail.com",
      customer_name: orderData.name,
      customer_email: orderData.email,
      customer_phone: orderData.phone,
      customer_address: orderData.address,
      order_items: orderData.itemsText,
      order_total: orderData.total,
      order_date: new Date().toLocaleString('ar-AE'),
      order_id: orderData.orderId
    };

    try {
      const response = await emailjs.send(serviceID, templateID, templateParams);
      console.log("✅ تم إرسال الإيميل بنجاح", response.status, response.text);
      return true;
    } catch (error) {
      console.error("❌ فشل إرسال الإيميل:", error);
      return false;
    }
  }

  // مثال: دالة تُستدعى عند إكمال الطلب
  async function completeOrderAndNotify(orderData) {
    try {
      // 1. احفظ الطلب في Firestore أولاً
      const orderRef = await db.collection('orders').add({
        ...orderData,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        status: 'جديد'
      });

      // أضف رقم الطلب للبيانات
      orderData.orderId = orderRef.id;

      // 2. أرسل إيميل الإشعار
      await sendOrderEmail(orderData);

      alert("✅ تم استلام طلبك بنجاح! سنتواصل معك قريباً");
      window.location.href = 'index.html';
    } catch (err) {
      console.error("❌ خطأ في إتمام الطلب:", err);
      alert("حدث خطأ، يرجى المحاولة مرة أخرى");
    }
  }
</script>
</body>
</html>
